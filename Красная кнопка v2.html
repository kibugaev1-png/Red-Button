    ctx.fillStyle = '#3a3e43'; ctx.fillRect(7, 1.2, 3.4, 4.6);   // спусковая скоба
    dark(2.5, 1.2, 3.2, 6.4, 0.8);              // магазин
    steel(15.5, -2.4, 2.6, 2.4, 0.6);           // дуло
    sight(13.5, 1.4); sight(2, 1.2);
  } else if (kind === 'revolver') {
    steel(0, -3, 13, 4, 1);
    ctx.fillStyle = '#55595f';
    ctx.beginPath(); ctx.arc(3.6, -0.4, 3.4, 0, 7); ctx.fill();   // барабан
    ctx.fillStyle = '#33373c';
    for (let i = 0; i < 6; i++) {
      const a = i * Math.PI / 3;
      ctx.beginPath(); ctx.arc(3.6 + Math.cos(a) * 2, -0.4 + Math.sin(a) * 2, 0.7, 0, 7); ctx.fill();
    }
    wood(0.5, 1, 5, 8, 2);                      // деревянная рукоять
    steel(12.5, -2.2, 6, 2.2, 0.6);             // ствол
    ctx.fillStyle = '#3a3e43'; ctx.fillRect(6.5, 1.2, 3.2, 4.2);
    sight(17, 1.2); sight(1, 1.4);
  } else if (kind === 'smg') {
    steel(0, -3, 22, 4.4, 1);
    gloss(1, -2.8, 18);
    dark(3, 1, 4.6, 10, 1.2);                   // длинный магазин
    dark(11, 1, 4, 5, 1);                       // рукоять удержания
    wood(-8, -2.4, 8, 4.4, 1.5);                // приклад-дерево
    steel(21, -2.2, 4, 2.2, 0.6);
    ctx.fillStyle = '#3a3e43'; ctx.fillRect(8, 1.2, 3, 4);
    sight(19, 1.6); sight(2, 1.4);
  } else if (kind === 'shotgun') {
    steel(0, -3, 26, 4.6, 1);
    wood(-11, -2.6, 11, 5, 2);                  // приклад
    wood(9, 1, 10, 3.4, 1.5);                   // цевьё-помпа
    dark(19.5, 1.2, 3, 2.6, 0.8);
    steel(25, -2.4, 6, 2.6, 0.6);               // длинный ствол
    ctx.fillStyle = '#3a3e43'; ctx.fillRect(5, 1.2, 3.2, 4.2);
    gloss(1, -2.8, 22);
    sight(29, 1.2);
  } else if (kind === 'sawnoff') {
    // два коротких ствола, спиленный приклад — только пистолетная рукоять
    steel(0, -3, 13, 4.6, 1);
    steel(12, -2.8, 7, 2.0, 0.5);               // верхний ствол
    steel(12, -0.6, 7, 2.0, 0.5);               // нижний ствол
    dark(18.6, -2.8, 0.9, 4.2, 0.3);            // срез стволов
    wood(-4.5, -2.2, 5, 4.4, 1.5);              // остаток приклада
    ctx.fillStyle = '#5d411f';                  // пистолетная рукоять
    ctx.beginPath(); ctx.moveTo(-1, 1.6); ctx.lineTo(3.4, 1.6);
    ctx.quadraticCurveTo(2.2, 8.4, -2.2, 8.0); ctx.fill();
    ctx.fillStyle = '#3a3e43'; ctx.fillRect(4.2, 1.4, 3.0, 3.6);
    gloss(1, -2.8, 10);
  } else if (kind === 'rifle') {
    steel(0, -3, 27, 4.4, 1);
    gloss(1, -2.8, 22);
    dark(4, 1, 5, 10, 1.4);                     // изогнутый магазин
    ctx.fillStyle = '#2a2d31';
    ctx.beginPath(); ctx.moveTo(4, 8); ctx.quadraticCurveTo(6, 12, 9.5, 11.5); ctx.lineTo(9, 8); ctx.fill();
    wood(-10, -2.4, 10, 4.6, 1.5);              // приклад
    wood(12, 0.8, 8, 3.2, 1.2);                 // накладка
    steel(26.5, -2.2, 5, 2.2, 0.6);
    dark(30.5, -2.6, 2.4, 3, 0.6);              // дульный тормоз
    ctx.fillStyle = '#3a3e43'; ctx.fillRect(9.5, 1.2, 3, 4.2);
    sight(24, 2.2); sight(3, 2);
  } else if (kind === 'sniper') {
    steel(0, -2.6, 30, 3.8, 1);
    wood(-12, -2.6, 12, 5, 2);
    wood(10, 0.6, 10, 3, 1.2);
    steel(29, -2, 8, 2, 0.5);                   // длинный ствол
    // оптика
    dark(6, -7.4, 14, 3.6, 1.8);
    ctx.fillStyle = '#8fb0c0';
    ctx.beginPath(); ctx.ellipse(19.6, -5.6, 1, 1.5, 0, 0, 7); ctx.fill();
    dark(9, -4, 1.6, 1.6, 0.4); dark(16, -4, 1.6, 1.6, 0.4);
    ctx.fillStyle = '#4a4f55'; ctx.fillRect(3.5, -3.4, 4, 1.6);   // рукоять затвора
    ctx.beginPath(); ctx.arc(7.5, -2.6, 1.1, 0, 7); ctx.fill();
    ctx.fillStyle = '#3a3e43'; ctx.fillRect(7, 1.2, 3, 4.2);
  } else {
    // пулемёт: короб, лента, сошки
    steel(-4, -3.6, 36, 5.6, 1.4);
    gloss(-2, -3.4, 30);
    ctx.fillStyle = '#3f4348';
    ctx.beginPath(); ctx.roundRect(2, 2, 13, 7.6, 1.6); ctx.fill();  // патронный короб
    ctx.fillStyle = '#a58b4a';
    for (let i = 0; i < 5; i++) ctx.fillRect(14 + i * 2.2, 3.4 + i * 0.5, 1.8, 2.2);  // лента
    dark(-12, -3.2, 9, 6.4, 1.8);               // приклад
    steel(31, -2.6, 7, 2.6, 0.6);
    dark(37, -3, 2.6, 3.4, 0.6);
    ctx.strokeStyle = '#33373c'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(24, 3); ctx.lineTo(28, 9); ctx.moveTo(32, 3); ctx.lineTo(28, 9); ctx.stroke();
    ctx.fillStyle = '#3a3e43'; ctx.fillRect(0, 1.4, 3.2, 4.4);
    sight(28, 2.4); sight(4, 2.6);
  }
  ctx.restore();
}

// зомби: тот же каркас, но перекошенный и гнилой
function drawZombie(ctx, px, py, z) {
  const t = z.type || { skin: '#79906f', rag: '#4e4b3f', scale: 1 };
  const face = z.face;
  const ph = z.phase;
  const sc = t.scale || 1;
  const skin = z.pale ? shade(t.skin, 1.12) : t.skin;
  const skinD = shade(skin, 0.72);
  const rags = t.rag;

  ctx.save();
  ctx.translate(px, py);
  ctx.scale(face * sc, sc);

  // ---- четвероногие: пёс, волк, гончая ----
  if (t.quad) {
    const bodyY = -16, gait = Math.sin(ph * 1.6);
    ctx.translate(0, -Math.abs(gait) * 1.6);
    // задние и передние лапы
    for (const [ox, off, back] of [[-8, 0, true], [-6, 1.9, false], [7, 0.9, true], [9, 2.8, false]]) {
      const sw = Math.sin(ph * 1.6 + off) * 0.7;
      const [kx, ky] = limb(ctx, ox, bodyY + 3, 8, sw + 0.2, 3.4 * (back ? 0.85 : 1), back ? shade(skin, 0.66) : skinD);
      limb(ctx, kx, ky, 8, -sw * 0.6 + 0.3, 2.8, back ? shade(skin, 0.6) : shade(skinD, 0.9));
    }
    // корпус
    const bg = ctx.createLinearGradient(0, bodyY - 7, 0, bodyY + 5);
    bg.addColorStop(0, shade(skin, 1.08)); bg.addColorStop(1, skinD);
    ctx.fillStyle = bg;
    ctx.beginPath(); ctx.ellipse(0, bodyY, 12, 6.4, 0, 0, 7); ctx.fill();
    // рёбра наружу
    ctx.strokeStyle = 'rgba(30,28,24,0.35)'; ctx.lineWidth = 0.8;
    for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(i * 3, bodyY - 4); ctx.lineTo(i * 3 + 1, bodyY + 3); ctx.stroke(); }
    // хвост
    ctx.strokeStyle = skinD; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(-11, bodyY - 1);
    ctx.quadraticCurveTo(-17, bodyY - 4 + gait * 2, -19, bodyY - 9 + gait * 3); ctx.stroke();
    // шея и морда
    ctx.strokeStyle = skin; ctx.lineWidth = 5.5;
    ctx.beginPath(); ctx.moveTo(8, bodyY - 2); ctx.lineTo(14, bodyY - 6); ctx.stroke();
    ctx.fillStyle = skin;
    ctx.beginPath(); ctx.ellipse(15.5, bodyY - 7, 5, 4, -0.2, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(18, bodyY - 6); ctx.lineTo(23, bodyY - 4.5); ctx.lineTo(18, bodyY - 3); ctx.fill();
    // уши, глаз, клыки
    ctx.fillStyle = skinD;
    ctx.beginPath(); ctx.moveTo(13, bodyY - 10); ctx.lineTo(15, bodyY - 15); ctx.lineTo(17, bodyY - 10); ctx.fill();
    ctx.fillStyle = t.burn ? '#e06a3a' : '#c9432c';
    ctx.beginPath(); ctx.arc(17, bodyY - 7.5, 1.1, 0, 7); ctx.fill();
    ctx.fillStyle = '#d8d2c0';
    ctx.fillRect(19, bodyY - 4, 2.4, 1.6);
    ctx.restore();
    zHealthBar(ctx, px, py, z, sc);
    return;
  }

  // ---- двуногие ----
  const hipY = -23, shoulderY = -40;
  const fat = t.fat ? 1.35 : 1;
  ctx.translate(0, -Math.abs(Math.sin(ph)) * 1.4);
  for (const [off, back] of [[Math.PI, true], [0, false]]) {
    const th = Math.sin(ph + off) * 0.6, kn = th - Math.max(0, Math.sin(ph + off + 1)) * 0.7;
    const [kx, ky] = limb(ctx, 0, hipY, 12, th + 0.14, 7.5 * fat, back ? shade(rags, 0.72) : rags);
    limb(ctx, kx, ky, 11, kn + 0.14, 6.4, back ? shade(skin, 0.6) : skinD);
  }
  // руки: со стволом держат оружие, без — тянутся вперёд
  if (t.gun) {
    const ang = 0.1;
    limb(ctx, -1, shoulderY + 3, 10, Math.PI / 2 - 0.4, 6, shade(skin, 0.68));
    drawWeapon(ctx, 8, shoulderY + 4, ang, t.gun, 0);
    limb(ctx, 0, shoulderY + 3, 11, Math.PI / 2 - ang, 6, skin);
  } else {
    for (const [off, back] of [[0.5, true], [0, false]]) {
      const ah = 1.15 + Math.sin(ph * 0.8 + off) * 0.18;
      const [ex, ey] = limb(ctx, 0, shoulderY + 3, 10, ah, 6, back ? shade(skin, 0.68) : skin);
      limb(ctx, ex, ey, 10, ah + 0.35, 5.2, back ? shade(skin, 0.62) : skinD);
    }
  }
  // торс
  ctx.save(); ctx.rotate(t.low ? 0.5 : 0.16);
  ctx.fillStyle = rags;
  ctx.beginPath();
  ctx.moveTo(-6 * fat, shoulderY + 1); ctx.quadraticCurveTo(-7 * fat, hipY - 8, -5 * fat, hipY + 1);
  ctx.lineTo(5 * fat, hipY + 1); ctx.quadraticCurveTo(7 * fat, hipY - 9, 6 * fat, shoulderY + 1);
  ctx.quadraticCurveTo(0, shoulderY - 2, -6 * fat, shoulderY + 1); ctx.fill();
  ctx.fillStyle = skinD; ctx.fillRect(-3, hipY - 12, 5, 7);
  ctx.fillStyle = '#6b3b34'; ctx.fillRect(1, hipY - 9, 3.5, 5);
  // бронежилет
  if (t.armor) {
    ctx.fillStyle = '#3f4a3c';
    ctx.beginPath(); ctx.roundRect(-6 * fat, shoulderY + 2, 12 * fat, 13, 2); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.08)'; ctx.fillRect(-6 * fat, shoulderY + 2, 12 * fat, 2);
    ctx.fillStyle = '#2c342a'; ctx.fillRect(-2, shoulderY + 6, 4, 8);
  }
  ctx.fillStyle = shade(skin, 0.9); ctx.fillRect(-2, shoulderY - 4, 4.4, 6);
  ctx.restore();
  // голова
  ctx.save(); ctx.translate(1.5, shoulderY - 7); ctx.rotate(t.low ? 0.5 : 0.2);
  ctx.fillStyle = skin; ctx.beginPath(); ctx.ellipse(0, 0, 5.2, 6, 0, 0, 7); ctx.fill();
  if (t.burn) {
    ctx.fillStyle = 'rgba(30,24,20,0.5)';
    ctx.beginPath(); ctx.ellipse(-1, 1, 4.4, 4.8, 0, 0, 7); ctx.fill();
  }
  ctx.fillStyle = t.boss ? '#ffb03a' : '#2a1f1c';
  ctx.beginPath(); ctx.ellipse(2.6, -1.4, 1.5, 1.8, 0, 0, 7); ctx.fill();
  ctx.fillStyle = '#d8d2c0'; ctx.fillRect(1.5, 2.6, 3.4, 1.4);
  if (t.mask) {
    ctx.fillStyle = '#3c4038'; ctx.beginPath(); ctx.ellipse(0.6, 0.4, 5.6, 6.2, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#5f7466'; ctx.beginPath(); ctx.ellipse(2.4, -1, 3, 2.5, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#4a4f45'; ctx.beginPath(); ctx.roundRect(3, 3, 4.6, 4, 1.2); ctx.fill();
  }
  if (t.helmet) {
    ctx.fillStyle = t.boss ? '#4a4030' : '#454f3c';
    ctx.beginPath(); ctx.ellipse(-0.4, -3.4, 6.2, 4.4, 0, Math.PI, 0); ctx.fill();
    ctx.fillRect(-6.6, -3.6, 13, 1.8);
    if (t.boss) { ctx.fillStyle = '#b8452f'; ctx.fillRect(-1, -8.6, 2, 4); }
  } else {
    ctx.fillStyle = shade(skin, 0.7);
    ctx.beginPath(); ctx.ellipse(-1, -4.6, 3.6, 2.2, 0, Math.PI, 0); ctx.fill();
  }
  ctx.restore();
  ctx.restore();
  zHealthBar(ctx, px, py, z, sc);
}

// полоска жизни: только у раненых и у всех крупных тварей
function zHealthBar(ctx, px, py, z, sc) {
  if (!z.maxHp) return;
  const f = clamp(z.hp / z.maxHp, 0, 1);
  const big = z.type && z.type.tier >= 12;
  if (f >= 1 && !big) return;
  const w = 26 * sc, y = py - 56 * sc;
  ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(px - w / 2, y, w, 3);
  ctx.fillStyle = z.type && z.type.boss ? '#d8a03a' : f > 0.5 ? '#9a5a4a' : '#c0402c';
  ctx.fillRect(px - w / 2, y, w * f, 3);
  if (big) {
    ctx.font = '600 7px system-ui, sans-serif'; ctx.textAlign = 'center';
    ctx.fillStyle = 'rgba(230,220,200,0.8)';
    ctx.fillText(z.type.name, px, y - 3);
    ctx.textAlign = 'left';
  }
}

// ---- инвентарь ----
class Inventory {
  constructor(size) { this.size = size; this.slots = new Array(size).fill(null); }
  add(id, n) {
    const max = ITEMS[id].max;
    for (let i = 0; i < this.size && n > 0; i++) {
      const s = this.slots[i];
      if (s && s.id === id && s.n < max) { const c = Math.min(max - s.n, n); s.n += c; n -= c; }
    }
    for (let i = 0; i < this.size && n > 0; i++) {
      if (!this.slots[i]) { const c = Math.min(max, n); this.slots[i] = { id, n: c }; n -= c; }
    }
    return n; // не влезло
  }
  count(id) { let c = 0; for (const s of this.slots) if (s && s.id === id) c += s.n; return c; }
  remove(id, n) {
    for (let i = this.size - 1; i >= 0 && n > 0; i--) {
      const s = this.slots[i];
      if (s && s.id === id) { const c = Math.min(s.n, n); s.n -= c; n -= c; if (s.n <= 0) this.slots[i] = null; }
    }
    return n === 0;
  }
  has(map) { for (const k in map) if (this.count(k) < map[k]) return false; return true; }
  takeFrom(i, n) {
    const s = this.slots[i]; if (!s) return null;
    const c = Math.min(s.n, n); s.n -= c; const out = { id: s.id, n: c };
    if (s.n <= 0) this.slots[i] = null;
    return out;
  }
  isFull() { return this.slots.every(s => s !== null); }
}

<script>
// ---- js/player.js ----
// player.js — физика, шкалы, тело и травмы, радиация, действия
'use strict';

const LIMBS = [

  { id: 'legL', name: 'Левая нога' },

];

const WOUND_NAMES = ['цела', 'C1 — ссадина', 'C2 — лёгкая рана', 'C3 — средняя рана', 'C4 — смертельная рана'];
const WOUND_COLORS = ['#5f7f5a', '#b6b06a', '#d09848', '#c4642f', '#a8232a'];

// навыки: качаются за монеты, по 2 монеты за убитого зомби
const SKILLS = [
  { id: 'dig', name: 'Горняк', desc: 'Скорость копания +15% за уровень' },
  { id: 'speed', name: 'Ходок', desc: 'Скорость передвижения +8% за уровень' },
  { id: 'legs', name: 'Крепкие ноги', desc: 'Меньше урона и травм от падения' },
  { id: 'lungs', name: 'Лёгкие', desc: 'Медленнее копится радиация, дольше живёт фильтр' },
  { id: 'meta', name: 'Метаболизм', desc: 'Еда и вода тратятся на 12% медленнее' },
  { id: 'aim', name: 'Стрелок', desc: 'Меньше разброс, +8% урона от оружия' },
  { id: 'medic', name: 'Санитар', desc: 'Аптечки и бинты лечат ощутимо лучше' },
  { id: 'trade', name: 'Барыга', desc: 'Скидка у торговца и +1 монета с зомби' }
];
const SKILL_MAX = 5;
function skillCost(lvl) { return 10 + lvl * 8; }

// направление ходьбы по клавишам: нужно ещё до того, как посчитан разгон
function ax0() {
  let a = 0;
  if (Input.isDown('KeyA') || Input.isDown('ArrowLeft')) a -= 1;
  if (Input.isDown('KeyD') || Input.isDown('ArrowRight')) a += 1;
  return a;
}

const Player = {
  x: 0, y: 0, vx: 0, vy: 0, w: 13, h: 54,
  coins: 0, kills: 0,
  skills: { dig: 0, speed: 0, legs: 0, lungs: 0, meta: 0, aim: 0, medic: 0, trade: 0 },
  face: 1, phase: 0, onGround: false, fallStart: null,
  hp: 100, food: 240, water: 220, psy: 100, rad: 0,
  // Хардкорные шкалы. Выносливость тратится на бег, прыжки, удары и копание.
  // Тепло уходит ночью, под дождём и на высоте, возвращается у огня и в доме.
  // Заражение приходит с укусом и само не проходит — только антибиотик
  stam: STAM_MAX, warm: WARM_MAX, infection: 0, shiver: 0,
  worn: { coat: null, hood: null },      // надетая одежда
  gunWear: {}, jam: 0,                   // износ стволов и клин
  mask: null,            // {filter: 0..100} — надет
  filterWear: 100,
  look: { skin: 1, hair: 0, hairStyle: 0, beard: true, name: 'Выживший' },
  inv: null,
  hotbar: 0,
  body: {},
  digProgress: 0, digAnim: undefined, digTarget: null,
  planPart: 0, planTier: 0,
  reload: 0, cooldown: 0, recoil: 0, mag: {},
  dead: false, deathCause: '',
  msg: '', msgT: 0,

  buySkill(id) {
    const lvl = this.skills[id];
    if (lvl >= SKILL_MAX) { this.say('Навык уже прокачан до конца'); return false; }
    const cost = skillCost(lvl);
    if (this.coins < cost) { this.say('Нужно ' + cost + ' монет'); return false; }
    this.coins -= cost;
    this.skills[id] = lvl + 1;
    this.say(SKILLS.find(s => s.id === id).name + ' — уровень ' + (lvl + 1));
    return true;
  },

  init() {
    this.inv = new Inventory(30);
    this.stam = STAM_MAX; this.warm = WARM_MAX; this.infection = 0; this.shiver = 0;
    this.worn = { coat: null, hood: null };
    this.gunWear = {}; this.jam = 0;
    for (const l of LIMBS) this.body[l.id] = { w: 0, bleed: false };
    this.x = World.spawnX * CELL;
    this.y = (World.surface[World.spawnX] - 1) * CELL;
    this.inv.add('canteen_dirty', 1);
    this.inv.add('can', 1);
    // магазин заводим на каждый вид оружия: у новых стволов его не было,
    // и вместо числа патронов в HUD показывалось NaN
    this.mag = {};
    for (const id in ITEMS) if (ITEMS[id].type === 'gun') this.mag[ITEMS[id].kind] = 0;
  },

  say(t) { this.msg = t; this.msgT = 3.4; },

  // Выбросить всё из выбранной ячейки под ноги, как в Майнкрафте.
  // Вещь летит в сторону взгляда и полторы секунды не подбирается обратно
  dropHand() {
    const slot = this.hand();
    if (!slot) { this.say('В руке пусто'); return false; }
    const id = slot.id, n = slot.n;
    Drops.add(this.x + this.face * 12, this.y - 30, id, n, this.face * 1.6, -2, 1.2);
    this.inv.slots[this.hotbar] = null;
    this.say('Выбросил: ' + ITEMS[id].name + (n > 1 ? ' ×' + n : ''));
    return true;
  },

  // выбросить произвольную пачку (её тянут мышью на красную полосу)
  dropStack(id, n) {
    Drops.add(this.x + this.face * 12, this.y - 30, id, n, this.face * 1.6, -2, 1.2);
    this.say('Выбросил: ' + ITEMS[id].name + (n > 1 ? ' ×' + n : ''));
    return true;
  },

  // выбросить конкретную ячейку инвентаря (правый клик по ней с зажатым Shift)
  dropSlot(i) {
    const slot = this.inv.slots[i];
    if (!slot) return false;
    Drops.add(this.x + this.face * 12, this.y - 30, slot.id, slot.n, this.face * 1.6, -2, 1.2);
    this.say('Выбросил: ' + ITEMS[slot.id].name + (slot.n > 1 ? ' ×' + slot.n : ''));
    this.inv.slots[i] = null;
    return true;
  },

  hand() { return this.inv.slots[this.hotbar]; },
  handItem() { const s = this.hand(); return s ? ITEMS[s.id] : null; },

  // ---- модификаторы от травм ----
  legPenalty() {
    const a = this.body.legL.w, b = this.body.legR.w;
    return 1 - Math.min(0.75, (a + b) * 0.11);
  },
  armPenalty() {
    const a = this.body.armL.w, b = this.body.armR.w;
    return 1 - Math.min(0.7, (a + b) * 0.1);
  },
  wound(limb, sev) {
    const b = this.body[limb];
    if (sev > b.w) b.w = Math.min(4, sev);
    if (b.w >= 3) b.bleed = true;
    Floaters.push(this.x, this.y - 60, WOUND_NAMES[b.w].split(' ')[0] + ' ' + LIMBS.find(l => l.id === limb).name.toLowerCase(), '#d0603c');
  },
  totalWounds() { let s = 0; for (const l of LIMBS) s += this.body[l.id].w; return s; },

  heal(item) {
    // лечит самую тяжёлую рану, которую умеет
    const power = item.heals + (this.skills.medic >= 3 ? 1 : 0);
    let best = null;
    for (const l of LIMBS) {
      const b = this.body[l.id];
      if (b.w > 0 && b.w <= power && (!best || b.w > this.body[best].w)) best = l.id;
    }
    if (best) {
      this.body[best].w = Math.max(0, this.body[best].w - (item.heals >= 4 ? 4 : 1));
      if (this.body[best].w < 3) this.body[best].bleed = false;
      this.say('Обработал: ' + LIMBS.find(l => l.id === best).name.toLowerCase());
      return true;
    }
    if (item.rad) { return false; }
    return false;
  },

  update(dt) {
    if (this.dead) return;
    // Набитый рюкзак тянет вниз: больше двух третей занятых ячеек — идёшь медленнее
    const filled = this.inv.slots.filter(Boolean).length / this.inv.size;
    this.overload = clamp((filled - 0.66) / 0.34, 0, 1);
    const load = 1 - this.overload * 0.28;
    const speed = 1.65 * this.legPenalty() * load * (1 + 0.08 * this.skills.speed);
    // Бежать можно только пока есть выносливость. Кончилась — идёшь шагом,
    // и пока не отдышался хотя бы до четверти, бег не включается
    const wantSprint = Input.isDown('ShiftLeft') || Input.isDown('ShiftRight');
    if (this.stam <= 0) this.winded = true;
    if (this.stam > STAM_MAX * 0.25) this.winded = false;
    this.sprinting = wantSprint && !this.winded && Math.abs(ax0(this)) > 0;
    const sprint = this.sprinting ? 1 + 0.55 * clamp(this.legPenalty(), 0.35, 1) : 1;
    let ax = 0;
    if (Input.isDown('KeyA') || Input.isDown('ArrowLeft')) ax -= 1;
    if (Input.isDown('KeyD') || Input.isDown('ArrowRight')) ax += 1;
    const inWater = World.get(Math.floor(this.x / CELL), Math.floor((this.y - 10) / CELL)) === M.WATER;

    this.vx = ax * speed * sprint * (inWater ? 0.6 : 1);
    if (ax !== 0) { this.face = ax; this.phase += dt * (7 + Math.abs(this.vx) * 3.2); }
    else this.phase += dt * 0.6;
    // со стволом в руках персонаж разворачивается на курсор, как в шутерах
    const hi = this.handItem();
    if (hi && (hi.type === 'gun' || hi.type === 'melee')) this.face = Input.wx >= this.x ? 1 : -1;

    // лестница: по ней лазают вверх-вниз
    const onLadder = World.get(Math.floor(this.x / CELL), Math.floor((this.y - 20) / CELL)) === M.LADDER ||
                     World.get(Math.floor(this.x / CELL), Math.floor((this.y - 44) / CELL)) === M.LADDER;
    this.onLadder = onLadder;
    if (onLadder) {
      const up = Input.isDown('KeyW') || Input.isDown('ArrowUp') || Input.isDown('Space');
      const dn = Input.isDown('KeyS') || Input.isDown('ArrowDown');
      this.vy = up ? -1.5 : dn ? 1.9 : 0;
      this.vx *= 0.5;
      this.phase += dt * 5;
    } else {
      if ((Input.isDown('Space') || Input.isDown('KeyW')) && this.onGround && this.stam >= 6) {
        this.vy = -5.4 * clamp(this.legPenalty() + 0.2, 0.4, 1);
        this.onGround = false;
        this.stam = Math.max(0, this.stam - 6);      // прыжок стоит выносливости
      }
      this.vy += GRAV * (inWater ? 0.35 : 1);
      if (inWater) this.vy = Math.min(this.vy, 1.2);
      this.vy = Math.min(this.vy, 14);
    }

    this.unstuck();
    this.moveX(this.vx);
    this.moveY(this.vy);

    this.needs(dt);
    this.actions(dt);

    if (this.recoil > 0) this.recoil = Math.max(0, this.recoil - dt * 6);
    if (this.cooldown > 0) this.cooldown -= dt;
    if (this.reload > 0) {
      this.reload -= dt;
      if (this.reload <= 0) this.finishReload();
    }
    if (this.msgT > 0) this.msgT -= dt;
  },

  moveX(vx) {
    const nx = this.x + vx;
    if (!this.hits(nx, this.y)) { this.x = nx; return; }
    // авто-подъём на уступ, но только если над головой есть куда встать:
    // иначе игрока заталкивало в перекрытие на этажах
    for (let up = 1; up <= 2; up++) {
      const ny = this.y - up * CELL;
      if (this.hits(nx, ny)) continue;
      if (this.hits(this.x, ny)) continue;              // не пролезает вверх на месте
      this.x = nx; this.y = ny; return;
    }
    this.vx = 0;
  },

  // страховка от застревания: если тело оказалось внутри породы — выдавливаем наружу
  unstuck() {
    if (!this.hits(this.x, this.y)) return;
    for (let up = 1; up <= 14; up++) {
      if (!this.hits(this.x, this.y - up * CELL)) { this.y -= up * CELL; this.vy = 0; return; }
    }
    for (const dx of [-1, 1, -2, 2, -3, 3]) {
      if (!this.hits(this.x + dx * CELL, this.y)) { this.x += dx * CELL; this.vy = 0; return; }
    }
    // совсем зажало — поднимаем на поверхность
    const cx = clamp(Math.floor(this.x / CELL), 0, WW - 1);
    this.y = (World.surface[cx] - 1) * CELL;
    this.vy = 0;
  },
  moveY(vy) {
    const ny = this.y + vy;
    if (!this.hits(this.x, ny)) {
      this.y = ny;
      this.onGround = false;
      if (this.onLadder) this.fallStart = null;
      else if (vy > 0 && this.fallStart === null) this.fallStart = this.y - vy;
      return;
    }
    if (vy > 0) {
      // приземление
      while (!this.hits(this.x, this.y + 1) && this.hits(this.x, ny)) this.y += 1;
      if (this.fallStart !== null) {
        const fall = (this.y - this.fallStart) / CELL - this.skills.legs * 3;
        if (fall > 13) {
          // C4 — только за совсем безумную высоту, иначе прототип превращается в казнь
          const sev = fall > 55 ? 4 : fall > 32 ? 3 : fall > 20 ? 2 : 1;
          this.wound(Math.random() < 0.5 ? 'legL' : 'legR', sev);
          this.hp -= (fall - 10) * 1.5 * Math.pow(0.85, this.skills.legs);
          Particles.burst(this.x, this.y, [90, 70, 50], 10);
          this.say('Приземлился неудачно');
        }
        this.fallStart = null;
      }
      this.onGround = true;
    }
    this.vy = 0;
  },
  hits(x, y) {
    const x0 = Math.floor((x - this.w / 2) / CELL), x1 = Math.floor((x + this.w / 2 - 1) / CELL);
    const y0 = Math.floor((y - this.h) / CELL), y1 = Math.floor((y - 1) / CELL);
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) if (World.solid(cx, cy)) return true;
    return false;
  },

  // ---- шкалы, радиация, кровь ----
  // тепло от ближайшего костра, печи или факела
  heatNear() {
    let best = 0;
    for (const s of Machines.lights()) {
      const d = dist(this.x, this.y - 26, s.x, s.y);
      if (d < 150) best = Math.max(best, (1 - d / 150) * (s.r > 100 ? 1 : 0.5));
    }
    return best;
  },
  warmthOf(id) { const it = ITEMS[id]; return it && it.warm ? it.warm : 0; },
  wornWarm() {
    let w = 0;
    for (const k in this.worn) if (this.worn[k]) w += ITEMS[this.worn[k]].warm || 0;
    return w;
  },
  rainProof() {
    let p = 0;
    for (const k in this.worn) if (this.worn[k]) p = Math.max(p, ITEMS[this.worn[k]].rainproof || 0);
    return p;
  },

  needs(dt) {
    const sprinting = this.sprinting && Math.abs(this.vx) > 1;
    const meta = 1 - 0.12 * this.skills.meta;
    // Хардкор: одна единица примерно за 10 секунд вместо пятнадцати.
    // Бег жрёт вдвое, а не в полтора раза
    this.food -= dt * (1 / 10) * (sprinting ? 2 : 1) * meta;
    this.water -= dt * (1 / 8.5) * (sprinting ? 2 : 1) * meta;

    // ---- выносливость ----
    // Бег и работа её жгут, покой возвращает. Голодный и мёрзнущий
    // восстанавливается вдвое хуже, раненая нога — ещё хуже
    const rest = (this.food > 60 ? 1 : 0.45) * (this.warm > 40 ? 1 : 0.5) * this.legPenalty();
    if (sprinting) this.stam -= dt * (13 + this.overload * 7);
    else this.stam += dt * 11 * rest;
    this.stam = clamp(this.stam, 0, STAM_MAX * (1 - this.infection / 260));

    // ---- тепло ----
    // Ночь, дождь, вода и глубина студят. Греют огонь, дом, крыша и одежда
    const night = Game.nightAmount();
    const wet = Weather.wetness() * (1 - this.rainProof());
    const under = World.isUnderground(this.x, this.y);
    const roof = World.hasRoof(this.x, this.y);
    const inHome = Home.inside(this.x, this.y);
    let cold = night * 26 + wet * 30 + (under ? 10 : 0);
    if (roof || inHome) cold *= 0.45;
    if (inHome) cold -= 12;
    const heat = this.heatNear() * 60 + this.wornWarm() + (sprinting ? 8 : 0);
    const target = clamp(WARM_MAX - cold + heat, 0, WARM_MAX);
    this.warm += (target - this.warm) * dt * 0.22;
    this.warm = clamp(this.warm, 0, WARM_MAX);
    // дрожь: мёрзнущие руки не держат прицел
    this.shiver = clamp((30 - this.warm) / 30, 0, 1);
    if (this.warm < 22) {
      this.hp -= dt * (22 - this.warm) * 0.055;
      if (Math.random() < dt * 1.4) Particles.smoke(this.x + rnd(-4, 4), this.y - 48, 'rgba(200,215,230,0.35)');
    }

    // ---- заражение ----
    // Само не проходит: растёт, режет выносливость и с 40 начинает есть здоровье
    if (this.infection > 0) {
      this.infection = clamp(this.infection + dt * 0.55, 0, 100);
      if (this.infection > 40) this.hp -= dt * (this.infection - 40) * 0.035;
    }

    // радиация. В противогазе с живым фильтром — не растёт вообще и медленно сходит.
    // Без противогаза копится не спеша, и вредит только выше 30%.
    const sheltered = World.isUnderground(this.x, this.y) || World.hasRoof(this.x, this.y);
    const atHome = Home.inside(this.x, this.y);
    const zoneMul = atHome ? 0 : zoneAtPx(this.x).radMul;
    const lungs = 1 - 0.15 * this.skills.lungs;
    let radIn = 0;
    if (atHome) radIn = 0;                                              // дом всегда чистый
    else if (this.mask && this.filterWear > 0) radIn = 0;
    else if (this.mask) radIn = (sheltered ? 0.3 : 1.1) * zoneMul;      // фильтр сдох
    else radIn = (sheltered ? 0.35 : 1.5) * zoneMul;                    // без маски
    if (World.get(Math.floor(this.x / CELL), Math.floor((this.y - 6) / CELL)) === M.WATER) radIn += 1.2;
    // кислотный дождь льёт радиацию прямо на плечи — под крышей вдвое меньше
    if (!atHome && Weather.cur.rad) radIn += Weather.cur.rad * Weather.fade * (sheltered ? 0.35 : 1) * (1 - this.rainProof() * 0.5);
    this.rad = clamp(this.rad + radIn * lungs * dt - dt * 1.1, 0, 100);
    if (this.mask && !sheltered && !atHome) this.filterWear = Math.max(0, this.filterWear - dt * 0.22 * (1 - 0.12 * this.skills.lungs));

    if (this.rad > 30) this.hp -= dt * (this.rad - 30) * 0.02;

    // психика
    const dark = Game.nightAmount();

    // кровотечение
    let bleeding = 0;
    for (const l of LIMBS) if (this.body[l.id].bleed) bleeding++;
    if (bleeding) { this.hp -= dt * bleeding * 2.6; if (Math.random() < dt * 6) Particles.blood(this.x, this.y - 30); }

    // психика здоровье не отнимает: на нуле просто сереет мир
    // медленная регенерация в сытости и без ран
    if (this.food > 180 && this.water > 180 && this.totalWounds() === 0 && this.rad < 15 &&
        this.infection === 0 && this.warm > 60) this.hp += dt * 0.45;

    // голод и жажда бьют по здоровью
    if (this.food <= 0) this.hp -= dt * 1.6;
    if (this.water <= 0) this.hp -= dt * 2.2;

    this.food = clamp(this.food, 0, FOOD_MAX);
    this.water = clamp(this.water, 0, WATER_MAX);
    this.hp = clamp(this.hp, 0, 100);

    if (this.hp <= 0) {
      this.dead = true;
      this.deathCause =
        this.infection > 55 ? 'Заражение крови. Укус надо было лечить.' :
        this.warm < 25 ? 'Замёрз насмерть. Ночь не прощает.' :
        this.rad > 45 ? 'Лучевая болезнь. Не стоило снимать противогаз.' :
        this.water <= 0 ? 'Обезвоживание.' :
        this.food <= 0 ? 'Голод.' :
        bleeding ? 'Кровопотеря.' : 'Тело не выдержало.';
    }
  },

  // ---- действия ----
  actions(dt) {
    const it = this.handItem();
    // прицел
    this.aimAng = Math.atan2(Input.wy - (this.y - 41), Input.wx - this.x);

    // взрывчатка: бросок в сторону курсора, сила зависит от дальности прицела
    if (it && it.type === 'throw') {
      if ((Input.mclick || Input.rclick || Input.once('KeyQ')) && this.cooldown <= 0) {
        const slot = this.hand();
        if (slot && slot.n > 0) {
          this.cooldown = 0.45;
          const d = clamp(dist(this.x, this.y - 34, Input.wx, Input.wy) / 26, 3, 11);
          Throwables.throwIt(slot.id, this.x + this.face * 10, this.y - 36, this.aimAng, d);
          this.inv.remove(slot.id, 1);
          this.say(it.name + ' брошена');
        }
      }
      this.digProgress = 0; this.digAnim = undefined;
      return;
    }

    // строительный план: колесо листает детали, ЛКМ и ПКМ ставят
    if (it && it.type === 'plan') {
      // деталь листается колесом и кнопкой O — как просил
      if (Input.wheel || Input.once('KeyO')) {
        const back = Input.wheel < 0;
        this.planPart = (this.planPart + (back ? PARTS.length - 1 : 1)) % PARTS.length;
        Input.wheel = 0;
        this.say(PARTS[this.planPart].name);
      }
      if (Input.once('KeyZ')) {
        this.planTier = (this.planTier + 1) % TIERS.length;
        this.say('Материал: ' + TIERS[this.planTier].name);
      }
      if (Input.mclick || Input.rclick || Input.once('KeyQ')) {
        const part = PARTS[this.planPart];
        const g = Structures.snap(part, Input.wx, Input.wy);
        if (dist(this.x, this.y - 28, (g.gx + part.w / 2) * CELL, (g.gy + part.h / 2) * CELL) > 110) {
          this.say('Слишком далеко — подойди ближе');
        } else {
          Structures.place(part.id, g.gx, g.gy, this.planTier);
        }
      }
      this.digProgress = 0; this.digAnim = undefined;
      return;
    }

    // молоток: ЛКМ — ремонт, ПКМ или Q — апгрейд материала
    if (it && it.type === 'hammer') {
      const target = Structures.at(Math.floor(Input.wx / CELL), Math.floor(Input.wy / CELL));
      const near = target && dist(this.x, this.y - 28, Input.wx, Input.wy) < 100;
      if (Input.mclick) {
        if (near) Structures.repair(target); else this.say('Наведи на свою постройку');
      }
      if (Input.rclick || Input.once('KeyQ')) {
        if (near) Structures.upgrade(target); else this.say('Наведи на свою постройку');
      }
      this.digProgress = 0; this.digAnim = undefined;
      return;
    }

    if (it && it.type === 'gun') {
      this.digProgress = 0; this.digAnim = undefined;
      if (Input.isDown('KeyR') || Input.once('KeyR')) this.startReload(it);
      const fire = it.kind === 'pistol' ? Input.mclick : Input.mdown;
      if (fire && this.cooldown <= 0 && this.reload <= 0) this.shoot(it);
      if (Input.once('KeyQ')) this.useRight(it);
      return;
    }

    if (it && it.type === 'melee') {
      if (Input.mdown && this.cooldown <= 0) this.swing(it);
      if (this.swingT > 0) { this.swingT -= dt; this.digAnim = 1 - this.swingT / 0.35; }
      else this.digAnim = undefined;
      if (Input.rclick || Input.once('KeyQ')) this.useRight(it);
      return;
    }

    // инструментом тоже можно врезать: если зомби рядом под курсором — бьём, а не копаем
    if (it && it.type === 'tool' && it.dmg && Input.mdown && this.cooldown <= 0) {
      const zx = this.x + (Input.wx > this.x ? 1 : -1) * 26;
      if (Zombies.list.some(z => z.hp > 0 && dist(zx, this.y - 30, z.x, z.y - 24) < 32)) {
        this.swing({ dmg: it.dmg, rof: 0.5 });
        return;
      }
    }
    if (this.swingT > 0) { this.swingT -= dt; this.digAnim = 1 - this.swingT / 0.35; }

    if (Input.mdown) this.dig(dt, it);
    else { this.digProgress = 0; this.digAnim = undefined; this.digTarget = null; }

    if (Input.rclick || Input.once('KeyQ')) this.useRight(it);
  },

  reach() { return 78; },

  swing(it) {
    if (this.stam < 8) { this.say('Нет сил бить'); this.cooldown = 0.4; return; }
    this.stam = Math.max(0, this.stam - 8);
    this.cooldown = it.rof;
    this.swingT = 0.35;
    this.face = Input.wx > this.x ? 1 : -1;
    const hx = this.x + this.face * 24, hy = this.y - 30;
    let hitAny = false;
    for (const z of Zombies.list) {
      if (z.hp <= 0) continue;
      // по горизонтали бьём вперёд с запасом, по высоте прощаем разницу уровней:
      // иначе зомби на кочке или вплотную к телу оказывался вне зоны удара
      const zdx = (z.x - hx) * this.face, zdy = (z.y - 24) - hy;
      if (zdx > -34 && zdx < 40 && Math.abs(zdy) < 34) {
        const tired = 0.55 + 0.45 * clamp(this.stam / STAM_MAX, 0, 1);
        z.hp -= it.dmg * this.armPenalty() * tired;
        z.vx += this.face * 1.6; z.vy = -2.2;
        for (let k = 0; k < 7; k++) Particles.blood(z.x, z.y - 26);
        Floaters.push(z.x, z.y - 40, String(Math.round(it.dmg * this.armPenalty() * tired)), '#e0b090');
        hitAny = true;
      }
    }
    if (hitAny) Game.shake = 3;
  },

  dig(dt, it) {
    const cx = Math.floor(Input.wx / CELL), cy = Math.floor(Input.wy / CELL);
    if (dist(this.x, this.y - 28, Input.wx, Input.wy) > this.reach()) { this.digProgress = 0; return; }
    if (World.protectedAt(cx)) { this.digProgress = 0; this.say('Город трогать нельзя'); return; }
    // нода руды: бьём по валуну, ресурс капает с каждого удара
    const node = Nodes.at(Input.wx, Input.wy, 26);
    if (node) {
      const power = it && it.type === 'tool' ? (it.power || 0.4) * 12 : 4;
      this.digProgress += dt * 2.4 * this.armPenalty();
      this.digAnim = (this.digAnim === undefined ? 0 : (this.digAnim + dt * 3.4) % 1);
      if (this.digProgress >= 1) {
        this.digProgress = 0;
        Nodes.hit(node, power * (1 + 0.15 * this.skills.dig));
      }
      return;
    }
    // постройки не выгрызаются по частицам: у них своя прочность
    const st = Structures.at(cx, cy);
    if (st) {
      const power = it && it.type === 'tool' ? (it.dmg || 12) : 6;
      this.digProgress += dt * 2.2;
      this.digAnim = (this.digAnim === undefined ? 0 : (this.digAnim + dt * 3.4) % 1);
      if (this.digProgress >= 1) {
        this.digProgress = 0;
        Structures.damage(st, power * (1 + 0.15 * this.skills.dig));
        Floaters.push(Input.wx, Input.wy - 8, '-' + Math.round(power), '#e0b070');
      }
      return;
    }
    const m = World.get(cx, cy);
    if (m === M.AIR || m === M.WATER || MATS[m].door) { this.digProgress = 0; this.digTarget = null; return; }
    if (!this.digTarget || this.digTarget.x !== cx || this.digTarget.y !== cy) {
      this.digTarget = { x: cx, y: cy }; this.digProgress = 0;
    }
    this.face = Input.wx > this.x ? 1 : -1;
    // Кирка сама себя не носит: копание тратит выносливость, на нуле — вяло
    this.stam = Math.max(0, this.stam - dt * 7);
    const force = 0.5 + 0.5 * clamp(this.stam / STAM_MAX, 0, 1);
    let power = 0.22;                         // руками
    const woody = MATS[m] && (MATS[m].woody || MATS[m].bark || MATS[m].plank || MATS[m].leaf);
    if (it && it.type === 'tool') power = it.power * (woody && it.wood ? it.wood : 1);
    power *= this.armPenalty() * force * (1 + 0.15 * this.skills.dig);
    // кисть: руками одна частица, деревянным кайлом 3×3, металлической киркой 9×9
    const brush = it && it.type === 'tool' ? (it.brush || 0) : 0;
    const square = brush >= 2;
    const area = square ? (brush * 2 + 1) * (brush * 2 + 1) : 1 + brush * 4;
    const hard = Math.max(0.2, World.hardnessAt(cx, cy, Math.min(1, brush)));
    this.digProgress += dt * power / (hard * (1 + area * 0.014));
    this.digAnim = (this.digAnim === undefined ? 0 : (this.digAnim + dt * 3.4) % 1);
    if (this.digProgress >= 1) {
      this.digProgress = 0;
      const drops = World.digAt(cx, cy, brush, square);
      for (const id in drops) {
        const n = Math.max(1, Math.round(drops[id] * 0.45));
        if (this.inv.add(id, n) > 0) this.say('Инвентарь полон');
        else Floaters.push(cx * CELL, cy * CELL, '+' + n + ' ' + ITEMS[id].name, '#cfe0b0');
      }
      World.dirty(cx, cy);
    }
  },

  // применить предмет на себя: ПКМ в мире или ПКМ по ячейке в инвентаре
  consume(i) {
    const slot = this.inv.slots[i];
    if (!slot) return false;
    const it = ITEMS[slot.id];
    if (!it) return false;

    if (it.type === 'food') {
      if (this.food >= FOOD_MAX && !it.hp) { this.say('Ты сыт'); return false; }
      this.food = clamp(this.food + (it.food || 0) * 2.5, 0, FOOD_MAX);
      this.water = clamp(this.water + (it.water || 0) * 2.5, 0, WATER_MAX);
      this.hp = clamp(this.hp + (it.hp || 0), 0, 100);
      if (it.warm) this.warm = clamp(this.warm + it.warm, 0, WARM_MAX);
      this.inv.remove(slot.id, 1);
      if (slot.id === 'can') this.inv.add('scrap', 1);
      this.say('Съел: ' + it.name);
      return true;
    }
    if (it.type === 'drink') {
      if (this.water >= WATER_MAX) { this.say('Пить не хочется'); return false; }
      this.water = clamp(this.water + (it.water || 0) * 2.5, 0, WATER_MAX);
      this.hp = clamp(this.hp + (it.hp || 0), 0, 100);
      if (it.warm) this.warm = clamp(this.warm + it.warm, 0, WARM_MAX);
      if (slot.id === 'canteen_dirty') this.rad = clamp(this.rad + 10, 0, 100);
      // гнилая вода вдобавок иногда даёт заражение: пей кипячёное
      if (slot.id === 'canteen_dirty' && Math.random() < 0.3) {
        this.infection = clamp(this.infection + 12, 0, 100);
        this.say('Мутную воду пить не стоило');
      }
      this.inv.remove(slot.id, 1); this.inv.add('canteen', 1);
      this.say('Выпил');
      return true;
    }
    if (it.type === 'med') {
      // принимается сразу: лечит рану, сбивает радиацию, поднимает психику — что может
      let used = false;
      if (it.cure && this.infection > 0) {
        this.infection = clamp(this.infection - it.cure, 0, 100);
        used = true;
        this.say(this.infection > 0 ? 'Заражение сбито, но не до конца' : 'Заражение вылечено');
      }
      if (it.rad && this.rad > 0) { this.rad = clamp(this.rad - it.rad, 0, 100); used = true; this.say('Радиация сбита'); }
      if (it.heals && this.heal(it)) used = true;
      if (!used && (it.hp || 0) > 0 && this.hp < 100) { used = true; this.say('Перевязался'); }
      if (!used) { this.say('Сейчас это ничего не даст'); return false; }
      this.hp = clamp(this.hp + (it.hp || 0), 0, 100);
      this.inv.remove(slot.id, 1);
      return true;
    }
    if (it.type === 'zinc') {
      this.inv.remove(slot.id, 1);
      const left = this.inv.add(it.gives[0], it.gives[1]);
      this.say('Вскрыл цинк: ' + it.gives[1] + ' патронов' + (left ? ' (часть не влезла)' : ''));
      return true;
    }
    if (it.type === 'wear') { return this.wearCloth(slot.id); }
    if (it.type === 'oil') {
      const gun = this.handItem();
      if (!gun || gun.type !== 'gun') { this.say('Возьми ствол в руку'); return false; }
      if (!this.gunWear[gun.kind] && this.jam <= 0) { this.say('Ствол и так чистый'); return false; }
      this.gunWear[gun.kind] = 0; this.jam = 0;
      this.inv.remove(slot.id, 1);
      this.say(gun.name + ' вычищен');
      return true;
    }
    if (it.type === 'mask') { this.wearMask(); return true; }
    if (it.type === 'filter') {
      if (!this.mask) { this.say('Противогаз не надет'); return false; }
      if (this.filterWear > 95) { this.say('Фильтр ещё свежий'); return false; }
      this.filterWear = 100; this.inv.remove(slot.id, 1); this.say('Фильтр заменён');
      return true;
    }
    return false;
  },

  useRight(it) {
    if (!it) return;
    const slot = this.hand();
    const cx = Math.floor(Input.wx / CELL), cy = Math.floor(Input.wy / CELL);
    const inReach = dist(this.x, this.y - 28, Input.wx, Input.wy) <= this.reach();

    if (it.type === 'door' && inReach) {
      if (!canBuildAtCell(cx)) { this.say('В самой локации строить нельзя — отойди за её край'); return; }
      if (Doors.place(cx, cy)) this.inv.remove(slot.id, 1);
      return;
    }
    if (it.type === 'flag' && inReach) {
      if (!canBuildAtCell(cx)) { this.say('Дом ставится вне локаций — на пустоши или между ними'); return; }
      if (Home.place(cx, cy)) this.inv.remove(slot.id, 1);
      return;
    }
    if ((it.type === 'build' || it.type === 'place' || it.type === 'machine') && inReach && World.protectedAt(cx)) {
      this.say('Город трогать нельзя'); return;
    }
    if (it.type === 'build' && inReach) {
      if (!canBuildAtCell(cx)) { this.say('В самой локации строить нельзя — отойди за её край'); return; }
      // как в Майнкрафте: если целишь в занятую деталь, встаёт с той грани,
      // с которой ты смотришь — на любую поверхность, любой высоты и длины
      let bx = cx & ~1, by = cy & ~1;
      const busy = (gx, gy) => {
        for (let dx = 0; dx < 2; dx++) for (let dy = 0; dy < 2; dy++) {
          const m = World.get(gx + dx, gy + dy);
          if (m !== M.AIR && (MATS[m].build || MATS[m].door || MATS[m].metal)) return true;
        }
        return Machines.boxBusy(gx, gy + 1, 2, 2);
      };
      if (busy(bx, by)) {
        // грань выбираем по тому, куда именно попал курсор внутри детали
        const fx = Input.wx / CELL - bx, fy = Input.wy / CELL - by;
        const cand = [];
        if (fx < 0.5) cand.push([bx - 2, by], [bx + 2, by]); else cand.push([bx + 2, by], [bx - 2, by]);
        if (fy < 0.5) cand.unshift([bx, by - 2]); else cand.push([bx, by + 2]);
        const free = cand.find(([gx, gy]) => !busy(gx, gy));
        if (!free) { this.say('Здесь уже стоит деталь'); return; }
        bx = free[0]; by = free[1];
        if (!canBuildAtCell(bx)) { this.say('В самой локации строить нельзя'); return; }
      }
      let support = false;
      for (let dx = -1; dx <= 2 && !support; dx++) for (let dy = -1; dy <= 2 && !support; dy++) {
        if (dx >= 0 && dx <= 1 && dy >= 0 && dy <= 1) continue;
        if (World.get(bx + dx, by + dy) !== M.AIR) support = true;
      }
      if (!support) { this.say('Деталь должна к чему-то примыкать'); return; }
      for (let dx = 0; dx < 2; dx++) for (let dy = 0; dy < 2; dy++) World.set(bx + dx, by + dy, it.mat);
      Particles.burst(bx * CELL + CELL, by * CELL + CELL, [140, 106, 66], 5);
      this.inv.remove(slot.id, 1);
      this.unstuck();
      return;
    }
    if (it.type === 'place' && inReach) {
      if (World.get(cx, cy) !== M.AIR) { this.say('Место занято'); return; }
      // лестнице хватает стенки ствола в двух частицах или другой лестницы сверху-снизу
      const ok = it.mat === M.LADDER
        ? (World.hasSupportNear(cx, cy, 2) || World.ladderNear(cx, cy))
        : World.hasNeighbour(cx, cy);
      if (!ok) { this.say('Не к чему прикрепить'); return; }
      if (Math.abs(cx * CELL + 4 - this.x) < 10 && cy * CELL > this.y - this.h && cy * CELL < this.y) return;
      World.set(cx, cy, it.mat);
      this.inv.remove(slot.id, 1);
      return;
    }
    if (it.type === 'machine' && inReach) {
      if (Machines.place(slot.id, cx, cy)) this.inv.remove(slot.id, 1);
      return;
    }
    if (it.type === 'light' && inReach) {
      if (World.get(cx, cy) !== M.AIR) { this.say('Место занято'); return; }
      if (!World.hasSupportNear(cx, cy, 1)) { this.say('Факелу нужна стена или пол рядом'); return; }
      Machines.addTorch(cx, cy); this.inv.remove(slot.id, 1);
      return;
    }
    // предметы, которые надо куда-то поставить: если далеко — говорим об этом
    if (!inReach && ['build', 'place', 'machine', 'light', 'door', 'flag', 'seed'].includes(it.type)) {
      this.say('Слишком далеко — подойди ближе');
      return;
    }
    // всё, что просто применяется на себя, уходит в consume — работает и из инвентаря
    if (['food', 'drink', 'med', 'zinc', 'mask', 'filter', 'wear', 'oil'].includes(it.type)) {
      this.consume(this.hotbar);
      return;
    }
    if (it.type === 'canteen') {
      // набрать воды из лужи
      if (inReach && World.get(cx, cy) === M.WATER) {
        this.inv.remove(slot.id, 1); this.inv.add('canteen_dirty', 1);
        this.say('Набрал мутной воды');
      } else this.say('Нужна вода рядом');
      return;
    }
    if (it.type === 'seed') {
      if (inReach && Machines.plant(cx, cy, slot.id)) this.inv.remove(slot.id, 1);
      else this.say('Нужна грядка');
      return;
    }
    if (it.type === 'mask') { this.wearMask(); return; }
    if (it.type === 'filter') {
      if (!this.mask) { this.say('Противогаз не надет'); return; }
      this.filterWear = 100; this.inv.remove(slot.id, 1); this.say('Фильтр заменён');
      return;
    }
  },

  // Надеть или снять куртку и дождевик. Снятое падает обратно в рюкзак
  wearCloth(id) {
    const it = ITEMS[id];
    const s = it.slot;
    if (this.worn[s] === id) {
      this.worn[s] = null; this.inv.add(id, 1);
      this.say(it.name + ' снят');
      return true;
    }
    if (!this.inv.remove(id, 1)) return false;
    if (this.worn[s]) this.inv.add(this.worn[s], 1);
    this.worn[s] = id;
    this.say(it.name + ' надет');
    return true;
  },
  wearMask() {
    if (this.mask) return;
    if (!this.inv.remove('gasmask', 1)) return;
    this.mask = true; this.say('Противогаз надет. Дышать можно.');
  },
  removeMask() {
    if (!this.mask) return;
    this.mask = false;
    this.inv.add('gasmask', 1);
    this.say('Противогаз снят. Ты чувствуешь металлический привкус.');
  },

  // ---- оружие ----
  startReload(gun) {
    if (this.jam > 0) {
      this.jam = 0; this.reload = 1.1; this.reloadGun = null;
      this.say('Затвор передёрнут');
      return;
    }
    if (this.reload > 0) return;
    const id = gun.kind;
    if (this.mag[id] >= gun.mag) return;
    if (this.inv.count(gun.ammo) <= 0) { this.say('Нет патронов ' + ITEMS[gun.ammo].name); return; }
    this.reload = gun.kind === 'mg' ? 4.2 : gun.kind === 'rifle' ? 2.4 : 1.6;
    this.reloadGun = gun;
    this.say('Перезарядка...');
  },
  finishReload() {
    const gun = this.reloadGun; if (!gun) return;
    const need = gun.mag - this.mag[gun.kind];
    const have = Math.min(need, this.inv.count(gun.ammo));
    this.inv.remove(gun.ammo, have);
    this.mag[gun.kind] += have;
    this.reloadGun = null;
  },
  shoot(gun) {
    if (this.jam > 0) { this.say('Клин! R — передёрнуть затвор'); this.cooldown = 0.4; return; }
    if (this.mag[gun.kind] <= 0) { this.say('Пусто — R'); this.cooldown = 0.4; return; }
    // Износ ствола. Чем он выше, тем чаще перекос патрона. Лечится маслом
    const wear = this.gunWear[gun.kind] || 0;
    if (Math.random() < Math.pow(wear / 100, 2) * 0.06) {
      this.jam = 1;
      this.say('Перекос патрона! R — передёрнуть');
      Floaters.push(this.x, this.y - 56, 'КЛИН', '#e08a4a');
      this.cooldown = 0.5;
      return;
    }
    this.gunWear[gun.kind] = Math.min(100, wear + (gun.pellets ? 0.5 : 0.32));
    this.mag[gun.kind]--;
    this.cooldown = gun.rof;
    this.recoil = gun.rec;
    // мёрзнущие руки и изношенный ствол кладут пули куда попало
    const shake = 1 + this.shiver * 1.4 + wear / 140;
    const spread = gun.spread * shake * (2 - this.armPenalty()) * (1 - 0.12 * this.skills.aim);
    const dmg = gun.dmg * (1 + 0.08 * this.skills.aim);
    // дробовик кидает несколько картечин одним выстрелом
    const n = gun.pellets || 1;
    let mx = this.x, my = this.y - 41;
    for (let i = 0; i < n; i++) {
      const ang = this.aimAng + (Math.random() - 0.5) * spread;
      mx = this.x + Math.cos(ang) * 22; my = this.y - 41 + Math.sin(ang) * 22;
      Bullets.spawn(mx, my, ang, dmg, gun.kind);
    }
    Particles.flash(mx, my, this.aimAng);
    Game.shake = Math.min(6, Game.shake + gun.rec * 1.2);
  }
};

</script>
<script>
// ---- js/entities.js ----
// entities.js — частицы, пули, зомби, машины, лут на земле
'use strict';

const Particles = {
  list: [],
  burst(x, y, col, n) {
    for (let i = 0; i < n; i++) this.list.push({
      x, y, vx: rnd(-1.4, 1.4), vy: rnd(-2.2, 0.2), g: 0.14, life: rnd(0.4, 1.1), t: 0,
      s: rnd(1.4, 3.2), col: rgb(col[0] + rnd(-14, 14), col[1] + rnd(-14, 14), col[2] + rnd(-14, 14))
    });
  },
  blood(x, y) {
    this.list.push({ x, y, vx: rnd(-0.8, 0.8), vy: rnd(-0.4, 0.6), g: 0.2, life: 0.8, t: 0, s: rnd(1.2, 2.4), col: '#8e2a24' });
  },
  flash(x, y, ang) {
    for (let i = 0; i < 7; i++) this.list.push({
      x, y, vx: Math.cos(ang) * rnd(1, 5) + rnd(-0.6, 0.6), vy: Math.sin(ang) * rnd(1, 5) + rnd(-0.6, 0.6),
      g: 0.02, life: rnd(0.05, 0.16), t: 0, s: rnd(2, 4.5), col: i < 3 ? '#fff3c0' : '#f0a03c', glow: true
    });
    for (let i = 0; i < 4; i++) this.list.push({
      x, y, vx: rnd(-0.5, 0.5), vy: rnd(-0.9, -0.2), g: -0.02, life: rnd(0.3, 0.7), t: 0, s: rnd(2, 5), col: 'rgba(150,150,150,0.5)'
    });
  },
  smoke(x, y, col) {
    this.list.push({ x, y, vx: rnd(-0.25, 0.25), vy: rnd(-0.8, -0.35), g: -0.012, life: rnd(0.8, 1.8), t: 0, s: rnd(2.5, 5.5), col: col || 'rgba(120,120,120,0.42)' });
  },
  spark(x, y) {
    for (let i = 0; i < 5; i++) this.list.push({
      x, y, vx: rnd(-2, 2), vy: rnd(-2, 1), g: 0.16, life: rnd(0.1, 0.35), t: 0, s: rnd(1, 2), col: '#ffe6a0', glow: true
    });
  },
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const p = this.list[i];
      p.t += dt;
      if (p.t > p.life) { this.list.splice(i, 1); continue; }
      p.vy += p.g; p.x += p.vx; p.y += p.vy;
    }
    if (this.list.length > 1400) this.list.splice(0, this.list.length - 1400);
  },
  draw(ctx) {
    for (const p of this.list) {
      const a = 1 - p.t / p.life;
      ctx.globalAlpha = clamp(a, 0, 1);
      ctx.fillStyle = p.col;
      const s = p.s * (p.glow ? a + 0.4 : 1);
      ctx.fillRect(p.x - s / 2, p.y - s / 2, s, s);
    }
    ctx.globalAlpha = 1;
  }
};

const Floaters = {
  list: [],
  push(x, y, text, col) { this.list.push({ x, y, text, col: col || '#e8e2d0', t: 0 }); },
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const f = this.list[i]; f.t += dt; f.y -= dt * 16;
      if (f.t > 1.6) this.list.splice(i, 1);
    }
  },
  draw(ctx) {
    ctx.font = '600 9px system-ui, sans-serif'; ctx.textAlign = 'center';
    for (const f of this.list) {
      ctx.globalAlpha = clamp(1.6 - f.t, 0, 1) * 0.95;
      ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillText(f.text, f.x + 0.8, f.y + 0.8);
      ctx.fillStyle = f.col; ctx.fillText(f.text, f.x, f.y);
    }
    ctx.globalAlpha = 1; ctx.textAlign = 'left';
  }
};

const Bullets = {
  list: [],
  spawn(x, y, ang, dmg, kind, foe) {
    const sp = kind === 'pistol' ? 15 : kind === 'rifle' ? 21 : 24;
    // foe — пуля врага: бьёт игрока и не трогает своих
    this.list.push({ x, y, px: x, py: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, dmg, life: 1.1, t: 0, foe: !!foe });
  },
  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const b = this.list[i];
      b.t += dt;
      b.px = b.x; b.py = b.y;
      let hit = false;
      for (let s = 0; s < 4; s++) {
        b.x += b.vx / 4; b.y += b.vy / 4;
        b.vy += 0.05;
        if (World.solid(Math.floor(b.x / CELL), Math.floor(b.y / CELL))) {
          Particles.spark(b.x, b.y);
          const mi = World.info(Math.floor(b.x / CELL), Math.floor(b.y / CELL));
          if (mi) Particles.burst(b.x, b.y, mi.c, 2);
          hit = true; break;
        }
        // вражеская пуля ищет игрока, своя — зомби
        if (b.foe) {
          if (!Player.dead && Math.abs(b.x - Player.x) < 10 && b.y > Player.y - 52 && b.y < Player.y) {
            Player.hp -= b.dmg;
            if (Math.random() < 0.4) Player.wound(pick(['torso', 'armL', 'armR', 'legL', 'legR']), Math.random() < 0.25 ? 2 : 1);
            for (let k = 0; k < 6; k++) Particles.blood(b.x, b.y);
            Game.shake = 4;
            hit = true; break;
          }
          continue;
        }
        for (const z of Zombies.list) {
          if (z.hp <= 0) continue;
          if (Math.abs(b.x - z.x) < 9 && b.y > z.y - 48 && b.y < z.y) {
            const head = b.y < z.y - 38;
            z.hp -= b.dmg * (head ? 2.4 : 1);
            z.vx += Math.sign(b.vx) * 0.7;
            for (let k = 0; k < 6; k++) Particles.blood(b.x, b.y);
            Floaters.push(b.x, b.y - 6, head ? 'в голову!' : '' + Math.round(b.dmg * (head ? 2.4 : 1)), head ? '#ffd27a' : '#d8b0a0');
            hit = true; break;
          }
        }
        if (hit) break;
      }
      if (hit || b.t > b.life) this.list.splice(i, 1);
    }
  },
  draw(ctx) {
    ctx.strokeStyle = '#ffe9a8'; ctx.lineWidth = 1.4; ctx.lineCap = 'round';
    for (const b of this.list) {
      ctx.globalAlpha = 0.9;
      ctx.beginPath(); ctx.moveTo(b.px, b.py); ctx.lineTo(b.x, b.y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }
};

// Двадцать видов заражённых. tier — насколько поздно встречается и насколько
// страшен: по нему же растёт сложность этажей в небоскрёбе
const ZTYPES = [
  { id: 'shambler',  name: 'Бродяга',        tier: 1,  hp: 55,   spd: 0.55, dmg: 6,  scale: 0.79, skin: '#79906f', rag: '#4e4b3f' },
  { id: 'crawler',   name: 'Ползун',         tier: 2,  hp: 40,   spd: 0.75, dmg: 5,  scale: 0.62, skin: '#8a9c78', rag: '#46443a', low: true },
  { id: 'dog',       name: 'Заражённый пёс', tier: 3,  hp: 45,   spd: 1.45, dmg: 9,  scale: 0.70, skin: '#7d6a52', rag: '#5a4a38', quad: true },
  { id: 'runner',    name: 'Бегун',          tier: 4,  hp: 55,   spd: 1.3, dmg: 8,  scale: 0.76, skin: '#93a381', rag: '#3f4438' },
  { id: 'worker',    name: 'Рабочий',        tier: 5,  hp: 95,   spd: 0.65, dmg: 10, scale: 0.82, skin: '#6f8566', rag: '#7a6a2e', helmet: true },
  { id: 'bloated',   name: 'Раздутый',       tier: 6,  hp: 130,  spd: 0.42, dmg: 12, scale: 0.92, skin: '#8fa07e', rag: '#4a4a3c', fat: true },
  { id: 'spitter',   name: 'Плевун',         tier: 7,  hp: 70,   spd: 0.7,  dmg: 7,  scale: 0.79, skin: '#7fa06a', rag: '#3e4c36', spit: true },
  { id: 'wolf',      name: 'Волк-мутант',    tier: 8,  hp: 85,   spd: 1.6, dmg: 14, scale: 0.79, skin: '#6a6152', rag: '#4a4438', quad: true },
  { id: 'soldier',   name: 'Солдат',         tier: 9,  hp: 140,  spd: 0.9, dmg: 14, scale: 0.82, skin: '#6c8062', rag: '#4b5540', armor: true, helmet: true },
  { id: 'burnt',     name: 'Обожжённый',     tier: 10, hp: 110,  spd: 0.95, dmg: 13, scale: 0.79, skin: '#5c534c', rag: '#33302c', burn: true },
  { id: 'stalker',   name: 'Сталкер',        tier: 11, hp: 120,  spd: 1.15, dmg: 15, scale: 0.80, skin: '#6d8a70', rag: '#43503f', mask: true },
  { id: 'brute',     name: 'Громила',        tier: 12, hp: 260,  spd: 0.6,  dmg: 22, scale: 1.04, skin: '#758a68', rag: '#4a4738', fat: true },
  { id: 'hound',     name: 'Гончая пепла',   tier: 13, hp: 130,  spd: 1.8,  dmg: 18, scale: 0.82, skin: '#4f4a45', rag: '#3a3632', quad: true, burn: true },
  { id: 'medic',     name: 'Санитар',        tier: 14, hp: 170,  spd: 0.95, dmg: 16, scale: 0.82, skin: '#87a184', rag: '#c9c6bb', heals: true },
  { id: 'trooper',   name: 'Штурмовик',      tier: 15, hp: 220,  spd: 1.0,  dmg: 20, scale: 0.84, skin: '#66795e', rag: '#3f4a3a', armor: true, helmet: true },
  { id: 'juggernaut',name: 'Тяжёлый',        tier: 16, hp: 420,  spd: 0.55, dmg: 28, scale: 1.12, skin: '#6b7d62', rag: '#4c5340', armor: true, fat: true },
  { id: 'screamer',  name: 'Крикун',         tier: 17, hp: 200,  spd: 1.1, dmg: 17, scale: 0.85, skin: '#9fb08c', rag: '#3c4636', screams: true },
  { id: 'gunner',    name: 'Стрелок',        tier: 18, hp: 240,  spd: 0.9,  dmg: 18, scale: 0.84, skin: '#6a7f66', rag: '#454f3c', armor: true, gun: 'pistol' },
  { id: 'officer',   name: 'Офицер',         tier: 19, hp: 340,  spd: 1.05, dmg: 24, scale: 0.87, skin: '#647a5e', rag: '#3b4636', armor: true, helmet: true, gun: 'rifle' },
  { id: 'warlord',   name: 'Хозяин высотки', tier: 20, hp: 900,  spd: 1.0, dmg: 34, scale: 1.24, skin: '#5f7358', rag: '#33402f', armor: true, helmet: true, gun: 'mg', boss: true }
];
function ztype(i) { return ZTYPES[clamp(i, 0, ZTYPES.length - 1)]; }

const Zombies = {
  list: [],
  // Гнёзда: заранее размеченные места на этажах башен. Зомби не висят в мире
  // постоянно — они поднимаются, когда игрок подходит, и исчезают, когда уходит.
  // Убитые не возвращаются
  nests: [],
  addNest(x, y, tier) { this.nests.push({ x, y, tier, alive: null, cleared: false }); },
  // Этажный зомби привязан к своему этажу: он не сходит с него и не падает вниз.
  // Иначе вся башня осыпалась игроку на голову
  holdFloor(z, dt) {
    const n = z.nest;
    if (!n) return;
    if (Math.abs(z.y - n.y) > 40) {          // сорвался или всплыл — возвращаем
      z.y = n.y; z.vy = 0; z.onGround = true;
    }
    if (Math.abs(z.x - n.x) > 150) {          // не убегает с этажа далеко
      z.x = clamp(z.x, n.x - 150, n.x + 150);
      z.vx = 0;
    }
  },
  updateNests() {
    for (const n of this.nests) {
      if (n.cleared) continue;
      const near = Math.abs(n.x - Player.x) < 1400 && Math.abs(n.y - Player.y) < 1400;
      if (near && !n.alive) {
        n.alive = this.make(n.x, n.y, n.tier, Player.x > n.x ? 1 : -1);
        n.alive.nest = n;
      } else if (!near && n.alive) {
        const i = this.list.indexOf(n.alive);
        if (i >= 0) this.list.splice(i, 1);
        n.alive = null;
      }
    }
  },
  spawnTimer: 4,
  // Орда: каждую третью ночь мёртвые идут стеной. Днём висит предупреждение,
  // с каждым разом волна гуще и злее
  hordeNight() { return Game.day % 3 === 0; },
  hordeActive() { return this.hordeNight() && Game.nightAmount() > 0.55; },
  // Общий множитель силы заражённых: растёт с прожитыми днями и в бурю
  power() {
    return (1 + (Game.day - 1) * 0.11) * (Weather.cur.id === 'storm' ? 1.15 : 1);
  },
  update(dt) {
    this.updateNests();
    // ночью лезут, днём почти нет; в мёртвой зоне лезут всегда, в городе никогда
    const night = Game.nightAmount();
    const zm = zoneAtPx(Player.x).zombies;
    const horde = this.hordeActive() ? 3.2 : 1;
    const wx = Weather.cur.zomb;
    // с каждым днём мир населённее
    const byDay = 1 + (Game.day - 1) * 0.07;
    this.spawnTimer -= dt * (0.3 + night * 2.4) * zm * horde * wx;
    const cap = Math.round((3 + night * 7) * zm * horde * byDay);
    if (zm <= 0) { this.list.length = 0; }
    else if (this.spawnTimer <= 0 && this.list.length < cap) {
      this.spawnTimer = rnd(2.5, 7) / Math.max(0.4, zm * horde * wx);
      this.spawn();
    }
    for (let i = this.list.length - 1; i >= 0; i--) {
      const z = this.list[i];
      if (z.hp <= 0) {
        if (!z.counted) {
          z.counted = true;
          const tier = z.type ? z.type.tier : 1;
          const gain = Math.round((1 + tier * 0.6) * (Player.skills.trade >= 3 ? 1.5 : 1));
          Player.coins += gain;
          Player.kills++;
          Missions.onKill();
          Floaters.push(z.x, z.y - 50, '+' + gain + ' монет', '#e8cf72');
        }
        if (z.nest) { z.nest.cleared = true; z.nest.alive = null; z.nest = null; }
        z.dieT = (z.dieT || 0) + dt;
        if (z.dieT > 0.9) {
          // чем страшнее был враг, тем интереснее с него падает
          const tt = z.type || ZTYPES[0];
          if (Math.random() < 0.75) Drops.add(z.x, z.y - 10, Math.random() < 0.55 ? 'rag' : 'meat_rot', 1);
          if (tt.armor && Math.random() < 0.5) Drops.add(z.x, z.y - 10, 'scrap', irnd(1, 3));
          if (tt.gun && Math.random() < 0.6) {
            const ammo = tt.gun === 'pistol' ? 'ammo9' : tt.gun === 'rifle' ? 'ammo545' : 'ammo762';
            Drops.add(z.x, z.y - 10, ammo, irnd(6, 18));
          }
          if (tt.boss) {
            Drops.add(z.x, z.y - 12, 'mg', 1);
            Drops.add(z.x + 10, z.y - 12, 'zinc762', 1);
            Drops.add(z.x - 10, z.y - 12, 'medkit', 2);
          }
          this.list.splice(i, 1);
        }
        continue;
      }
      const dx = Player.x - z.x;
      const far = Math.abs(dx) > 900;
      if (far && !z.nest) { this.list.splice(i, 1); continue; }
      z.face = dx > 0 ? 1 : -1;
      const t = z.type || ZTYPES[0];
      // Ночью они видят дальше, а на запах крови идут почти через полэкрана
      let bleeding = 0;
      for (const l of LIMBS) if (Player.body[l.id].bleed) bleeding++;
      const sense = (t.gun ? 620 : 320) * (1 + Game.nightAmount() * 0.5) + bleeding * 90;
      const see = Math.abs(dx) < sense && !Player.dead;
      let spd = see ? z.speed : z.speed * 0.35;
      // вооружённые не лезут в упор: подходят на дистанцию выстрела и стреляют
      if (t.gun && see && Math.abs(dx) < 210) spd = -z.speed * 0.5;
      z.vx = (see ? z.face : z.wander) * spd;
      if (t.gun && see) {
        z.shootCd -= dt;
        if (z.shootCd <= 0 && Math.abs(dx) < 620) {
          z.shootCd = t.gun === 'mg' ? rnd(0.12, 0.2) : t.gun === 'rifle' ? rnd(0.5, 1.1) : rnd(0.9, 1.6);
          const ang = Math.atan2((Player.y - 30) - (z.y - 34), Player.x - z.x) + rnd(-0.09, 0.09);
          Bullets.spawn(z.x + z.face * 12, z.y - 34, ang, t.gun === 'mg' ? 9 : t.gun === 'rifle' ? 12 : 8, t.gun, true);
          Particles.flash(z.x + z.face * 18, z.y - 34, ang);
        }
      }
      // крикун зовёт остальных
      if (t.screams && see && Math.random() < dt * 0.35) {
        for (const o of this.list) if (o !== z && Math.abs(o.x - z.x) < 700) o.alerted = 2;
      }
      z.phase += dt * (4 + spd * 3);

      // Прыжок только через невысокий уступ вверх. Вниз зомби не сигают:
      // раньше они прыгали с этажей прямо на голову игроку
      const aheadX = z.x + z.face * 10;
      const acx = Math.floor(aheadX / CELL);
      if (z.onGround && World.solid(acx, Math.floor((z.y - 6) / CELL))) z.vy = -4.4;

      // край этажа: если впереди пропасть глубже трёх частиц — разворачиваемся
      if (z.onGround) {
        let drop = 0;
        const fy = Math.floor(z.y / CELL);
        while (drop < 5 && !World.solid(acx, fy + drop)) drop++;
        if (drop >= 4) {
          z.vx = 0;
          z.wander = -z.wander;
          if (!z.nest) z.face = -z.face;      // на этаже разворачиваемся, но не уходим
        }
      }

      z.vy = Math.min(z.vy + GRAV, 13);
      // движение
      const nx = z.x + z.vx;
      if (!this.hits(z, nx, z.y)) z.x = nx; else if (z.onGround && z.vx !== 0) z.vy = -4.2;
      const ny = z.y + z.vy;
      if (!this.hits(z, z.x, ny)) { z.y = ny; z.onGround = false; }
      else {
        if (z.vy > 0) { while (!this.hits(z, z.x, z.y + 1)) z.y += 1; z.onGround = true; }
        z.vy = 0;
      }
      this.holdFloor(z, dt);

      // атака
      z.cd = Math.max(0, (z.cd || 0) - dt);
      if (!Player.dead && Math.abs(Player.x - z.x) < 16 && Math.abs(Player.y - z.y) < 40 && z.cd <= 0) {
        z.cd = 1.0;
        Player.hp -= z.dmg;
        Player.stam = Math.max(0, Player.stam - 12);        // удар сбивает дыхание
        const limb = pick(['armL', 'armR', 'legL', 'legR', 'torso', 'head']);
        if (Math.random() < 0.7) Player.wound(limb, Math.random() < 0.32 ? 2 : 1);
        // укус заражает. Броня и куртка немного прикрывают
        const guard = Player.worn.coat ? 0.6 : 1;
        if (!t.gun && Math.random() < 0.3 * guard) {
          const was = Player.infection;
          Player.infection = clamp(Player.infection + rnd(8, 18), 0, 100);
          if (was === 0) { Player.say('Укус загноился — нужен антибиотик'); Floaters.push(Player.x, Player.y - 64, 'ЗАРАЖЕНИЕ', '#8fc060'); }
        }
        for (let k = 0; k < 8; k++) Particles.blood(Player.x, Player.y - 30);
        Game.shake = 5;
      }
    }
  },
  hits(z, x, y) {
    const x0 = Math.floor((x - 6) / CELL), x1 = Math.floor((x + 6) / CELL);
    const y0 = Math.floor((y - 46) / CELL), y1 = Math.floor((y - 1) / CELL);
    for (let cy = y0; cy <= y1; cy++) for (let cx = x0; cx <= x1; cx++) if (World.solid(cx, cy)) return true;
    return false;
  },
  // Кого именно поднимать: зависит от опасности локации и от прожитых дней.
  // В спокойных местах бродяги и псы, в мёртвой зоне — солдаты и громилы
  pickTier() {
    const z = zoneAtPx(Player.x);
    const danger = z.zombies || 1;
    const byDay = Math.min(9, (Game.day - 1) * 0.85);
    const horde = this.hordeActive() ? 3 : 0;
    const base = danger * 2.4 + byDay + horde;
    const spread = 2 + danger;
    return clamp(Math.round(base + rnd(-spread, spread)), 0, ZTYPES.length - 2);
  },

  make(x, y, tierIdx, face) {
    const t = ztype(tierIdx);
    const pw = this.power();
    const z = {
      type: t, x, y, vx: 0, vy: 0,
      hp: t.hp * rnd(0.9, 1.15) * pw, maxHp: t.hp,
      dmg: t.dmg * pw, speed: t.spd * rnd(0.92, 1.08) * Math.min(1.35, 1 + (Game.day - 1) * 0.015),
      face: face || (Math.random() < 0.5 ? -1 : 1),
      phase: Math.random() * 6, onGround: false,
      wander: Math.random() < 0.5 ? -1 : 1,
      pale: Math.random() < 0.4, shootCd: rnd(1, 3)
    };
    z.maxHp = z.hp;
    this.list.push(z);
    return z;
  },

  spawn() {
    const side = Math.random() < 0.5 ? -1 : 1;
    const x = Player.x + side * rnd(340, 620);
    const cx = clamp(Math.floor(x / CELL), 4, WW - 5);
    const y = (World.surface[cx] - 1) * CELL;
    return this.make(cx * CELL, y, this.pickTier(), -side);
  },
  draw(ctx) {
    for (const z of this.list) {
      if (z.hp <= 0) {
        ctx.save(); ctx.globalAlpha = clamp(1 - (z.dieT || 0) / 0.9, 0, 1);
        ctx.translate(z.x, z.y); ctx.rotate(z.face * 1.5); ctx.translate(-z.x, -z.y);
        drawZombie(ctx, z.x, z.y, z); ctx.restore();
        continue;
      }
      drawZombie(ctx, z.x, z.y, z);
      if (z.hp < 95) {
        ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(z.x - 12, z.y - 58, 24, 3);
        ctx.fillStyle = '#a8402f'; ctx.fillRect(z.x - 12, z.y - 58, 24 * clamp(z.hp / 95, 0, 1), 3);
      }
    }
  }
};

// ---- лут на земле и ящики ----
const Drops = {
  list: [],
  add(x, y, id, n, vx, vy, noPick) {
    this.list.push({
      x, y, id, n, t: 0, crate: false,
      vx: vx !== undefined ? vx : rnd(-0.6, 0.6),
      vy: vy !== undefined ? vy : -1.2,
      noPick: noPick || 0        // сколько секунд предмет нельзя поднять обратно
    });
  },
  addCrate(cx, cy, loot, military) {
    this.list.push({ x: cx * CELL, y: cy * CELL, crate: true, military, loot, opened: false, t: 0 });
  },
  update(dt) {
    for (const d of this.list) {
      d.t += dt;
      if (d.crate) continue;
      d.vy = Math.min(d.vy + GRAV * 0.6, 8);
      if (!World.solid(Math.floor((d.x + d.vx) / CELL), Math.floor(d.y / CELL))) d.x += d.vx; else d.vx *= -0.4;
      if (!World.solid(Math.floor(d.x / CELL), Math.floor((d.y + d.vy) / CELL))) d.y += d.vy;
      else { d.vy = 0; d.vx *= 0.7; }
    }
  },
  nearest(x, y, r) {
    let best = null, bd = r;
    for (const d of this.list) {
      if (d.crate && d.opened) continue;
      if (d.noPick && d.t < d.noPick) continue;
      const dd = dist(x, y, d.x, d.y - (d.crate ? 8 : 0));
      if (dd < bd) { bd = dd; best = d; }
    }
    return best;
  },
  take(d) {
    if (d.crate) {
      d.opened = true;
      for (const [id, n] of d.loot) {
        if (Player.inv.add(id, n) > 0) Drops.add(d.x + rnd(-8, 8), d.y - 12, id, n);
        Floaters.push(d.x, d.y - 16 - Math.random() * 10, '+' + n + ' ' + ITEMS[id].name, '#d8e0b0');
      }
      Player.say('Ящик вскрыт');
      Particles.burst(d.x, d.y - 8, [126, 96, 62], 8);
      return;
    }
    const left = Player.inv.add(d.id, d.n);
    if (left > 0) { d.n = left; Player.say('Инвентарь полон'); return; }
    Floaters.push(d.x, d.y - 10, '+' + d.n + ' ' + ITEMS[d.id].name, '#d8e0b0');
    this.list.splice(this.list.indexOf(d), 1);
  },
  draw(ctx) {
    for (const d of this.list) {
      if (d.crate) {
        const w = d.military ? 26 : 22, h = 16;
        ctx.save(); ctx.translate(d.x, d.y - h);
        ctx.fillStyle = d.opened ? 'rgba(60,50,40,0.6)' : (d.military ? '#4a5340' : '#7c5a34');
        ctx.beginPath(); ctx.roundRect(-w / 2, 0, w, h, 2); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.3)'; ctx.fillRect(-w / 2, h * 0.45, w, 2);
        ctx.fillStyle = d.military ? '#39402f' : '#5e4326';
        ctx.fillRect(-w / 2 + 2, 2, 3, h - 4); ctx.fillRect(w / 2 - 5, 2, 3, h - 4);
        if (d.military && !d.opened) {
          ctx.fillStyle = '#c9b166'; ctx.font = '700 6px system-ui'; ctx.textAlign = 'center';
          ctx.fillText('ARMY', 0, h * 0.4); ctx.textAlign = 'left';
        }
        if (!d.opened) {
          ctx.globalAlpha = 0.35 + Math.sin(d.t * 3) * 0.2;
          ctx.strokeStyle = '#e8dfa8'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.roundRect(-w / 2 - 1.5, -1.5, w + 3, h + 3, 3); ctx.stroke();
          ctx.globalAlpha = 1;
        }
        ctx.restore();
        continue;
      }
      const bob = Math.sin(d.t * 2.6) * 1.6;
      ctx.save(); ctx.translate(d.x - 8, d.y - 16 + bob);
      ctx.globalAlpha = 0.45; ctx.fillStyle = '#000';
      ctx.beginPath(); ctx.ellipse(8, 18 - bob, 7, 2.4, 0, 0, 7); ctx.fill();
      ctx.globalAlpha = 1;
      ITEMS[d.id].icon(ctx, 16);
      ctx.restore();
    }
  }
};

// ---- двери: проём 2×7, закрытая держит зомби ----
const Doors = {
  list: [],
  W: 2, H: 7,
  place(cx, cy) {
    // cy — верх проёма; вниз до опоры
    const x0 = cx, y0 = cy;
    for (let dx = 0; dx < this.W; dx++) for (let dy = 0; dy < this.H; dy++) {
      if (World.get(x0 + dx, y0 + dy) !== M.AIR) { Player.say('Проёму мешает порода'); return false; }
    }
    let support = false;
    for (let dx = 0; dx < this.W; dx++) if (World.solid(x0 + dx, y0 + this.H)) support = true;
    if (!support) { Player.say('Двери нужен пол под низом'); return false; }
    if (this.at(x0, y0)) { Player.say('Здесь уже дверь'); return false; }
    for (let dx = 0; dx < this.W; dx++) for (let dy = 0; dy < this.H; dy++) World.set(x0 + dx, y0 + dy, M.DOOR);
    this.list.push({ x: x0, y: y0, open: false, anim: 0 });
    return true;
  },
  at(cx, cy) {
    return this.list.find(d => cx >= d.x - 1 && cx < d.x + this.W + 1 && cy >= d.y - 1 && cy < d.y + this.H + 1);
  },
  nearest(px, py, r) {
    let best = null, bd = r;
    for (const d of this.list) {
      const dd = dist(px, py, (d.x + this.W / 2) * CELL, (d.y + this.H / 2) * CELL);
      if (dd < bd) { bd = dd; best = d; }
    }
    return best;
  },
  toggle(d) {
    d.open = !d.open;
    const mat = d.open ? M.DOOR_OPEN : M.DOOR;
    // не закрываемся прямо на игроке
    if (!d.open) {
      const px = Math.floor(Player.x / CELL);
      if (px >= d.x - 1 && px <= d.x + this.W && Math.abs(Player.y - (d.y + this.H) * CELL) < 60) {
        d.open = true; Player.say('Ты стоишь в проёме'); return;
      }
    }
    for (let dx = 0; dx < this.W; dx++) for (let dy = 0; dy < this.H; dy++) World.set(d.x + dx, d.y + dy, mat);
    Player.say(d.open ? 'Дверь открыта' : 'Дверь закрыта');
  },
  update(dt) {
    for (const d of this.list) d.anim = lerp(d.anim, d.open ? 1 : 0, Math.min(1, dt * 9));
  },
  draw(ctx) {
    for (const d of this.list) {
      const w = this.W * CELL, h = this.H * CELL;
      const px = d.x * CELL, py = d.y * CELL;
      // рама
      ctx.fillStyle = '#5a4026';
      ctx.fillRect(px - 2, py - 3, w + 4, 3);
      ctx.fillRect(px - 2, py - 3, 2, h + 3);
      ctx.fillRect(px + w, py - 3, 2, h + 3);
      // полотно: при открытии сжимается в сторону петель
      const openW = lerp(w, w * 0.18, d.anim);
      ctx.save();
      ctx.translate(px, py);
      const gr = ctx.createLinearGradient(0, 0, openW, 0);
      gr.addColorStop(0, '#7c5730'); gr.addColorStop(0.5, '#96703f'); gr.addColorStop(1, '#6b4a26');
      ctx.fillStyle = gr;
      ctx.fillRect(0, 0, openW, h);
      // доски и обвязка
      ctx.fillStyle = 'rgba(40,26,16,0.4)';
      for (let i = 1; i < 3; i++) ctx.fillRect(0, h * i / 3, openW, 1.4);
      ctx.fillStyle = 'rgba(255,240,210,0.12)';
      for (let i = 1; i < 3; i++) ctx.fillRect(0, h * i / 3 + 1.4, openW, 1);
      // петли и ручка
      ctx.fillStyle = '#4a4d52';
      ctx.fillRect(-1, h * 0.16, 3.4, 4);
      ctx.fillRect(-1, h * 0.74, 3.4, 4);
      if (d.anim < 0.5) {
        ctx.fillStyle = '#c9a94a';
        ctx.beginPath(); ctx.arc(openW - 4, h * 0.5, 1.8, 0, 7); ctx.fill();
      }
      ctx.restore();
    }
  }
};

// ---- дом: один флажок на всю игру, внутри радиации нет ----
const Home = {
  flag: null,
  R: 170,                       // радиус дома вокруг флажка
  place(cx, cy) {
    if (this.flag) { Player.say('Флажок уже стоит. Забери его, чтобы перенести дом'); return false; }
    if (!World.solid(cx, cy + 1)) { Player.say('Флажок нужно ставить на землю или пол'); return false; }
    this.flag = { x: cx * CELL + 4, y: (cy + 1) * CELL, t: 0 };
    Player.say('Дом отмечен. Внутри радиация тебя не тронет');
    return true;
  },
  take() {
    if (!this.flag) return false;
    this.flag = null;
    Player.inv.add('home_flag', 1);
    Player.say('Флажок снят. Дом больше не защищает');
    return true;
  },
  inside(px, py) {
    if (!this.flag) return false;
    return Math.abs(px - this.flag.x) < this.R && Math.abs(py - this.flag.y) < this.R * 0.8;
  },
  nearFlag(px, py, r) {
    if (!this.flag) return false;
    return dist(px, py, this.flag.x, this.flag.y - 20) < r;
  },
  update(dt) { if (this.flag) this.flag.t += dt; },
  draw(ctx) {
    const f = this.flag; if (!f) return;
    // граница дома: пунктирная линия по земле
    ctx.strokeStyle = 'rgba(210,180,110,0.22)'; ctx.lineWidth = 1; ctx.setLineDash([6, 6]);
    ctx.beginPath();
    ctx.moveTo(f.x - this.R, f.y - 2); ctx.lineTo(f.x + this.R, f.y - 2);
    ctx.stroke(); ctx.setLineDash([]);
    // древко
    ctx.strokeStyle = '#8a7a5a'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
    ctx.beginPath(); ctx.moveTo(f.x, f.y); ctx.lineTo(f.x, f.y - 42); ctx.stroke();
    // полотно, слегка колышется
    const w = Math.sin(f.t * 2.2) * 2.5;
    ctx.fillStyle = '#b8452f';
    ctx.beginPath();
    ctx.moveTo(f.x + 1, f.y - 41);
    ctx.quadraticCurveTo(f.x + 12, f.y - 38 + w, f.x + 24, f.y - 34 - w);
    ctx.quadraticCurveTo(f.x + 13, f.y - 28 + w, f.x + 1, f.y - 26);
    ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,0.22)';
    ctx.beginPath();
    ctx.moveTo(f.x + 1, f.y - 41);
    ctx.quadraticCurveTo(f.x + 10, f.y - 38 + w, f.x + 14, f.y - 36 - w);
    ctx.lineTo(f.x + 1, f.y - 33);
    ctx.fill();
    ctx.fillStyle = '#5a4a30';
    ctx.beginPath(); ctx.ellipse(f.x, f.y, 5, 1.8, 0, 0, 7); ctx.fill();
  }
};
