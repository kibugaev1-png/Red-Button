// Склад торговца: у каждого свой запас, который кончается и приходит обратно
// только с новым днём. Скупает он тоже не всё — только то, что по профилю
const Shop = {
  left: {}, day: 0,
  key(def, id) { return def.id + ':' + id; },
  restock() {
    this.left = {};
    for (const d of TRADERS) for (const [id, , , lim] of d.stock) this.left[this.key(d, id)] = lim || 1;
    this.day = Game.day;
  },
  ensure() { if (this.day !== Game.day) this.restock(); },
  stockLeft(def, id) { this.ensure(); const v = this.left[this.key(def, id)]; return v === undefined ? 0 : v; },
  takeOne(def, id) { this.ensure(); this.left[this.key(def, id)] = Math.max(0, this.stockLeft(def, id) - 1); },
  // Цена скупки. Торговец берёт только своё и платит втрое меньше, чем сам
  // просит: наживаться на перепродаже не выйдет
  sellPrice(def, id) {
    const mul = def.buys && def.buys[id];
    if (!mul) return 0;
    return Math.max(1, Math.round(unitPrice(id) * 0.34 * mul));
  }
};

// Прейскурант мира: за основу берём цены самих торговцев, а на то, чем никто
// не торгует (руда, порох, оружие с боя), даём отдельную вилку
const EXTRA_PRICE = {
  iron_ore: 5, copper_ore: 4, hqm_ore: 14, sulfur_ore: 5, sulfur: 9, gunpowder: 7,
  charcoal: 2, hqm: 26, dirt: 1, stick: 1, potato: 4, potato_baked: 7, meat_rot: 2,
  rifle: 380, sniper: 520, mg: 700, smg: 300
};
let PRICE_INDEX = null;
function unitPrice(id) {
  if (!PRICE_INDEX) {
    PRICE_INDEX = {};
    for (const d of TRADERS) for (const [i, n, p] of d.stock) {
      const u = p / Math.max(1, n);
      if (PRICE_INDEX[i] === undefined || u < PRICE_INDEX[i]) PRICE_INDEX[i] = u;
    }
  }
  return PRICE_INDEX[id] !== undefined ? PRICE_INDEX[id] : (EXTRA_PRICE[id] || 2);
}

const Missions = {
  list: [
    { id: 'iron', text: 'Принести 20 железа', need: { iron: 20 }, pay: 45, state: 0 },
    { id: 'kill', text: 'Уложить 15 зомби', kills: 15, pay: 55, state: 0, from: 0 },
    { id: 'food', text: 'Принести 10 печёной картошки', need: { potato_baked: 10 }, pay: 40, state: 0 },
    { id: 'coal', text: 'Принести 40 угля', need: { coal: 40 }, pay: 50, state: 0 }
  ],
  onKill() {
    for (const m of this.list) if (m.kills && m.state === 1 && Player.kills - m.from >= m.kills) m.state = 2;
  },
  accept(m) {
    if (m.state !== 0) return;
    m.state = 1;
    if (m.kills) m.from = Player.kills;
    Player.say('Задание взято: ' + m.text);
  },
  turnIn(m) {
    if (m.state === 0) { this.accept(m); return; }
    if (m.state === 3) { Player.say('Уже сдано'); return; }
    if (m.need) {
      if (!Player.inv.has(m.need)) { Player.say('Не хватает материалов'); return; }
      for (const k in m.need) Player.inv.remove(k, m.need[k]);
    } else if (m.state !== 2) {
      Player.say('Осталось убить: ' + (m.kills - (Player.kills - m.from))); return;
    }
    m.state = 3;
    Player.coins += m.pay;
    Player.say('Задание сдано: +' + m.pay + ' монет');
  },
  progress(m) {
    if (m.state === 3) return 'сдано';
    if (m.state === 0) return 'не взято';
    if (m.kills) return Math.min(m.kills, Player.kills - m.from) + '/' + m.kills + ' зомби';
    const k = Object.keys(m.need)[0];
    return Player.inv.count(k) + '/' + m.need[k] + ' ' + ITEMS[k].name.toLowerCase();
  }
};

const City = {
  trader: null, board: null, props: [], lamps: [], traders: [],
  build() {
    const z = ZONES.find(zz => zz.id === 'city');
    const cx = Math.floor((z.x0 + z.x1) / 2);
    const base = World.surface[cx];
    // каждый торговец стоит в своей локации на своём месте
    this.traders = [];
    for (const def of TRADERS) {
      const zz = ZONES.find(q => q.id === def.zone);
      if (!zz) continue;
      const tx = Math.round(zz.x0 + (zz.x1 - zz.x0) * def.at);
      this.traders.push({ def, x: tx * CELL, y: (World.surface[tx] - 1) * CELL, phase: Math.random() * 6 });
    }
    this.trader = this.traders[0];
    this.board = { x: (cx + 14) * CELL, y: (base - 1) * CELL };
    // фонари, бочки, мешки, ящики, вывески — то, что делает город обжитым
    this.props = []; this.lamps = [];
    const rand = mulberry32(31337);
    for (let i = 0; i < 9; i++) {
      const lx = z.x0 + 24 + i * 62;
      this.lamps.push({ x: lx * CELL, y: (World.surface[lx] - 1) * CELL, t: rand() * 9 });
    }
    for (let i = 0; i < 26; i++) {
      const px = z.x0 + 14 + Math.floor(rand() * (z.x1 - z.x0 - 28));
      const kind = rand() < 0.32 ? 'barrel' : rand() < 0.55 ? 'sandbag' : rand() < 0.8 ? 'crate' : 'banner';
      this.props.push({ x: px * CELL, y: (World.surface[px] - 1) * CELL, kind, r: rand() });
    }
  },
  lights() {
    return this.lamps.map(l => ({ x: l.x, y: l.y - 46, r: 190, i: 0.95 }));
  },
  nearest(x, y, r) {
    for (const t of this.traders) {
      if (dist(x, y, t.x, t.y - 26) < r) return { kind: 'trader', trader: t };
    }
    if (this.board && dist(x, y, this.board.x, this.board.y - 26) < r) return { kind: 'board' };
    return null;
  },
  update(dt) { for (const t of this.traders) t.phase += dt; },
  draw(ctx) {
    if (!this.traders.length) return;
    // Отсечение по экрану. Раньше вся обстановка города рисовалась с
    // градиентами каждый кадр, даже когда игрок был в другой локации, — это
    // съедало шестую часть кадра впустую.
    const v = Game.view;
    const vis = v ? (x, m) => x > v.x - m && x < v.x + v.w + m : () => true;
    // ---- обстановка города ----
    for (const p of this.props) {
      if (!vis(p.x, 80)) continue;
      ctx.save(); ctx.translate(p.x, p.y);
      if (p.kind === 'barrel') {
        const bg = ctx.createLinearGradient(-6, 0, 6, 0);
        bg.addColorStop(0, '#4a5a48'); bg.addColorStop(0.5, '#6d8168'); bg.addColorStop(1, '#3e4c3e');
        ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(-6, -17, 12, 17, 2); ctx.fill();
        ctx.fillStyle = 'rgba(150,86,44,0.4)'; ctx.fillRect(-6, -12, 12, 2); ctx.fillRect(-6, -6, 12, 2);
        ctx.fillStyle = '#8a9a84'; ctx.beginPath(); ctx.ellipse(0, -17, 6, 2, 0, 0, 7); ctx.fill();
      } else if (p.kind === 'sandbag') {
        for (let r = 0; r < 2; r++) for (let i = 0; i < 3 - r; i++) {
          ctx.fillStyle = r ? '#8d8267' : '#7d7359';
          ctx.beginPath(); ctx.ellipse(-9 + i * 9 + r * 4.5, -4 - r * 6, 5.4, 3.4, 0, 0, 7); ctx.fill();
          ctx.strokeStyle = 'rgba(50,44,32,0.4)'; ctx.lineWidth = 0.7;
          ctx.beginPath(); ctx.ellipse(-9 + i * 9 + r * 4.5, -4 - r * 6, 5.4, 3.4, 0, 0, 7); ctx.stroke();
        }
      } else if (p.kind === 'crate') {
        ctx.fillStyle = '#7c5a34'; ctx.beginPath(); ctx.roundRect(-8, -15, 16, 15, 1.5); ctx.fill();
        ctx.strokeStyle = '#5e4326'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(-8, -15); ctx.lineTo(8, 0); ctx.moveTo(8, -15); ctx.lineTo(-8, 0); ctx.stroke();
      } else {
        // тканевый баннер на шесте
        ctx.strokeStyle = '#5a4a30'; ctx.lineWidth = 2;
        ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(0, -34); ctx.stroke();
        ctx.fillStyle = p.r > 0.5 ? '#8a4a3c' : '#4a6a7a';
        ctx.beginPath(); ctx.moveTo(1, -33); ctx.lineTo(15, -31); ctx.lineTo(13, -18); ctx.lineTo(1, -20); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.18)'; ctx.fillRect(3, -30, 9, 2);
      }
      ctx.restore();
    }
    // ---- фонари ----
    for (const l of this.lamps) {
      if (!vis(l.x, 140)) continue;
      l.t += 0.05;
      ctx.strokeStyle = '#4a4d52'; ctx.lineWidth = 2.6;
      ctx.beginPath(); ctx.moveTo(l.x, l.y); ctx.lineTo(l.x, l.y - 46); ctx.lineTo(l.x + 8, l.y - 46); ctx.stroke();
      const night = Game.nightAmount();
      const flick = 1 + Math.sin(l.t * 4) * 0.05;
      ctx.fillStyle = '#3c4046';
      ctx.beginPath(); ctx.moveTo(l.x + 3, l.y - 46); ctx.lineTo(l.x + 13, l.y - 46); ctx.lineTo(l.x + 11, l.y - 40); ctx.lineTo(l.x + 5, l.y - 40); ctx.fill();
      const gr = ctx.createRadialGradient(l.x + 8, l.y - 40, 0, l.x + 8, l.y - 40, 16 * flick);
      gr.addColorStop(0, 'rgba(255,240,190,' + (0.5 + night * 0.5) + ')');
      gr.addColorStop(1, 'rgba(255,210,120,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.arc(l.x + 8, l.y - 40, 16 * flick, 0, 7); ctx.fill();
    }
    // Каждый торговец рисуется в своём цвете и со своей вывеской
    for (const t of this.traders) {
      if (!vis(t.x, 120)) continue;
      const d = t.def;
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath(); ctx.ellipse(t.x, t.y, 10, 2.6, 0, 0, 7); ctx.fill();
      drawHuman(ctx, t.x, t.y, { skin: d.id.length % 5, hair: 1, hairStyle: 3, beard: true },
        { face: -1, phase: t.phase, moving: false, mask: d.zone !== 'city' });
      // плащ в цвете лавки
      ctx.fillStyle = d.coat;
      ctx.beginPath();
      ctx.moveTo(t.x - 8, t.y - 42); ctx.quadraticCurveTo(t.x - 12, t.y - 12, t.x - 9, t.y - 2);
      ctx.lineTo(t.x + 8, t.y - 2); ctx.quadraticCurveTo(t.x + 11, t.y - 16, t.x + 7, t.y - 42);
      ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.28)'; ctx.fillRect(t.x - 8, t.y - 26, 16, 3);
      // шапка
      ctx.fillStyle = d.hat;
      ctx.beginPath(); ctx.ellipse(t.x - 0.5, t.y - 54, 7, 3.4, 0, Math.PI, 0); ctx.fill();
      ctx.fillRect(t.x - 8, t.y - 54, 15, 2);
      // прилавок с товаром
      ctx.fillStyle = '#6b4a26'; ctx.beginPath(); ctx.roundRect(t.x + 14, t.y - 16, 30, 4, 1.5); ctx.fill();
      ctx.fillStyle = '#553a1e'; ctx.fillRect(t.x + 17, t.y - 12, 4, 12); ctx.fillRect(t.x + 37, t.y - 12, 4, 12);
      // на прилавке лежит то, чем он торгует
      ctx.save(); ctx.translate(t.x + 19, t.y - 30); ctx.scale(0.5, 0.5);
      const first = ITEMS[d.stock[0][0]]; if (first) first.icon(ctx, 20);
      ctx.restore();
      ctx.save(); ctx.translate(t.x + 31, t.y - 29); ctx.scale(0.42, 0.42);
      const second = ITEMS[d.stock[1][0]]; if (second) second.icon(ctx, 20);
      ctx.restore();
      // вывеска с именем
      const label = d.name.toUpperCase() + ' · E';
      ctx.font = '700 7px system-ui'; ctx.textAlign = 'center';
      const lw = Math.max(46, ctx.measureText(label).width + 12);
      ctx.fillStyle = 'rgba(20,20,18,0.85)';
      ctx.beginPath(); ctx.roundRect(t.x + 17 - lw / 2, t.y - 62, lw, 12, 2); ctx.fill();
      ctx.strokeStyle = d.coat; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.roundRect(t.x + 17 - lw / 2, t.y - 62, lw, 12, 2); ctx.stroke();
      ctx.fillStyle = '#d8c88a';
      ctx.fillText(label, t.x + 17, t.y - 53);
      ctx.textAlign = 'left';
    }

    // доска заданий
    const b = this.board;
    ctx.fillStyle = '#6b4a26'; ctx.fillRect(b.x - 2, b.y - 22, 4, 22);
    ctx.fillStyle = '#7c5a34'; ctx.beginPath(); ctx.roundRect(b.x - 16, b.y - 44, 32, 24, 2); ctx.fill();
    ctx.fillStyle = '#d8d2c0';
    for (let i = 0; i < 3; i++) ctx.fillRect(b.x - 12 + (i % 2) * 12, b.y - 40 + i * 6, 10, 6);
    ctx.fillStyle = 'rgba(20,20,18,0.85)';
    ctx.beginPath(); ctx.roundRect(b.x - 20, b.y - 60, 40, 12, 2); ctx.fill();
    ctx.fillStyle = '#d8c88a'; ctx.font = '700 7px system-ui'; ctx.textAlign = 'center';
    ctx.fillText('ЗАДАНИЯ · E', b.x, b.y - 51);
    ctx.textAlign = 'left';
  }
};

const Machines = {
  list: [],
  torches: [],
  defs: {
    workbench: { w: 4, h: 3, name: 'Верстак' },
    furnace: { w: 4, h: 4, name: 'Печь' },
    workbench2: { w: 5, h: 3, name: 'Верстак 2 ур.' },
    workbench3: { w: 6, h: 3, name: 'Верстак 3 ур.' },
    campfire: { w: 4, h: 2, name: 'Костёр' },
    drill: { w: 4, h: 5, name: 'Автобур' },
    farm: { w: 3, h: 1, name: 'Грядка' },
    refinery: { w: 5, h: 4, name: 'НПЗ' },
  },
  bed() { return this.list.find(m => m.type === 'bed'); },
  place(itemId, cx, cy) {
    const it = ITEMS[itemId];
    const def = this.defs[it.machine];
    // клик по полу или земле = поставить сверху: поднимаемся над твердью
    let base = cy;
    for (let i = 0; i < 4 && World.solid(cx, base); i++) base--;
    const x0 = cx - Math.floor(def.w / 2);
    if (!World.solid(cx, base + 1) && !World.solid(cx, base + 2)) { Player.say('Нужен пол или земля под низом'); return false; }
    if (this.boxBusy(x0, base, def.w, def.h)) { Player.say('Здесь уже стоит'); return false; }
    // тяжёлую машину не ставим себе под ноги
    if (def.h > 3 && Math.abs((x0 + def.w / 2) * CELL - Player.x) < 14) { Player.say('Отойди на шаг'); return false; }
    for (let x = x0; x < x0 + def.w; x++) {
      for (let y = base; y > base - def.h; y--) {
        const m = World.get(x, y);
        if (m !== M.AIR && !MATS[m].door) World.set(x, y, M.AIR);        // расчищаем место
      }
      if (!World.solid(x, base + 1)) World.set(x, base + 1, M.DIRT);      // подсыпаем опору
    }
    if (it.machine === 'farm') {
      const under = World.get(cx, base + 1);
      if (under !== M.GRASS && under !== M.DIRT && under !== M.CLAY) { Player.say('Грядка ставится на землю'); return false; }
      for (let x = x0; x < x0 + def.w; x++) World.set(x, base + 1, M.FARM);
    }
    this.list.push({
      type: it.machine, x: x0, y: base, w: def.w, h: def.h,
      fuel: 0, prog: 0, buffer: {}, seed: null, growth: 0, depth: 0, anim: 0
    });
    return true;
  },
  addTorch(cx, cy) { this.torches.push({ x: cx * CELL + 4, y: cy * CELL + 4, t: Math.random() * 9 }); },
  // строгое пересечение: две машины можно ставить вплотную друг к другу
  at(cx, cy) {
    return this.list.find(m => cx >= m.x && cx < m.x + m.w && cy <= m.y && cy > m.y - m.h);
  },
  // занята ли площадка под новую машину шириной w и высотой h
  boxBusy(x0, y0, w, h) {
    return this.list.some(m => x0 < m.x + m.w && x0 + w > m.x && y0 - h < m.y && y0 > m.y - m.h);
  },
  near(x, y, type) {
    return this.list.some(m => m.type === type && dist(x, y - 20, (m.x + m.w / 2) * CELL, m.y * CELL) < 90);
  },
  nearFire(x, y) {
    if (this.list.some(m => (m.type === 'campfire' || (m.type === 'furnace' && m.fuel > 0)) && dist(x, y - 20, (m.x + m.w / 2) * CELL, m.y * CELL) < 80)) return true;
    return this.torches.some(t => dist(x, y - 20, t.x, t.y) < 60);
  },
  plant(cx, cy, seedId) {
    const m = this.list.find(mm => mm.type === 'farm' && cx >= mm.x - 1 && cx <= mm.x + mm.w && Math.abs(cy - mm.y) <= 2);
    if (!m || m.seed) return false;
    m.seed = seedId; m.growth = 0;
    Player.say('Посажено');
    return true;
  },
  update(dt) {
    for (const m of this.list) {
      m.anim += dt;
      if (m.type === 'campfire') {
        if (Math.random() < dt * 14) Particles.smoke((m.x + m.w / 2) * CELL + rnd(-4, 4), (m.y - 1) * CELL, 'rgba(90,90,90,0.35)');
      }
      if (m.type === 'furnace' && m.fuel > 0) {
        m.fuel -= dt;
        if (Math.random() < dt * 8) Particles.smoke((m.x + m.w / 2) * CELL, (m.y - m.h) * CELL, 'rgba(70,70,70,0.4)');
      }
      if (m.type === 'farm' && m.seed) {
        const def = ITEMS[m.seed];
        m.growth = Math.min(def.grow, m.growth + dt);
      }
      if (m.type === 'refinery') {
        // уголь идёт вдвое эффективнее дерева
        if (m.fuel <= 0) {
          if ((m.buffer.coal || 0) > 0) { m.buffer.coal--; m.fuel = 8; m.yield = 2; }
          else if ((m.buffer.wood || 0) > 0) { m.buffer.wood--; m.fuel = 8; m.yield = 1; }
        }
        if (m.fuel > 0) {
          m.fuel -= dt; m.prog += dt;
          m.anim += dt;
          if (Math.random() < dt * 6) Particles.smoke((m.x + m.w - 1) * CELL, (m.y - m.h) * CELL, 'rgba(90,86,80,0.45)');
          if (m.prog > 2.4) {
            m.prog = 0;
            m.out = (m.out || 0) + (m.yield || 1);
            Floaters.push((m.x + m.w / 2) * CELL, (m.y - m.h) * CELL, '+' + (m.yield || 1) + ' топливо', '#e08a4a');
          }
        }
      }

      if (m.type === 'drill') {
        if (m.fuel <= 0) {
          // автозаправка из внутреннего запаса топлива
          if ((m.buffer.fuel || 0) > 0) { m.buffer.fuel--; m.fuel = 26; }
        }
        if (m.fuel > 0) {
          m.fuel -= dt;
          m.prog += dt;
          if (Math.random() < dt * 10) Particles.burst((m.x + m.w / 2) * CELL, (m.y + 1 + m.depth) * CELL, [110, 100, 92], 1);
          if (m.prog > 1.6) {
            m.prog = 0;
            const dy = m.y + 1 + m.depth;
            const cx = m.x + Math.floor(m.w / 2);
            let got = false;
            for (let x = m.x; x < m.x + m.w; x++) {
              const mat = World.get(x, dy);
              if (mat !== M.AIR && mat !== M.WATER) {
                const drop = MATS[mat].drop;
                if (drop) m.buffer[drop] = (m.buffer[drop] || 0) + 1;
                World.set(x, dy, M.AIR);
                got = true;
              }
            }
            if (!got) m.depth++;
            if (dy > WH - 4) m.depth = 0;
          }
        }
      }
    }
  },
  // взаимодействие: забрать из бура, собрать урожай, заправить
  interact(m) {
    if (m.type === 'refinery') {
      // забираем готовое топливо
      if ((m.out || 0) > 0) {
        const left = Player.inv.add('fuel', m.out);
        const got = m.out - left; m.out = left;
        if (got) { Player.say('Забрал топливо: ' + got); return; }
      }
      // загружаем сырьё
      const coal = Player.inv.count('coal'), wood = Player.inv.count('wood');
      if (coal > 0) {
        const n = Math.min(20, coal);
        Player.inv.remove('coal', n); m.buffer.coal = (m.buffer.coal || 0) + n;
        Player.say('НПЗ загружен: ' + n + ' угля'); return;
      }
      if (wood > 0) {
        const n = Math.min(40, wood);
        Player.inv.remove('wood', n); m.buffer.wood = (m.buffer.wood || 0) + n;
        Player.say('НПЗ загружен: ' + n + ' дерева'); return;
      }
      Player.say('Нужен уголь или дерево');
      return;
    }
    if (m.type === 'drill') {
      let took = 0;
      // сначала заправляем топливом из инвентаря
      const fuel = Player.inv.count('fuel');
      if (m.fuel <= 0 && (m.buffer.fuel || 0) === 0 && fuel > 0) {
        const n = Math.min(10, fuel);
        Player.inv.remove('fuel', n);
        m.buffer.fuel = (m.buffer.fuel || 0) + n;
        Player.say('Заправил бур: ' + n + ' топлива');
        return;
      }
      for (const id in m.buffer) {
        if (id === 'fuel') continue;
        const n = m.buffer[id];
        if (n <= 0) continue;
        const left = Player.inv.add(id, n);
        m.buffer[id] = left;
        took += n - left;
      }
      if (took) { Player.say('Забрал из бура: ' + took); Floaters.push((m.x + m.w / 2) * CELL, m.y * CELL - 20, '+' + took, '#cfe0b0'); }
      else Player.say(m.fuel > 0 ? 'Бур работает, пусто' : 'Буру нужно топливо с НПЗ');
      return;
    }
    if (m.type === 'farm') {
      if (!m.seed) { Player.say('Посади семена (ПКМ семенами)'); return; }
      const def = ITEMS[m.seed];
      if (m.growth < def.grow) { Player.say('Ещё растёт: ' + Math.round(m.growth / def.grow * 100) + '%'); return; }
      const [id, n] = def.yield;
      const total = n + (Math.random() < 0.4 ? 1 : 0);
      Player.inv.add(id, total);
      Player.inv.add(m.seed, 1);
      Floaters.push((m.x + m.w / 2) * CELL, m.y * CELL - 14, '+' + total + ' ' + ITEMS[id].name, '#cfe0b0');
      m.seed = null; m.growth = 0;
      return;
    }
    if (m.type === 'furnace') {
      const coal = Player.inv.count('coal');
      if (coal > 0) {
        const n = Math.min(5, coal);
        Player.inv.remove('coal', n); m.fuel += n * 12;
        Player.say('Печь затоплена');
      } else Player.say('Нужен уголь');
      return;
    }
    if (m.type === 'bed') {
      // сон до утра: восстанавливает психику и немного здоровья
      Game.time = DAY_LEN * 0.3;
      Game.day++;
      Player.hp = clamp(Player.hp + 12, 0, 100);
      Player.food = clamp(Player.food - 40, 1, FOOD_MAX);
      Player.water = clamp(Player.water - 46, 1, WATER_MAX);
      Zombies.list.length = 0;
      Player.say('Утро. Ты спал в своей кровати');
      return;
    }
    if (m.type === 'workbench' || m.type === 'workbench2' || m.type === 'workbench3') { UI.screen = 'craft'; return; }
    if (m.type === 'campfire') { UI.screen = 'craft'; return; }
  },
  nearest(x, y, r) {
    let best = null, bd = r;
    for (const m of this.list) {
      const d = dist(x, y, (m.x + m.w / 2) * CELL, m.y * CELL - 6);
      if (d < bd) { bd = d; best = m; }
    }
    return best;
  },
  lights() {
    const out = [];
    for (const t of this.torches) out.push({ x: t.x, y: t.y, r: 130, i: 0.95 });
    for (const m of this.list) {
      if (m.type === 'campfire') out.push({ x: (m.x + m.w / 2) * CELL, y: m.y * CELL - 4, r: 170, i: 1 });
      if (m.type === 'furnace' && m.fuel > 0) out.push({ x: (m.x + m.w / 2) * CELL, y: m.y * CELL - 10, r: 140, i: 0.9 });
      if (m.type === 'drill' && m.fuel > 0) out.push({ x: (m.x + m.w / 2) * CELL, y: m.y * CELL - 20, r: 90, i: 0.6 });
    }
    return out;
  },
  draw(ctx) {
    for (const t of this.torches) {
      t.t += 0.1;
      ctx.strokeStyle = '#7b5c38'; ctx.lineWidth = 2.4; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.moveTo(t.x, t.y + 5); ctx.lineTo(t.x, t.y - 3); ctx.stroke();
      const f = 1 + Math.sin(t.t * 3) * 0.14;
      const gr = ctx.createRadialGradient(t.x, t.y - 7, 0, t.x, t.y - 7, 9 * f);
      gr.addColorStop(0, '#fff6c8'); gr.addColorStop(0.4, '#f2a83c'); gr.addColorStop(1, 'rgba(230,110,30,0)');
      ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(t.x, t.y - 7, 5 * f, 8 * f, 0, 0, 7); ctx.fill();
      if (Math.random() < 0.12) Particles.smoke(t.x, t.y - 10, 'rgba(120,110,100,0.25)');
    }
    for (const m of this.list) {
      const px = m.x * CELL, py = m.y * CELL, w = m.w * CELL, h = m.h * CELL;
      ctx.save();
      if (m.type === 'workbench') {
        ctx.fillStyle = '#6b4a26'; ctx.fillRect(px + 3, py - h + 8, 5, h - 8); ctx.fillRect(px + w - 8, py - h + 8, 5, h - 8);
        ctx.fillStyle = '#8a6134'; ctx.beginPath(); ctx.roundRect(px - 2, py - h, w + 4, 9, 2); ctx.fill();
        ctx.fillStyle = 'rgba(0,0,0,0.25)'; ctx.fillRect(px - 2, py - h + 7, w + 4, 2);
        ctx.fillStyle = '#9aa0a6'; ctx.fillRect(px + w * 0.5, py - h - 4, 10, 4);
        ctx.fillStyle = '#7a5c38'; ctx.fillRect(px + 4, py - h - 5, 7, 5);
      } else if (m.type === 'furnace') {
        const g2 = ctx.createLinearGradient(px, py - h, px, py);
        g2.addColorStop(0, '#8b8d90'); g2.addColorStop(1, '#5f6164');
        ctx.fillStyle = g2; ctx.beginPath(); ctx.roundRect(px, py - h, w, h, 3); ctx.fill();
        ctx.fillStyle = '#4a4c4f'; ctx.fillRect(px + 3, py - h - 5, 7, 6);
        ctx.fillStyle = m.fuel > 0 ? '#2a1c14' : '#22242a';
        ctx.beginPath(); ctx.roundRect(px + w * 0.25, py - h * 0.5, w * 0.5, h * 0.4, 2); ctx.fill();
        if (m.fuel > 0) {
          const fl = 1 + Math.sin(m.anim * 7) * 0.15;
          const gr = ctx.createRadialGradient(px + w / 2, py - h * 0.22, 0, px + w / 2, py - h * 0.22, w * 0.4 * fl);
          gr.addColorStop(0, '#fff0b8'); gr.addColorStop(0.5, '#e8721e'); gr.addColorStop(1, 'rgba(200,60,10,0)');
          ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(px + w / 2, py - h * 0.24, w * 0.3 * fl, h * 0.2 * fl, 0, 0, 7); ctx.fill();
        }
      } else if (m.type === 'campfire') {
        ctx.strokeStyle = '#5e4326'; ctx.lineWidth = 3.4; ctx.lineCap = 'round';
        ctx.beginPath(); ctx.moveTo(px + 3, py - 2); ctx.lineTo(px + w - 3, py - 9);
        ctx.moveTo(px + w - 3, py - 2); ctx.lineTo(px + 3, py - 9); ctx.stroke();
        for (let i = 0; i < 5; i++) {
          ctx.fillStyle = '#6f7176';
          ctx.beginPath(); ctx.ellipse(px + 2 + i * (w - 4) / 4, py, 2.6, 2, 0, 0, 7); ctx.fill();
        }
        const fl = 1 + Math.sin(m.anim * 8) * 0.18;
        const gr = ctx.createRadialGradient(px + w / 2, py - 10, 0, px + w / 2, py - 10, 16 * fl);
        gr.addColorStop(0, '#fff6cc'); gr.addColorStop(0.35, '#f5a52e'); gr.addColorStop(1, 'rgba(220,90,20,0)');
        ctx.fillStyle = gr; ctx.beginPath(); ctx.ellipse(px + w / 2, py - 11, 9 * fl, 15 * fl, 0, 0, 7); ctx.fill();
      } else if (m.type === 'drill') {
        // опорная рама
        ctx.strokeStyle = '#4a3f36'; ctx.lineWidth = 2.6; ctx.lineCap = 'round';
        ctx.beginPath();
        ctx.moveTo(px + 2, py); ctx.lineTo(px + w * 0.3, py - h * 0.55);
        ctx.moveTo(px + w - 2, py); ctx.lineTo(px + w * 0.7, py - h * 0.55);
        ctx.stroke();
        // корпус
        const bg = ctx.createLinearGradient(px, py - h, px, py - h * 0.35);
        bg.addColorStop(0, '#6a7078'); bg.addColorStop(1, '#3c4146');
        ctx.fillStyle = bg; ctx.beginPath(); ctx.roundRect(px, py - h, w, h * 0.58, 3); ctx.fill();
        ctx.strokeStyle = '#2b2f33'; ctx.lineWidth = 1; ctx.stroke();
        // ржавчина и клёпки
        ctx.fillStyle = 'rgba(120,74,44,0.35)';
        ctx.fillRect(px + 2, py - h * 0.5, w - 4, 2);
        ctx.fillStyle = '#2b2f33';
        for (let i = 0; i < 4; i++) ctx.fillRect(px + 3 + i * (w - 8) / 3, py - h + 2.5, 1.6, 1.6);
        // труба и дым
        ctx.fillStyle = '#33383c'; ctx.fillRect(px + w - 9, py - h - 6, 5, 7);
        // лампа работы
        ctx.fillStyle = m.fuel > 0 ? '#e8c04a' : '#5a5040';
        ctx.beginPath(); ctx.arc(px + 5, py - h * 0.72, 2.2, 0, 7); ctx.fill();
        // индикатор угля
        ctx.fillStyle = '#1d2024'; ctx.beginPath(); ctx.roundRect(px + 9, py - h * 0.74, w - 16, 4.4, 2); ctx.fill();
        ctx.fillStyle = '#c0703c';
        ctx.beginPath(); ctx.roundRect(px + 9.5, py - h * 0.74 + 0.5, (w - 17) * clamp((m.buffer.coal || 0) / 10, 0, 1), 3.4, 1.7); ctx.fill();
        // бур
        const spin = m.fuel > 0 ? m.anim * 12 : 0;
        ctx.save();
        ctx.translate(px + w / 2, py - h * 0.3 + (m.depth * CELL));
        ctx.fillStyle = '#9aa0a6';
        ctx.beginPath(); ctx.moveTo(-5, 0); ctx.lineTo(5, 0); ctx.lineTo(0, 22 + Math.sin(spin) * 2); ctx.fill();
        ctx.strokeStyle = '#6d7378'; ctx.lineWidth = 1.4;
        for (let i = 0; i < 3; i++) {
          const yy = 4 + i * 6, ph = spin + i;
          ctx.beginPath(); ctx.moveTo(-4 + Math.sin(ph) * 2, yy); ctx.lineTo(4 + Math.sin(ph) * 2, yy + 2); ctx.stroke();
        }
        ctx.restore();
      } else if (m.type === 'bed') {
        // каркас, матрас, подушка, одеяло
        ctx.fillStyle = '#5a3f20';
        ctx.fillRect(px, py - 4, 4, 4); ctx.fillRect(px + w - 4, py - 4, 4, 4);
        ctx.fillStyle = '#6b4a26';
        ctx.beginPath(); ctx.roundRect(px, py - h + 2, w, 5, 1.5); ctx.fill();
        ctx.fillStyle = '#4a3418';
        ctx.beginPath(); ctx.roundRect(px - 1, py - h - 4, 4, 12, 1.5); ctx.fill();
        ctx.beginPath(); ctx.roundRect(px + w - 3, py - h - 1, 4, 9, 1.5); ctx.fill();
        const mg = ctx.createLinearGradient(px, py - h - 2, px, py - h + 3);
        mg.addColorStop(0, '#8a7060'); mg.addColorStop(1, '#6a5446');
        ctx.fillStyle = mg;
        ctx.beginPath(); ctx.roundRect(px + 2, py - h - 2, w - 4, 6, 2); ctx.fill();
        ctx.fillStyle = '#8a4a3c';
        ctx.beginPath(); ctx.roundRect(px + w * 0.35, py - h - 3, w * 0.6, 6, 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.14)';
        ctx.fillRect(px + w * 0.35, py - h - 3, w * 0.6, 1.4);
        ctx.fillStyle = '#cfc8b4';
        ctx.beginPath(); ctx.roundRect(px + 3, py - h - 4, w * 0.24, 5, 2); ctx.fill();
      } else if (m.type === 'refinery') {
        // корпус, труба, бак, манометр
        ctx.fillStyle = '#4e5359';
        ctx.beginPath(); ctx.roundRect(px, py - h, w * 0.62, h, 3); ctx.fill();
        ctx.fillStyle = '#5c6167';
        ctx.beginPath(); ctx.roundRect(px + 2, py - h + 2, w * 0.62 - 4, h * 0.4, 2); ctx.fill();
        ctx.fillStyle = '#3c4147';
        ctx.beginPath(); ctx.roundRect(px + w * 0.66, py - h - 8, w * 0.3, h + 8, 3); ctx.fill();
        ctx.fillStyle = '#2f3338';
        ctx.beginPath(); ctx.roundRect(px + w * 0.7, py - h - 16, w * 0.2, 10, 2); ctx.fill();
        // бак
        ctx.fillStyle = m.out > 0 ? '#c24a2a' : '#7a4030';
        ctx.beginPath(); ctx.roundRect(px + 4, py - h * 0.5, w * 0.5, h * 0.42, 3); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.14)';
        ctx.fillRect(px + 4, py - h * 0.5, w * 0.5, 1.6);
        // манометр мигает, когда работает
        const on = m.fuel > 0;
        ctx.fillStyle = on ? '#8ad06a' : '#5a5f55';
        ctx.beginPath(); ctx.arc(px + w * 0.5, py - h * 0.78, 3, 0, 7); ctx.fill();
        if (on) {
          ctx.strokeStyle = 'rgba(240,200,120,0.5)'; ctx.lineWidth = 1;
          ctx.beginPath(); ctx.arc(px + w * 0.5, py - h * 0.78, 5 + Math.sin(m.anim * 6) * 1.5, 0, 7); ctx.stroke();
        }
        if ((m.out || 0) > 0) {
          ctx.fillStyle = '#e8cf72'; ctx.font = '600 7px system-ui';
          ctx.fillText('топливо ' + m.out, px, py - h - 20);
        }
      } else if (m.type === 'farm') {
        ctx.fillStyle = '#3f2d1e'; ctx.fillRect(px - 1, py - 3, w + 2, 5);
        ctx.fillStyle = '#5a4229';
        for (let i = 0; i < m.w; i++) ctx.fillRect(px + i * CELL, py - 5, CELL - 1, 3);
        if (m.seed) {
          const def = ITEMS[m.seed];
          const g = clamp(m.growth / def.grow, 0, 1);
          for (let i = 0; i < 3; i++) {
            const sx = px + 5 + i * (w - 10) / 2;
            const hh = 3 + g * 16;
            ctx.strokeStyle = g < 1 ? '#6f9a4a' : '#8aa845'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
            ctx.beginPath(); ctx.moveTo(sx, py - 4); ctx.lineTo(sx + Math.sin(m.anim + i) * 1.5, py - 4 - hh); ctx.stroke();
            if (g > 0.35) {
              ctx.fillStyle = '#7fa050';
              ctx.beginPath(); ctx.ellipse(sx - 3, py - 4 - hh * 0.6, 3.5 * g, 1.8 * g, 0.4, 0, 7); ctx.fill();
              ctx.beginPath(); ctx.ellipse(sx + 3, py - 4 - hh * 0.8, 3.5 * g, 1.8 * g, -0.4, 0, 7); ctx.fill();
            }
            if (g >= 1) {
              ctx.fillStyle = '#c8a25c';
              ctx.beginPath(); ctx.ellipse(sx, py - 6, 2.6, 2, 0, 0, 7); ctx.fill();
            }
          }
        }
      }
      ctx.restore();
    }
  }
};

  <script>
// ---- js/build.js ----
// build.js — строительство в духе Rust: строительный план, сетка, детали,
// тиры материалов (дерево → камень → металл), молоток для апгрейда и ремонта.
// Детали живут как объекты с прочностью, а в породу пишется только материал
// для столкновений — так дешевле и красивее, чем текстурить каждую частицу.
'use strict';

// Модуль сетки. 8 частиц = 64 px: человек ростом 54 px проходит в проём свободно.
// На 6 частицах (48 px) дверь была ниже игрока — в неё нельзя было влезть
const GRID = 8;

const TIERS = [
  {
    id: 'wood', name: 'Дерево', mat: () => M.BUILD_W, hp: 250,
    res: 'wood', k: 1,
    pal: { base: '#8a6238', dark: '#5c3f22', light: '#b58a55', line: 'rgba(40,26,16,0.45)' }
  },
  {
    id: 'stone', name: 'Камень', mat: () => M.BUILD_S, hp: 700,
    res: 'stone', k: 3,
    pal: { base: '#7c7f84', dark: '#55585d', light: '#a2a6ab', line: 'rgba(20,22,26,0.45)' }
  },
  {
    id: 'metal', name: 'Металл', mat: () => M.BUILD_M, hp: 1600,
    res: 'iron', k: 2,
    pal: { base: '#6e7378', dark: '#454a4f', light: '#9aa1a8', line: 'rgba(16,18,20,0.5)' }
  }
];

// части: w/h в частицах, base — цена в единицах ресурса тира
const PARTS = [
  { id: 'foundation', name: 'Фундамент', w: GRID, h: 2, base: 20, ground: true, desc: 'С него начинается дом. Ставится на землю.' },
  { id: 'floor', name: 'Пол', w: GRID, h: 2, base: 16, desc: 'Перекрытие. Держится на стене или фундаменте.' },
  { id: 'wall', name: 'Стена', w: 2, h: GRID, base: 16, desc: 'Вертикальная стена в полный рост.' },
  { id: 'doorway', name: 'Дверной проём', w: 2, h: GRID, base: 26, hole: 'door', desc: 'Стена с проходом. E — открыть и закрыть дверь.' },
  { id: 'window', name: 'Окно', w: 2, h: GRID, base: 22, hole: 'window', desc: 'Стена с бойницей: стрелять можно, зомби не пролезет.' },
  { id: 'roof', name: 'Крыша', w: GRID, h: 2, base: 18, roof: true, desc: 'Скат сверху. Держит радиацию и дождь.' },
  { id: 'stairs', name: 'Лестница', w: GRID, h: GRID, base: 28, stairs: true, desc: 'Подъём на этаж выше.' },
  { id: 'bed', name: 'Кровать', w: GRID, h: 2, base: 24, bed: true, pass: true, desc: 'Точка возрождения. E — спать до утра.' }
];

function partCost(part, tier) {
  const t = TIERS[tier];
  return { res: t.res, n: Math.round(part.base * t.k) };
}

const Structures = {
  list: [],
  index: new Map(),                  // 'gx,gy' → деталь, чтобы быстро искать

  key(gx, gy) { return gx + ',' + gy; },

  reset() { this.list.length = 0; this.index.clear(); },

  // привязка мировых координат к сетке: детали всегда сходятся ровно
  snap(part, wx, wy) {
    const cx = Math.floor(wx / CELL), cy = Math.floor(wy / CELL);
    let gx, gy;
    if (part.w >= GRID) {            // фундамент, пол, крыша, лестница
      gx = Math.floor(cx / GRID) * GRID;
      gy = part.h >= GRID ? Math.floor(cy / GRID) * GRID : Math.round(cy / 2) * 2;
    } else {                         // стены и проёмы стоят на рёбрах модуля
      gx = Math.round(cx / GRID) * GRID;
      gy = Math.floor(cy / GRID) * GRID;
    }
    return { gx, gy };
  },

  at(cx, cy) {
    for (const s of this.list) {
      if (cx >= s.gx && cx < s.gx + s.w && cy >= s.gy && cy < s.gy + s.h) return s;
    }
    return null;
  },

  nearest(px, py, r) {
    let best = null, bd = r;
    for (const s of this.list) {
      const d = dist(px, py, (s.gx + s.w / 2) * CELL, (s.gy + s.h / 2) * CELL);
      if (d < bd) { bd = d; best = s; }
    }
    return best;
  },

  // можно ли поставить: свободно, есть опора, зона разрешает
  canPlace(part, gx, gy) {
    for (let x = gx; x < gx + part.w; x++) {
      if (!canBuildAtCell(x)) return 'В самой локации строить нельзя';
      if (World.protectedAt(x)) return 'Город трогать нельзя';
    }
    for (let x = gx; x < gx + part.w; x++) {
      for (let y = gy; y < gy + part.h; y++) {
        const m = World.get(x, y);
        if (m !== M.AIR && MATS[m] && (MATS[m].struct || MATS[m].door)) return 'Здесь уже стоит деталь';
      }
    }
    if (Machines.boxBusy(gx, gy + part.h - 1, part.w, part.h)) return 'Мешает верстак или мебель';

    if (part.ground) {
      // фундамент требует земли под собой
      let ground = 0;
      for (let x = gx; x < gx + part.w; x++) if (World.solid(x, gy + part.h)) ground++;
      if (ground < part.w * 0.5) return 'Фундаменту нужна земля под низом';
      return null;
    }
    // остальное держится на другой детали или на породе рядом
    let support = false;
    for (let x = gx - 1; x <= gx + part.w && !support; x++) {
      for (let y = gy - 1; y <= gy + part.h && !support; y++) {
        if (x >= gx && x < gx + part.w && y >= gy && y < gy + part.h) continue;
        const m = World.get(x, y);
        if (m === M.AIR) continue;
        if (MATS[m].struct || MATS[m].solid) support = true;
      }
    }
    if (!support) return 'Деталь висит в воздухе — нужна опора';
    return null;
  },

  place(partId, gx, gy, tier, free) {
    const part = PARTS.find(p => p.id === partId);
    const err = this.canPlace(part, gx, gy);
    if (err) { Player.say(err); return false; }
    const cost = partCost(part, tier);
    if (!free && Player.inv.count(cost.res) < cost.n) {
      Player.say('Нужно ' + cost.n + ' ' + ITEMS[cost.res].name.toLowerCase());
      return false;
    }
    if (!free) Player.inv.remove(cost.res, cost.n);

    const s = {
      kind: partId, part, gx, gy, w: part.w, h: part.h,
      tier, hp: TIERS[tier].hp, maxHp: TIERS[tier].hp,
      open: false, t: 0
    };
    this.list.push(s);
    this.index.set(this.key(gx, gy), s);
    this.stamp(s);
    Particles.burst((gx + s.w / 2) * CELL, (gy + s.h / 2) * CELL, [160, 130, 90], 8);
    return true;
  },

  // записать деталь в породу: сплошняк, кроме проёмов
  stamp(s) {
    const mat = TIERS[s.tier].mat();
    for (let x = s.gx; x < s.gx + s.w; x++) {
      for (let y = s.gy; y < s.gy + s.h; y++) {
        World.set(x, y, this.cellOf(s, x, y) ? mat : M.AIR);
      }
    }
  },

  // сплошная ли частица детали (false — дырка проёма, скос лестницы, мебель)
  cellOf(s, x, y) {
    const lx = x - s.gx, ly = y - s.gy;
    if (s.part.pass) return false;                                  // мебель проходима насквозь
    if (s.part.hole === 'door') return s.open ? (ly < 1) : true;   // открытая дверь пропускает весь проём
    if (s.part.hole === 'window') return !(ly >= 3 && ly <= 5);
    if (s.part.stairs) return lx >= (s.h - 1 - ly);                // ступени по диагонали
    return true;
  },

  unstamp(s) {
    for (let x = s.gx; x < s.gx + s.w; x++) {
      for (let y = s.gy; y < s.gy + s.h; y++) World.set(x, y, M.AIR);
    }
  },

  remove(s) {
    this.unstamp(s);
    const i = this.list.indexOf(s);
    if (i >= 0) this.list.splice(i, 1);
    this.index.delete(this.key(s.gx, s.gy));
  },

  toggleDoor(s) {
    if (s.part.hole !== 'door') return;
    // не закрываемся на игроке
    if (s.open) {
      const px = Math.floor(Player.x / CELL);
      if (px >= s.gx - 1 && px <= s.gx + s.w && Math.abs(Player.y - (s.gy + s.h) * CELL) < 70) {
        Player.say('Ты стоишь в проёме'); return;
      }
    }
    s.open = !s.open;
    this.stamp(s);
    Player.say(s.open ? 'Дверь открыта' : 'Дверь закрыта');
  },

  damage(s, dmg) {
    s.hp -= dmg;
    Particles.burst((s.gx + s.w / 2) * CELL, (s.gy + s.h / 2) * CELL, [140, 120, 100], 4);
    if (s.hp <= 0) {
      // при разрушении возвращается половина материала
      const cost = partCost(s.part, s.tier);
      Drops.add((s.gx + s.w / 2) * CELL, (s.gy + s.h / 2) * CELL, cost.res, Math.max(1, Math.round(cost.n * 0.5)));
      this.remove(s);
      Player.say(s.part.name + ' разрушен');
      return true;
    }
    return false;
  },

  upgrade(s) {
    if (s.tier >= TIERS.length - 1) { Player.say('Дальше улучшать некуда — это металл'); return false; }
    const next = s.tier + 1;
    const cost = partCost(s.part, next);
    if (Player.inv.count(cost.res) < cost.n) {
      Player.say('Нужно ' + cost.n + ' ' + ITEMS[cost.res].name.toLowerCase());
      return false;
    }
    Player.inv.remove(cost.res, cost.n);
    const frac = s.hp / s.maxHp;
    s.tier = next;
    s.maxHp = TIERS[next].hp;
    s.hp = Math.max(1, Math.round(s.maxHp * frac));
    this.stamp(s);
    Particles.spark((s.gx + s.w / 2) * CELL, (s.gy + s.h / 2) * CELL);
    Player.say(s.part.name + ' → ' + TIERS[next].name);
    return true;
  },

  repair(s) {
    if (s.hp >= s.maxHp) { Player.say('Деталь целая'); return false; }
    const cost = partCost(s.part, s.tier);
    const need = Math.max(1, Math.round(cost.n * 0.25));
    if (Player.inv.count(cost.res) < need) { Player.say('Нужно ' + need + ' ' + ITEMS[cost.res].name.toLowerCase()); return false; }
    Player.inv.remove(cost.res, need);
    s.hp = Math.min(s.maxHp, s.hp + s.maxHp * 0.35);
    Particles.spark((s.gx + s.w / 2) * CELL, (s.gy + s.h / 2) * CELL);
    Player.say('Починил: ' + Math.round(s.hp) + '/' + s.maxHp);
    return true;
  },

  bed() { return this.list.find(s => s.part.bed); },

  update(dt) { for (const s of this.list) s.t += dt; },

  // ---- отрисовка ----
  draw(ctx) {
    for (const s of this.list) this.drawPart(ctx, s, 1);
  },

  drawPart(ctx, s, alpha) {
    const p = TIERS[s.tier].pal;
    const x0 = s.gx * CELL, y0 = s.gy * CELL;
    const w = s.w * CELL, h = s.h * CELL;
    ctx.save();
    ctx.globalAlpha = alpha;

    if (s.part.bed) {
      const p2 = TIERS[s.tier].pal;
      // рама
      ctx.fillStyle = p2.dark;
      ctx.beginPath(); ctx.roundRect(x0, y0 + h - 5, w, 5, 1.5); ctx.fill();
      ctx.fillStyle = shade(p2.dark, 0.8);
      ctx.fillRect(x0 + 1, y0 + h, 3.5, 4);
      ctx.fillRect(x0 + w - 4.5, y0 + h, 3.5, 4);
      // спинки
      ctx.fillStyle = p2.base;
      ctx.beginPath(); ctx.roundRect(x0 - 1, y0 - 6, 4, h + 1, 1.5); ctx.fill();
      ctx.beginPath(); ctx.roundRect(x0 + w - 3, y0 - 2, 4, h - 3, 1.5); ctx.fill();
      // матрас
      const mg = ctx.createLinearGradient(x0, y0, x0, y0 + h - 4);
      mg.addColorStop(0, '#9d8b78'); mg.addColorStop(1, '#6d5f52');
      ctx.fillStyle = mg;
      ctx.beginPath(); ctx.roundRect(x0 + 2, y0, w - 5, h - 4, 2.5); ctx.fill();
      // одеяло и подушка
      ctx.fillStyle = '#8a4a3c';
      ctx.beginPath(); ctx.roundRect(x0 + w * 0.36, y0 - 1, w * 0.6, h - 3, 2.5); ctx.fill();
      ctx.fillStyle = 'rgba(255,255,255,0.14)';
      ctx.fillRect(x0 + w * 0.36, y0 - 1, w * 0.6, 1.4);
      ctx.fillStyle = '#d5cfbc';
      ctx.beginPath(); ctx.roundRect(x0 + 3, y0 - 2.5, w * 0.26, h - 3, 2.5); ctx.fill();
      ctx.fillStyle = 'rgba(0,0,0,0.12)';
      ctx.fillRect(x0 + 3, y0 + h - 6, w * 0.26, 1.2);
      this.hpBar(ctx, s, x0, y0, w);
      ctx.restore(); return;
    }

    if (s.part.stairs) {
      // ступени: рисуем каждую проступь
      const n = s.h / 2;
      for (let i = 0; i < n; i++) {
        const sw = w * (i + 1) / n;
        const sy = y0 + h - (i + 1) * (h / n);
        this.slab(ctx, x0 + w - sw, sy, sw, h / n, p, s.tier);
      }
      ctx.restore(); return;
    }

    if (s.part.hole === 'door') {
      // рама и полотно
      this.slab(ctx, x0, y0, w, CELL * 1, p, s.tier);
      const openW = s.open ? w * 0.25 : w;
      const dh = h - CELL;
      const g = ctx.createLinearGradient(x0, 0, x0 + openW, 0);
      g.addColorStop(0, p.dark); g.addColorStop(0.5, p.base); g.addColorStop(1, p.dark);
      ctx.fillStyle = g;
      ctx.fillRect(x0, y0 + CELL, openW, dh);
      ctx.fillStyle = p.line;
      for (let i = 1; i < 4; i++) ctx.fillRect(x0, y0 + CELL + dh * i / 4, openW, 1.2);
      ctx.fillStyle = 'rgba(255,240,210,0.10)';
      for (let i = 1; i < 4; i++) ctx.fillRect(x0, y0 + CELL + dh * i / 4 + 1.2, openW, 0.8);
      // петли и ручка
      ctx.fillStyle = '#4a4d52';
      ctx.fillRect(x0 - 1, y0 + CELL + 4, 3, 4);
      ctx.fillRect(x0 - 1, y0 + dh - 2, 3, 4);
      if (!s.open) { ctx.fillStyle = '#c9a94a'; ctx.beginPath(); ctx.arc(x0 + w - 3.5, y0 + CELL + dh * 0.5, 1.8, 0, 7); ctx.fill(); }
      this.hpBar(ctx, s, x0, y0, w);
      ctx.restore(); return;
    }

    if (s.part.hole === 'window') {
      this.slab(ctx, x0, y0, w, CELL * 3, p, s.tier);
      this.slab(ctx, x0, y0 + CELL * 6, w, h - CELL * 6, p, s.tier);
      // рама бойницы
      ctx.strokeStyle = p.dark; ctx.lineWidth = 1.4;
      ctx.strokeRect(x0 + 0.5, y0 + CELL * 3 + 0.5, w - 1, CELL * 3 - 1);
      ctx.fillStyle = 'rgba(120,150,160,0.14)';
      ctx.fillRect(x0 + 1, y0 + CELL * 3 + 1, w - 2, CELL * 3 - 2);
      this.hpBar(ctx, s, x0, y0, w);
      ctx.restore(); return;
    }

    if (s.part.roof) {
      // скат с нахлёстом
      const rows = 2;
      for (let r = 0; r < rows; r++) {
        const ry = y0 + r * (h / rows);
        for (let i = 0; i < s.w; i++) {
          const tx = x0 + i * CELL + (r ? CELL * 0.5 : 0);
          const g = ctx.createLinearGradient(tx, ry, tx, ry + h / rows);
          g.addColorStop(0, p.light); g.addColorStop(1, p.dark);
          ctx.fillStyle = g;
          ctx.beginPath(); ctx.roundRect(tx, ry, CELL * 0.92, h / rows * 0.95, [0, 0, 2, 2]); ctx.fill();
          ctx.strokeStyle = p.line; ctx.lineWidth = 0.7;
          ctx.beginPath(); ctx.roundRect(tx, ry, CELL * 0.92, h / rows * 0.95, [0, 0, 2, 2]); ctx.stroke();
        }
      }
      this.hpBar(ctx, s, x0, y0, w);
      ctx.restore(); return;
    }

    // фундамент, пол, стена
    this.slab(ctx, x0, y0, w, h, p, s.tier, s.part.id);
    this.hpBar(ctx, s, x0, y0, w);
    ctx.restore();
  },

  // общая «плита» с фактурой тира
  slab(ctx, x, y, w, h, p, tier, kind) {
    const g = ctx.createLinearGradient(x, y, x, y + h);
    g.addColorStop(0, p.light); g.addColorStop(0.35, p.base); g.addColorStop(1, p.dark);
    ctx.fillStyle = g;
    ctx.fillRect(x, y, w, h);

    if (tier === 0) {
      // доски: вдоль длинной стороны
      ctx.fillStyle = p.line;
      if (w >= h) { for (let i = 1; i < Math.round(h / 8) + 1; i++) ctx.fillRect(x, y + i * 8 - 1, w, 1.2); }
      else { for (let i = 1; i < Math.round(w / 8) + 1; i++) ctx.fillRect(x + i * 8 - 1, y, 1.2, h); }
      ctx.fillStyle = 'rgba(255,240,210,0.10)';
      if (w >= h) { for (let i = 1; i < Math.round(h / 8) + 1; i++) ctx.fillRect(x, y + i * 8, w, 0.8); }
      else { for (let i = 1; i < Math.round(w / 8) + 1; i++) ctx.fillRect(x + i * 8, y, 0.8, h); }
      // гвозди по краям
      ctx.fillStyle = 'rgba(70,72,76,0.8)';
      ctx.fillRect(x + 2, y + 2, 1.4, 1.4);
      ctx.fillRect(x + w - 3.4, y + 2, 1.4, 1.4);
    } else if (tier === 1) {
      // каменная кладка со швами вразбежку
      const bw = 12, bh = 8;
      ctx.strokeStyle = p.line; ctx.lineWidth = 1;
      for (let ry = 0; ry < h; ry += bh) {
        const off = ((ry / bh) % 2) * bw * 0.5;
        for (let rx = -bw; rx < w; rx += bw) {
          ctx.strokeRect(x + rx + off + 0.5, y + ry + 0.5, bw - 1, bh - 1);
        }
        ctx.fillStyle = 'rgba(255,255,255,0.05)';
        ctx.fillRect(x, y + ry, w, 1);
      }
    } else {
      // металл: гофра и заклёпки
      for (let i = 0; i < w; i += 10) {
        const gg = ctx.createLinearGradient(x + i, 0, x + i + 10, 0);
        gg.addColorStop(0, 'rgba(0,0,0,0.18)');
        gg.addColorStop(0.45, 'rgba(255,255,255,0.12)');
        gg.addColorStop(1, 'rgba(0,0,0,0.18)');
        ctx.fillStyle = gg; ctx.fillRect(x + i, y, 10, h);
      }
      ctx.fillStyle = 'rgba(30,32,34,0.8)';
      for (let rx = 4; rx < w - 2; rx += 14) {
        ctx.beginPath(); ctx.arc(x + rx, y + 3, 1.3, 0, 7); ctx.fill();
        ctx.beginPath(); ctx.arc(x + rx, y + h - 3, 1.3, 0, 7); ctx.fill();
      }
    }
    // кромки: сверху светлее, снизу темнее — объём
    ctx.fillStyle = 'rgba(255,248,226,0.16)'; ctx.fillRect(x, y, w, 1.4);
    ctx.fillStyle = 'rgba(0,0,0,0.24)'; ctx.fillRect(x, y + h - 1.6, w, 1.6);
    ctx.strokeStyle = 'rgba(0,0,0,0.28)'; ctx.lineWidth = 1;
    ctx.strokeRect(x + 0.5, y + 0.5, w - 1, h - 1);
  },

  hpBar(ctx, s, x, y, w) {
    if (s.hp >= s.maxHp) return;
    const f = clamp(s.hp / s.maxHp, 0, 1);
    ctx.fillStyle = 'rgba(0,0,0,0.6)'; ctx.fillRect(x, y - 4, w, 2.4);
    ctx.fillStyle = f > 0.5 ? '#6aa86a' : f > 0.25 ? '#d0a038' : '#c04a3a';
    ctx.fillRect(x, y - 4, w * f, 2.4);
  },

  // ---- призрак под курсором ----
  drawGhost(ctx, partId, tier) {
    const part = PARTS.find(p => p.id === partId);
    const { gx, gy } = this.snap(part, Input.wx, Input.wy);
    const err = this.canPlace(part, gx, gy);
    const cost = partCost(part, tier);
    const enough = Player.inv.count(cost.res) >= cost.n;
    const ok = !err && enough;

    ctx.save();
    ctx.globalAlpha = 0.55;
    this.drawPart(ctx, { kind: partId, part, gx, gy, w: part.w, h: part.h, tier, hp: 1, maxHp: 1, open: false, t: 0 }, 0.5);
    ctx.restore();

    const x0 = gx * CELL, y0 = gy * CELL, w = part.w * CELL, h = part.h * CELL;
    ctx.save();
    ctx.strokeStyle = ok ? 'rgba(120,220,140,0.95)' : 'rgba(230,90,70,0.95)';
    ctx.lineWidth = 1.4;
    ctx.setLineDash([5, 4]);
    ctx.strokeRect(x0 + 0.5, y0 + 0.5, w - 1, h - 1);
    ctx.setLineDash([]);
    ctx.fillStyle = ok ? 'rgba(120,220,140,0.12)' : 'rgba(230,90,70,0.16)';
    ctx.fillRect(x0, y0, w, h);
    ctx.restore();
    return { gx, gy, ok, err: err || (!enough ? 'Не хватает материала' : null), cost };
  }
};


// ---- ноды руды: валуны на поверхности, как в Rust ----
const NODE_KINDS = {
  metal: { name: 'Металлическая нода', res: 'iron_ore', hits: 8, col: ['#7a6a58', '#a2865c'], spark: '#c88a4a' },
  sulfur: { name: 'Серная нода', res: 'sulfur_ore', hits: 8, col: ['#7a7440', '#c0b048'], spark: '#e0d060' },
  stone: { name: 'Каменная нода', res: 'stone', hits: 6, col: ['#6f7378', '#9aa0a6'], spark: '#c0c6cc' },
  hqm: { name: 'Нода HQM', res: 'hqm_ore', hits: 14, col: ['#4e5a66', '#8fa6bc'], spark: '#c2d6e8' }
};

const Nodes = {
  list: [],

  seed() {
    this.list.length = 0;
    const rand = mulberry32(20260805);
    for (const z of ZONES.concat([{ id: 'gap', x0: 0, x1: WW - 1 }])) {
      if (z.id === 'city') continue;
      const density = z.id === 'mine' ? 26 : z.id === 'gap' ? 190 : 90;
      for (let x = z.x0 + 10; x < z.x1 - 10; x += density + Math.floor(rand() * 40)) {
        if (zoneAtCell(x).id === 'city') continue;
        let kind = 'stone';
        const r = rand();
        if (z.id === 'mine') kind = r < 0.42 ? 'metal' : r < 0.68 ? 'sulfur' : r < 0.78 ? 'hqm' : 'stone';
        else kind = r < 0.3 ? 'metal' : r < 0.5 ? 'sulfur' : r < 0.55 ? 'hqm' : 'stone';
        this.list.push({ kind, x, y: World.surface[x], left: NODE_KINDS[kind].hits, max: NODE_KINDS[kind].hits, t: rand() * 6, respawn: 0 });
      }
    }
  },

  at(px, py, r) {
    for (const n of this.list) {
      if (n.respawn > 0) continue;
      if (dist(px, py, n.x * CELL + 8, n.y * CELL - 8) < (r || 26)) return n;
    }
    return null;
  },

  // удар киркой: ресурс капает с каждого удара, нода тратится и потом восстанавливается
  hit(n, power) {
    const k = NODE_KINDS[n.kind];
    const yield_ = Math.max(1, Math.round(power * 0.6));
    Player.inv.add(k.res, yield_);
    Floaters.push(n.x * CELL + 8, n.y * CELL - 18, '+' + yield_ + ' ' + ITEMS[k.res].name.toLowerCase(), '#e0c88a');
    Particles.burst(n.x * CELL + 8, n.y * CELL - 8, [150, 130, 100], 5);
    Particles.spark(n.x * CELL + 8, n.y * CELL - 10);
    n.left--;
    if (n.left <= 0) {
      n.respawn = 150;                       // через 2.5 минуты вырастет заново
      Player.say(k.name + ' выработана');
    }
  },

  update(dt) {
    for (const n of this.list) {
      n.t += dt;
      if (n.respawn > 0) {
        n.respawn -= dt;
        if (n.respawn <= 0) n.left = n.max;
      }
    }
  },

  draw(ctx) {
    for (const n of this.list) {
      if (n.respawn > 0) continue;
      const k = NODE_KINDS[n.kind];
      const px = n.x * CELL + 8, py = n.y * CELL;
      const worn = n.left / n.max;
      const r = 9 + worn * 7;
      // валун
      const g = ctx.createRadialGradient(px - r * 0.3, py - r * 1.1, r * 0.2, px, py - r * 0.6, r * 1.5);
      g.addColorStop(0, k.col[1]); g.addColorStop(1, k.col[0]);
      ctx.fillStyle = g;
      ctx.beginPath();
      ctx.moveTo(px - r, py);
      ctx.quadraticCurveTo(px - r * 1.05, py - r * 0.9, px - r * 0.4, py - r * 1.25);
      ctx.quadraticCurveTo(px + r * 0.2, py - r * 1.5, px + r * 0.75, py - r * 1.05);
      ctx.quadraticCurveTo(px + r * 1.15, py - r * 0.5, px + r, py);
      ctx.closePath(); ctx.fill();
      // жила: блики цвета ресурса
      ctx.fillStyle = k.spark;
      for (let i = 0; i < 4; i++) {
        const h = hash2(n.x * 7 + i, n.y * 13 - i);
        ctx.globalAlpha = 0.85;
        ctx.beginPath();
        ctx.ellipse(px + (h - 0.5) * r * 1.2, py - r * (0.3 + h * 0.8), r * 0.16, r * 0.11, h * 3, 0, 7);
        ctx.fill();
      }
      ctx.globalAlpha = 1;
      // тень под валуном
      ctx.fillStyle = 'rgba(0,0,0,0.3)';
      ctx.beginPath(); ctx.ellipse(px, py + 1, r * 0.9, r * 0.2, 0, 0, 7); ctx.fill();
      // сколько осталось
      if (worn < 1) {
        ctx.fillStyle = 'rgba(0,0,0,0.55)'; ctx.fillRect(px - r, py - r * 1.8, r * 2, 2);
        ctx.fillStyle = k.spark; ctx.fillRect(px - r, py - r * 1.8, r * 2 * worn, 2);
      }
    }
  }
};

<script>
// ---- js/boom.js ----
// boom.js — взрывчатка: гранаты и C4. Летят по дуге, взрываются по таймеру,
// выжигают кратер в породе, рвут зомби и постройки. Всё крафтится, не премиум.
'use strict';

const Explosions = {
  list: [],

  // Кратер: круг с рваным краем, чтобы не выглядел циркулем.
  // Город и локации не трогаем — там порода защищена
  carve(cx, cy, radius) {
    const drops = {};
    const r2 = radius * radius;
    for (let dy = -radius - 2; dy <= radius + 2; dy++) {
      for (let dx = -radius - 2; dx <= radius + 2; dx++) {
        const x = cx + dx, y = cy + dy;
        if (!World.inside(x, y) || World.protectedAt(x)) continue;
        // рваная кромка: радиус гуляет по углу
        const wob = 1 + (hash2(x * 3, y * 5) - 0.5) * 0.5;
        if (dx * dx + dy * dy > r2 * wob) continue;
        const m = World.get(x, y);
        if (m === M.AIR) continue;
        const mi = MATS[m];
        if (mi.struct !== undefined || mi.door) continue;      // постройки ломаются отдельно
        if (mi.drop && Math.random() < 0.15) drops[mi.drop] = (drops[mi.drop] || 0) + 1;
        World.set(x, y, M.AIR);
      }
    }
    // обугленная кромка кратера
    for (let dy = -radius - 3; dy <= radius + 3; dy++) {
      for (let dx = -radius - 3; dx <= radius + 3; dx++) {
        const x = cx + dx, y = cy + dy;
        const d = Math.hypot(dx, dy);
        if (d < radius || d > radius + 2.2) continue;
        if (!World.inside(x, y) || World.protectedAt(x)) continue;
        const m = World.get(x, y);
        if (m !== M.AIR && MATS[m].solid && MATS[m].struct === undefined && Math.random() < 0.5) World.set(x, y, M.ASH);
      }
    }
    return drops;
  },

  // Один взрыв: кратер, урон всему вокруг, вспышка и звуковая волна из частиц
  blast(x, y, opt) {
    const radiusCells = opt.crater || 0;
    const dmgR = opt.r || 90;
    const dmg = opt.dmg || 120;

    if (radiusCells > 0) {
      const drops = this.carve(Math.floor(x / CELL), Math.floor(y / CELL), radiusCells);
      for (const id in drops) Drops.add(x + rnd(-20, 20), y - 10, id, Math.max(1, Math.round(drops[id] * 0.4)));
    }

    // постройки
    for (const s of Structures.list.slice()) {
      const d = dist(x, y, (s.gx + s.w / 2) * CELL, (s.gy + s.h / 2) * CELL);
      if (d < dmgR * 1.2) Structures.damage(s, dmg * (1 - d / (dmgR * 1.2)) * 1.6);
    }
    // зомби
    for (const z of Zombies.list) {
      if (z.hp <= 0) continue;
      const d = dist(x, y, z.x, z.y - 22);
      if (d < dmgR) {
        z.hp -= dmg * (1 - d / dmgR);
        z.vx += Math.sign(z.x - x) * 4;
        z.vy = -3;
        for (let i = 0; i < 8; i++) Particles.blood(z.x, z.y - 20);
      }
    }
    // игрок — своя же взрывчатка бьёт больно
    const dp = dist(x, y, Player.x, Player.y - 26);
    if (dp < dmgR && !Player.dead) {
      const k = 1 - dp / dmgR;
      Player.hp -= dmg * k * 0.55;
      Player.vy = -4 * k;
      Player.vx += Math.sign(Player.x - x) * 5 * k;
      if (k > 0.4) Player.wound(pick(['legL', 'legR', 'armL', 'armR', 'torso']), k > 0.75 ? 3 : 2);
      Player.say('Тебя задело взрывом');
    }

    // картинка взрыва
    this.list.push({ x, y, t: 0, life: 0.75, r: dmgR });
    for (let i = 0; i < 46; i++) {
      const a = Math.random() * Math.PI * 2, sp = rnd(1.5, 7);
      Particles.list.push({
        x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 1.2, g: 0.12,
        life: rnd(0.3, 0.9), t: 0, s: rnd(2, 6),
        col: i < 16 ? '#fff0b0' : i < 30 ? '#f09040' : '#6a6a6a', glow: i < 30
      });
    }
    for (let i = 0; i < 16; i++) Particles.smoke(x + rnd(-24, 24), y + rnd(-16, 8), 'rgba(70,66,62,0.5)');
    Game.shake = Math.min(16, 6 + dmgR / 14);
  },

  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const e = this.list[i];
      e.t += dt;
      if (e.t > e.life) this.list.splice(i, 1);
    }
  },

  draw(ctx) {
    for (const e of this.list) {
      const k = e.t / e.life;
      const r = e.r * (0.3 + k * 0.9);
      ctx.save();
      ctx.globalCompositeOperation = 'lighter';
      ctx.globalAlpha = (1 - k) * 0.9;
      const g = ctx.createRadialGradient(e.x, e.y, 0, e.x, e.y, r);
      g.addColorStop(0, 'rgba(255,248,210,0.95)');
      g.addColorStop(0.35, 'rgba(250,170,70,0.7)');
      g.addColorStop(1, 'rgba(120,40,20,0)');
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(e.x, e.y, r, 0, 7); ctx.fill();
      ctx.restore();
      // ударная волна
      ctx.strokeStyle = 'rgba(255,230,190,' + (1 - k) * 0.35 + ')';
      ctx.lineWidth = 2 - k * 1.6;
      ctx.beginPath(); ctx.arc(e.x, e.y, r * 1.15, 0, 7); ctx.stroke();
    }
  },

  // свет от вспышки, чтобы ночью взрыв освещал округу
  lights() {
    return this.list.map(e => ({ x: e.x, y: e.y, r: e.r * 2.2 * (1 - e.t / e.life), i: 1 }));
  }
};

// ---- брошенная взрывчатка ----
const Throwables = {
  list: [],

  throwIt(kind, fromX, fromY, angle, power) {
    const def = ITEMS[kind];
    this.list.push({
      kind, x: fromX, y: fromY,
      vx: Math.cos(angle) * power, vy: Math.sin(angle) * power,
      fuse: def.fuse, t: 0, spin: 0, stuck: false
    });
  },

  update(dt) {
    for (let i = this.list.length - 1; i >= 0; i--) {
      const b = this.list[i];
      b.t += dt;
      b.spin += (Math.abs(b.vx) + Math.abs(b.vy)) * dt * 0.6;

      if (!b.stuck) {
        b.vy += GRAV * 0.85;
        const nx = b.x + b.vx, ny = b.y + b.vy;
        const solidX = World.solid(Math.floor(nx / CELL), Math.floor(b.y / CELL));
        const solidY = World.solid(Math.floor(b.x / CELL), Math.floor(ny / CELL));
        const def = ITEMS[b.kind];
        if (solidY) {
          if (def.sticky) { b.stuck = true; b.vx = 0; b.vy = 0; }     // C4 прилипает
          else { b.vy *= -0.32; b.vx *= 0.6; if (Math.abs(b.vy) < 0.6) b.vy = 0; }
        } else b.y = ny;
        if (solidX) { if (def.sticky) { b.stuck = true; b.vx = 0; } else b.vx *= -0.4; }
        else b.x = nx;
      }

      if (b.t >= b.fuse) {
        const def = ITEMS[b.kind];
        Explosions.blast(b.x, b.y, { r: def.blastR, dmg: def.blastDmg, crater: def.crater });
        this.list.splice(i, 1);
      }
    }
  },

  draw(ctx) {
    for (const b of this.list) {
      const def = ITEMS[b.kind];
      const left = b.fuse - b.t;
      ctx.save();
      ctx.translate(b.x, b.y);
      ctx.rotate(b.spin);
      if (b.kind === 'c4') {
        ctx.fillStyle = '#c9bfa2';
        ctx.beginPath(); ctx.roundRect(-6, -4, 12, 8, 1.5); ctx.fill();
        ctx.fillStyle = '#8a7c5c'; ctx.fillRect(-6, -1, 12, 2);
        ctx.fillStyle = '#c04a3a'; ctx.fillRect(2, -6.5, 3, 3);
        ctx.strokeStyle = '#3a3f45'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(3.5, -6.5); ctx.lineTo(6, -9); ctx.stroke();
      } else {
        ctx.fillStyle = '#4a5240';
        ctx.beginPath(); ctx.ellipse(0, 0, 4.4, 5.4, 0, 0, 7); ctx.fill();
        ctx.strokeStyle = 'rgba(20,24,18,0.6)'; ctx.lineWidth = 0.8;
        for (let i = -1; i <= 1; i++) { ctx.beginPath(); ctx.moveTo(-4, i * 2.4); ctx.lineTo(4, i * 2.4); ctx.stroke(); }
        ctx.fillStyle = '#6d7364'; ctx.fillRect(-1.6, -7, 3.2, 2.4);
      }
      ctx.restore();
      // мигающий огонёк запала — чем ближе, тем чаще
      const blink = Math.sin(b.t * (8 + (1 / Math.max(0.2, left)) * 6)) > 0;
      if (blink) {
        ctx.fillStyle = '#ff6a3a';
        ctx.beginPath(); ctx.arc(b.x + 3, b.y - 6, 1.8, 0, 7); ctx.fill();
      }
      Particles.smoke(b.x, b.y - 6, 'rgba(200,200,200,0.25)');
    }
  },

  lights() {
    return this.list.map(b => ({ x: b.x, y: b.y - 6, r: 70, i: 0.5 }));
  }
};

</script>
<script>
// ---- js/ui.js ----
// ui.js — меню, кастомизация, HUD, инвентарь, тело, крафт
'use strict';

const UI = {
  screen: 'menu',        // menu | custom | null | inv | craft | body | options | dead | intro
  held: null,            // предмет «в руке» при перетаскивании
  hot: [],               // зоны кликов текущего кадра
  tab: 'inv',
  guard: 0,              // пауза на клики после смены экрана
  pickedZone: null,
  W: 1280, H: 720,

  // ---- примитивы ----
  panel(g, x, y, w, h, title) {
    g.fillStyle = 'rgba(14,15,17,0.92)';
    g.beginPath(); g.roundRect(x, y, w, h, 10); g.fill();
    g.strokeStyle = 'rgba(190,180,150,0.22)'; g.lineWidth = 1;
    g.beginPath(); g.roundRect(x + 0.5, y + 0.5, w - 1, h - 1, 10); g.stroke();
    if (title) {
      g.fillStyle = '#cdc6ae'; g.font = '600 15px system-ui, sans-serif';
      g.fillText(title, x + 16, y + 26);
      g.fillStyle = 'rgba(190,180,150,0.16)'; g.fillRect(x + 14, y + 34, w - 28, 1);
    }
  },
  btn(g, x, y, w, h, label, active, danger) {
    // guard — короткая пауза после открытия экрана, чтобы клик «сквозь» не срабатывал
    const over = this.guard <= 0 && Input.mx > x && Input.mx < x + w && Input.my > y && Input.my < y + h;
    g.fillStyle = active ? 'rgba(150,138,90,0.30)' : over ? 'rgba(210,200,170,0.16)' : 'rgba(255,255,255,0.06)';
    g.beginPath(); g.roundRect(x, y, w, h, 7); g.fill();
    g.strokeStyle = danger ? 'rgba(190,70,60,0.7)' : over ? 'rgba(220,210,180,0.55)' : 'rgba(190,180,150,0.25)';
    g.lineWidth = 1; g.beginPath(); g.roundRect(x + 0.5, y + 0.5, w - 1, h - 1, 7); g.stroke();
    g.fillStyle = danger ? '#e0a09a' : over ? '#f2ecd8' : '#c9c2ac';
    g.font = '600 13px system-ui, sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
    g.fillText(label, x + w / 2, y + h / 2 + 1);
    g.textAlign = 'left'; g.textBaseline = 'alphabetic';
    return over && Input.mclick;
  },
  text(g, t, x, y, col, size, weight, align) {
    g.fillStyle = col || '#c9c2ac';
    g.font = (weight || '400') + ' ' + (size || 13) + 'px system-ui, sans-serif';
    g.textAlign = align || 'left';
    g.fillText(t, x, y);
    g.textAlign = 'left';
  },
  bar(g, x, y, w, h, v, col, label, icon, max) {
    const m = max || 100;
    g.fillStyle = 'rgba(0,0,0,0.55)';
    g.beginPath(); g.roundRect(x, y, w, h, h / 2); g.fill();
    const gr = g.createLinearGradient(x, y, x + w, y);
    gr.addColorStop(0, col[0]); gr.addColorStop(1, col[1]);
    g.fillStyle = gr;
    g.beginPath(); g.roundRect(x + 1, y + 1, Math.max(0, (w - 2) * clamp(v / m, 0, 1)), h - 2, (h - 2) / 2); g.fill();
    // деления на длинной шкале, чтобы 300 читались
    if (m > 100) {
      g.fillStyle = 'rgba(0,0,0,0.35)';
      for (let i = 1; i < 3; i++) g.fillRect(x + w * i / 3, y + 2, 1, h - 4);
    }
    g.strokeStyle = 'rgba(255,255,255,0.14)'; g.lineWidth = 1;
    g.beginPath(); g.roundRect(x + 0.5, y + 0.5, w - 1, h - 1, h / 2); g.stroke();
    if (label) this.text(g, label, x + w + 8, y + h - 2, 'rgba(220,214,196,0.8)', 11, '600');
    if (icon) this.text(g, icon, x - 16, y + h - 2, 'rgba(220,214,196,0.9)', 12, '700');
  },

  slotBox(g, x, y, s, slot, sel, dim) {
    g.fillStyle = sel ? 'rgba(170,152,96,0.24)' : 'rgba(255,255,255,0.05)';
    g.beginPath(); g.roundRect(x, y, s, s, 6); g.fill();
    g.strokeStyle = sel ? 'rgba(230,210,140,0.75)' : 'rgba(190,180,150,0.22)';
    g.lineWidth = sel ? 1.6 : 1;
    g.beginPath(); g.roundRect(x + 0.5, y + 0.5, s - 1, s - 1, 6); g.stroke();
    if (slot) {
      g.save(); g.translate(x + s * 0.1, y + s * 0.1);
      if (dim) g.globalAlpha = 0.4;
      ITEMS[slot.id].icon(g, s * 0.8);
      g.restore();
      if (slot.n > 1) {
        this.text(g, String(slot.n), x + s - 4, y + s - 5, '#f0ead6', 11, '700', 'right');
      }
    }
  },

  // ---- главное меню ----
  drawMenu(g) {
    const W = this.W, H = this.H;
    const gr = g.createLinearGradient(0, 0, 0, H);
    gr.addColorStop(0, '#20242a'); gr.addColorStop(0.55, '#3a3428'); gr.addColorStop(1, '#17171a');
    g.fillStyle = gr; g.fillRect(0, 0, W, H);
    // силуэт разрушенного города
    g.fillStyle = 'rgba(10,11,13,0.75)';
    const rand = mulberry32(4242);
    let x = 0;
    while (x < W) {
      const w = 30 + rand() * 70, h = 60 + rand() * 260;
      g.fillRect(x, H - 150 - h, w, h + 150);
      if (rand() < 0.35) g.fillRect(x + w * 0.3, H - 150 - h - 40, 6, 40);
      x += w + rand() * 26;
    }
    g.fillStyle = 'rgba(200,170,110,0.06)';
    g.beginPath(); g.arc(W * 0.72, H * 0.26, 220, 0, 7); g.fill();

    this.text(g, 'КРАСНАЯ КНОПКА', W / 2, 190, '#e8dfc4', 62, '800', 'center');
    this.text(g, 'выживание после того, как её нажали', W / 2, 228, 'rgba(210,200,170,0.6)', 15, '500', 'center');
    this.text(g, 'прототип · вид сбоку · ' + WW + '×' + WH + ' частиц', W / 2, H - 40, 'rgba(200,190,160,0.35)', 12, '400', 'center');

    const bx = W / 2 - 130;
    if (this.btn(g, bx, 300, 260, 46, 'Новая игра')) { this.screen = 'custom'; }
    if (this.btn(g, bx, 356, 260, 46, 'Управление')) { this.screen = 'options'; this.fromMenu = true; }
    this.text(g, 'WASD — идти · ЛКМ — копать/стрелять · ПКМ или Q — применить · E — взять · I — инвентарь · B — тело · C — крафт',
      W / 2, 470, 'rgba(200,190,160,0.45)', 12, '400', 'center');
  },

  // ---- кастомизация ----
  drawCustom(g) {
    const W = this.W, H = this.H;
    g.fillStyle = '#1b1c1f'; g.fillRect(0, 0, W, H);
    this.panel(g, W / 2 - 380, 70, 760, 580, 'Кто ты был до войны');

    const a = Player.look;
    // превью
    g.save();
    g.translate(W / 2 - 210, 470);
    g.scale(3.4, 3.4);
    g.fillStyle = 'rgba(0,0,0,0.35)';
    g.beginPath(); g.ellipse(0, 2, 14, 3, 0, 0, 7); g.fill();
    drawHuman(g, 0, 0, a, { face: 1, phase: performance.now() / 220, moving: true, mask: this.previewMask });
    g.restore();

    const x0 = W / 2 + 20, bw = 300;
    let y = 130;
    this.text(g, 'Тон кожи', x0, y, '#a89e84', 12, '600'); y += 12;
    for (let i = 0; i < SKINS.length; i++) {
      const bx = x0 + i * 44;
      g.fillStyle = SKINS[i];
      g.beginPath(); g.roundRect(bx, y, 36, 30, 6); g.fill();
      if (a.skin === i) { g.strokeStyle = '#e8dfc4'; g.lineWidth = 2; g.beginPath(); g.roundRect(bx, y, 36, 30, 6); g.stroke(); }
      if (Input.mclick && Input.mx > bx && Input.mx < bx + 36 && Input.my > y && Input.my < y + 30) a.skin = i;
    }
    y += 54;
    this.text(g, 'Цвет волос', x0, y, '#a89e84', 12, '600'); y += 12;
    for (let i = 0; i < HAIRS.length; i++) {
      const bx = x0 + i * 44;
      g.fillStyle = HAIRS[i];
      g.beginPath(); g.roundRect(bx, y, 36, 30, 6); g.fill();
      if (a.hair === i) { g.strokeStyle = '#e8dfc4'; g.lineWidth = 2; g.beginPath(); g.roundRect(bx, y, 36, 30, 6); g.stroke(); }
      if (Input.mclick && Input.mx > bx && Input.mx < bx + 36 && Input.my > y && Input.my < y + 30) a.hair = i;
    }
    y += 54;
    this.text(g, 'Причёска', x0, y, '#a89e84', 12, '600'); y += 12;
    for (let i = 0; i < HAIRSTYLES.length; i++) {
