    }
    y += 92;
    if (this.btn(g, x0, y, 140, 34, a.beard ? 'Борода: есть' : 'Борода: нет', a.beard)) a.beard = !a.beard;
    if (this.btn(g, x0 + 150, y, 150, 34, this.previewMask ? 'Показ: в маске' : 'Показ: без маски', this.previewMask)) this.previewMask = !this.previewMask;
    y += 60;
    this.text(g, 'Одежда: белая майка, тёмные штаны, армейские ботинки —', x0, y, 'rgba(200,190,160,0.5)', 12);
    this.text(g, 'то, в чём ты лёг спать в ту ночь.', x0, y + 16, 'rgba(200,190,160,0.5)', 12);

    if (this.btn(g, W / 2 - 380 + 24, 590, 200, 42, '← Назад')) this.screen = 'menu';
    if (this.btn(g, W / 2 + 380 - 224, 590, 200, 42, 'Проснуться →')) Game.start();
  },

  // ---- HUD ----
  drawHUD(g) {
    const W = this.W, H = this.H;
    const P = Player;
    // шкалы
    const bx = 22, by = 22, bw = 160;
    this.bar(g, bx, by, bw, 12, P.hp, ['#8c2b26', '#d4574a'], Math.round(P.hp) + ' здоровье');
    this.bar(g, bx, by + 20, bw, 12, P.food, ['#7a5c1e', '#d8a83c'], Math.round(P.food) + ' / ' + FOOD_MAX + ' сытость', null, FOOD_MAX);
    this.bar(g, bx, by + 40, bw, 12, P.water, ['#1e5c72', '#3ca8d0'], Math.round(P.water) + ' / ' + WATER_MAX + ' вода', null, WATER_MAX);
    // выносливость: пустая — не побежишь и слабо бьёшь
    this.bar(g, bx, by + 60, bw, 9, P.stam, P.winded ? ['#6a5a20', '#a08a34'] : ['#3f6a3c', '#7fc06a'],
      Math.round(P.stam) + (P.winded ? ' выдохся' : ' выносливость'), null, STAM_MAX);
    // тепло
    this.bar(g, bx, by + 76, bw, 9, P.warm, P.warm < 30 ? ['#2a4a7a', '#5f9ec4'] : ['#7a4a1e', '#d09848'],
      Math.round(P.warm) + ' тепло', null, WARM_MAX);

    // радиация и фильтр
    const radW = 120;
    g.fillStyle = 'rgba(0,0,0,0.5)'; g.beginPath(); g.roundRect(bx, by + 96, radW, 8, 4); g.fill();
    g.fillStyle = P.rad > 45 ? '#c8d24a' : '#7d8a3c';
    g.beginPath(); g.roundRect(bx + 1, by + 97, (radW - 2) * clamp(P.rad / 100, 0, 1), 6, 3); g.fill();
    this.text(g, 'радиация ' + Math.round(P.rad) + '%', bx + radW + 8, by + 104, P.rad > 45 ? '#d8e06a' : 'rgba(220,214,196,0.7)', 11, '600');

    let ny = by + 110;
    if (P.infection > 0) {
      g.fillStyle = 'rgba(0,0,0,0.5)'; g.beginPath(); g.roundRect(bx, ny, radW, 8, 4); g.fill();
      g.fillStyle = P.infection > 40 ? '#8fc060' : '#5f8a44';
      g.beginPath(); g.roundRect(bx + 1, ny + 1, (radW - 2) * clamp(P.infection / 100, 0, 1), 6, 3); g.fill();
      this.text(g, 'заражение ' + Math.round(P.infection) + '%', bx + radW + 8, ny + 8, '#a8d078', 11, '700');
      ny += 14;
    }
    if (P.mask) {
      g.fillStyle = 'rgba(0,0,0,0.5)'; g.beginPath(); g.roundRect(bx, ny, radW, 8, 4); g.fill();
      g.fillStyle = P.filterWear > 30 ? '#4a8a6a' : '#c07a3c';
      g.beginPath(); g.roundRect(bx + 1, ny + 1, (radW - 2) * clamp(P.filterWear / 100, 0, 1), 6, 3); g.fill();
      this.text(g, 'фильтр ' + Math.round(P.filterWear) + '%', bx + radW + 8, ny + 8, 'rgba(220,214,196,0.7)', 11, '600');
      ny += 14;
    } else {
      this.text(g, '⚠ ПРОТИВОГАЗ СНЯТ', bx, ny + 8, '#e07a5a', 12, '800');
      ny += 14;
    }
    // что надето
    const wornList = [];
    for (const k in P.worn) if (P.worn[k]) wornList.push(ITEMS[P.worn[k]].name);
    if (wornList.length) { this.text(g, 'на себе: ' + wornList.join(', '), bx, ny + 8, 'rgba(180,190,170,0.6)', 11, '500'); ny += 14; }

    // тело: подсветка травм
    let wounds = [];
    for (const l of LIMBS) if (P.body[l.id].w > 0) wounds.push(l);
    if (wounds.length) {
      let wy = ny + 22;
      this.text(g, 'ТРАВМЫ (B)', bx, wy, 'rgba(220,140,110,0.8)', 11, '800'); wy += 15;
      for (const l of wounds.slice(0, 4)) {
        const b = P.body[l.id];
        this.text(g, l.name + ' — ' + WOUND_NAMES[b.w].split(' ')[0] + (b.bleed ? ' ⬤' : ''), bx, wy, WOUND_COLORS[b.w], 11, '600');
        wy += 14;
      }
    }

    // часы
    const t = Game.time / DAY_LEN;
    const hh = Math.floor(t * 24), mm = Math.floor((t * 24 % 1) * 60);
    this.text(g, (hh < 10 ? '0' : '') + hh + ':' + (mm < 10 ? '0' : '') + mm, W - 24, 34, '#d8d2bc', 22, '700', 'right');
    this.text(g, 'день ' + Game.day + ' · ' + (Game.nightAmount() > 0.5 ? 'ночь' : 'день'), W - 24, 52, 'rgba(200,190,160,0.6)', 12, '500', 'right');
    const z = zoneAtPx(P.x);
    this.text(g, z.name + ' · M — карта', W - 24, 72, z.color, 13, '700', 'right');
    this.text(g, Weather.cur.name.toLowerCase() + ' · зомби рядом: ' + Zombies.list.length,
      W - 24, 90, Weather.cur.id === 'clear' ? 'rgba(200,190,160,0.4)' : Weather.cur.col, 11, '600', 'right');
    // предупреждение об орде
    if (Zombies.hordeNight()) {
      const on = Zombies.hordeActive();
      const a = on ? 0.55 + Math.sin(performance.now() / 260) * 0.35 : 0.75;
      g.globalAlpha = a;
      this.text(g, on ? '⚑ ОРДА ИДЁТ' : '⚑ сегодня ночью будет орда', W - 24, 150, '#e0603c', on ? 16 : 12, '800', 'right');
      g.globalAlpha = 1;
    }
    // монеты и навыки
    g.fillStyle = '#e8cf72';
    g.beginPath(); g.arc(W - 122, 108, 5.5, 0, 7); g.fill();
    g.fillStyle = 'rgba(90,70,20,0.6)'; g.beginPath(); g.arc(W - 122, 108, 2.4, 0, 7); g.fill();
    this.text(g, P.coins + ' монет · F — навыки', W - 24, 112, '#e8cf72', 13, '700', 'right');
    if (Home.inside(P.x, P.y)) this.text(g, '⌂ ДОМ · радиации нет', W - 24, 132, '#8ac0a0', 12, '700', 'right');

    // панель быстрого доступа
    const s = 52, gap = 6, n = 6;
    const hx = W / 2 - (n * s + (n - 1) * gap) / 2, hy = H - s - 18;
    for (let i = 0; i < n; i++) {
      const x = hx + i * (s + gap);
      this.slotBox(g, x, hy, s, P.inv.slots[i], P.hotbar === i);
      this.text(g, String(i + 1), x + 5, hy + 13, 'rgba(230,224,200,0.45)', 10, '700');
      if (Input.mclick && Input.mx > x && Input.mx < x + s && Input.my > hy && Input.my < hy + s) P.hotbar = i;
    }
    // подпись предмета в руке
    const it = P.handItem();
    if (it) {
      this.text(g, it.name, W / 2, hy - 12, '#e8e2ca', 13, '700', 'center');
      if (it.type === 'gun') {
        const m = P.mag[it.kind] || 0, res = P.inv.count(it.ammo);
        const label = P.jam > 0 ? 'КЛИН — R' : m + ' / ' + res + (P.reload > 0 ? '   перезарядка…' : '');
        this.text(g, label, W / 2, hy - 30, P.jam > 0 ? '#e08a4a' : m > 0 ? '#e8d8a0' : '#d07a5a', 15, '800', 'center');
        // износ ствола: чем краснее, тем ближе перекос
        const wear = P.gunWear[it.kind] || 0;
        if (wear > 3) {
          const ww = 90, wxp = W / 2 - ww / 2;
          g.fillStyle = 'rgba(0,0,0,0.5)'; g.beginPath(); g.roundRect(wxp, hy - 46, ww, 5, 2.5); g.fill();
          g.fillStyle = wear > 65 ? '#c04a2f' : wear > 35 ? '#c08a3c' : '#5f7f5a';
          g.beginPath(); g.roundRect(wxp + 1, hy - 45, (ww - 2) * clamp(wear / 100, 0, 1), 3, 1.5); g.fill();
          this.text(g, 'износ ' + Math.round(wear) + '%', W / 2 + ww / 2 + 8, hy - 41, 'rgba(200,190,160,0.55)', 10, '600');
        }
      } else if (it.desc) {
        this.text(g, it.desc, W / 2, hy - 30, 'rgba(200,190,160,0.55)', 11, '500', 'center');
      }
    }

    // прогресс копания
    if (P.digProgress > 0 && P.digTarget) {
      const sc = Game.toScreen(P.digTarget.x * CELL + CELL / 2, P.digTarget.y * CELL - 12);
      g.fillStyle = 'rgba(0,0,0,0.6)'; g.beginPath(); g.roundRect(sc.x - 18, sc.y, 36, 5, 2.5); g.fill();
      g.fillStyle = '#d8c88a'; g.beginPath(); g.roundRect(sc.x - 17, sc.y + 1, 34 * clamp(P.digProgress, 0, 1), 3, 1.5); g.fill();
    }

    // подсказка взаимодействия
    if (Game.hint) {
      g.fillStyle = 'rgba(12,13,15,0.72)';
      const tw = g.measureText(Game.hint).width + 150;
      g.beginPath(); g.roundRect(W / 2 - tw / 2, H - 152, tw, 24, 6); g.fill();
      this.text(g, Game.hint, W / 2, H - 135, '#e8dfb8', 13, '700', 'center');
    }
    // сообщение
    if (P.msgT > 0) {
      g.globalAlpha = clamp(P.msgT, 0, 1);
      this.text(g, P.msg, W / 2, 100, '#f0e8cc', 15, '600', 'center');
      g.globalAlpha = 1;
    }
    // панель строительного плана
    const hi = Player.handItem();
    if (hi && hi.type === 'plan') {
      const pw = 620, px = W / 2 - pw / 2, py = H - 148;
      g.fillStyle = 'rgba(12,13,15,0.82)';
      g.beginPath(); g.roundRect(px, py, pw, 40, 8); g.fill();
      g.strokeStyle = 'rgba(190,180,150,0.2)'; g.lineWidth = 1;
      g.beginPath(); g.roundRect(px + 0.5, py + 0.5, pw - 1, 39, 8); g.stroke();
      const cw = pw / PARTS.length;
      for (let i = 0; i < PARTS.length; i++) {
        const cx2 = px + i * cw;
        const sel = i === Player.planPart;
        if (sel) {
          g.fillStyle = 'rgba(170,152,96,0.26)';
          g.beginPath(); g.roundRect(cx2 + 2, py + 2, cw - 4, 36, 6); g.fill();
        }
        this.text(g, PARTS[i].name, cx2 + cw / 2, py + 25, sel ? '#f2ecd8' : 'rgba(200,190,160,0.55)', 11, sel ? '700' : '500', 'center');
      }
      const cost = partCost(PARTS[Player.planPart], Player.planTier);
      const have = Player.inv.count(cost.res);
      this.text(g, 'колесо — деталь · Z — материал: ' + TIERS[Player.planTier].name +
        ' · цена ' + cost.n + ' ' + ITEMS[cost.res].name.toLowerCase() + ' (есть ' + have + ')',
        W / 2, py - 8, have >= cost.n ? 'rgba(220,214,180,0.8)' : '#e08a6a', 12, '600', 'center');
      if (Game.ghost && Game.ghost.err) this.text(g, Game.ghost.err, W / 2, py - 26, '#e08a6a', 12, '600', 'center');
    }

    // масштаб: показываем ненадолго, когда крутят колесо или щиплют трекпад
    if (Game.zoomHint > 0) {
      const a = clamp(Game.zoomHint, 0, 1);
      g.globalAlpha = a;
      const zt = 'масштаб ' + Math.round(Game.zoom * 100 / 2.1) + '%';
      g.fillStyle = 'rgba(12,13,15,0.8)';
      g.beginPath(); g.roundRect(W / 2 - 62, 150, 124, 26, 6); g.fill();
      this.text(g, zt, W / 2, 167, '#e8dfb0', 13, '700', 'center');
      g.globalAlpha = 1;
    }

    // подсказки клавиш
    this.text(g, 'Ю выбросить · Q применить · I инвентарь · B тело · C крафт · M карта · F навыки · E взять · R перезарядка · Esc пауза', W / 2, H - 4, 'rgba(200,190,160,0.3)', 11, '500', 'center');
  },

  // ---- инвентарь ----
  drawInv(g) {
    const W = this.W, H = this.H;
    g.fillStyle = 'rgba(0,0,0,0.6)'; g.fillRect(0, 0, W, H);
    const pw = 560, ph = 470, px = W / 2 - pw - 12, py = H / 2 - ph / 2;
    this.panel(g, px, py, pw, ph, 'Инвентарь — 30 ячеек');
    this.text(g, 'ЛКМ — взять · ПКМ — применить', px + pw - 16, py + 26, 'rgba(200,190,160,0.55)', 12, '600', 'right');

    const s = 56, gap = 8;
    // 24 ячейки основного объёма
    for (let i = 6; i < 30; i++) {
      const k = i - 6;
      const x = px + 22 + (k % 6) * (s + gap), y = py + 56 + Math.floor(k / 6) * (s + gap);
      this.slotBox(g, x, y, s, Player.inv.slots[i], false);
      this.slotClick(i, x, y, s);
    }
    // быстрый доступ
    this.text(g, 'Быстрый доступ (1–6)', px + 22, py + ph - 92, '#a89e84', 12, '600');
    for (let i = 0; i < 6; i++) {
      const x = px + 22 + i * (s + gap), y = py + ph - 82;
      this.slotBox(g, x, y, s, Player.inv.slots[i], Player.hotbar === i);
      this.slotClick(i, x, y, s);
    }

    // Красная полоса сброса: вынес предмет за неё, отпустил кнопку — выбросил.
    // Это самый простой способ выкинуть вещь, без всяких сочетаний клавиш
    const dz = { x: px + pw - 4, y: py + 44, w: 26, h: ph - 56 };
    const overDrop = Input.mx > dz.x && Input.mx < dz.x + dz.w && Input.my > dz.y && Input.my < dz.y + dz.h;
    const hot = this.held && overDrop;
    g.fillStyle = hot ? 'rgba(200,60,44,0.55)' : this.held ? 'rgba(180,54,40,0.3)' : 'rgba(150,50,40,0.16)';
    g.beginPath(); g.roundRect(dz.x, dz.y, dz.w, dz.h, 7); g.fill();
    g.strokeStyle = hot ? '#ff8a70' : 'rgba(210,80,60,0.7)';
    g.lineWidth = hot ? 2 : 1.2;
    g.setLineDash([6, 5]);
    g.beginPath(); g.roundRect(dz.x + 0.5, dz.y + 0.5, dz.w - 1, dz.h - 1, 7); g.stroke();
    g.setLineDash([]);
    // подпись вдоль полосы
    g.save();
    g.translate(dz.x + dz.w / 2, dz.y + dz.h / 2);
    g.rotate(Math.PI / 2);
    this.text(g, hot ? 'ОТПУСТИ — ВЫБРОСИТЬ' : 'ВЫБРОСИТЬ', 0, 4, hot ? '#fff0e6' : 'rgba(240,180,164,0.85)', 12, '800', 'center');
    g.restore();
    // сам сброс: клик по полосе с предметом в руке
    if (this.held && overDrop && (Input.mclick || Input.rclick) && this.guard <= 0) {
      Player.dropStack(this.held.id, this.held.n);
      this.held = null;
    }

    // правая панель: снаряжение и персонаж
    const rw = 400, rx = W / 2 + 12;
    this.panel(g, rx, py, rw, ph, 'Снаряжение');
    g.save();
    g.translate(rx + 110, py + 330);
    g.scale(3.0, 3.0);
    g.fillStyle = 'rgba(0,0,0,0.35)'; g.beginPath(); g.ellipse(0, 2, 14, 3, 0, 0, 7); g.fill();
    drawHuman(g, 0, 0, Player.look, { face: 1, phase: 0, moving: false, mask: Player.mask });
    g.restore();

    // слот противогаза
    const mx = rx + 250, my = py + 70;
    this.text(g, 'Голова', mx, my - 8, '#a89e84', 12, '600');
    this.slotBox(g, mx, my, 64, Player.mask ? { id: 'gasmask', n: 1 } : null, false);
    if (Input.mclick && Input.mx > mx && Input.mx < mx + 64 && Input.my > my && Input.my < my + 64) {
      if (Player.mask) Player.removeMask();
      else if (Player.inv.count('gasmask') > 0) Player.wearMask();
    }
    if (Player.mask) {
      this.text(g, 'Фильтр: ' + Math.round(Player.filterWear) + '%', mx, my + 84, Player.filterWear > 30 ? '#8aa87a' : '#d09a5a', 12, '600');
      this.text(g, 'нажми, чтобы снять', mx, my + 100, 'rgba(200,190,160,0.45)', 11);
    } else {
      this.text(g, 'НЕТ ЗАЩИТЫ', mx, my + 84, '#e07a5a', 12, '800');
      this.text(g, 'на улице ты умираешь', mx, my + 100, 'rgba(220,140,110,0.7)', 11);
    }
    this.text(g, Player.look.name, rx + 24, py + ph - 60, '#d8d2bc', 16, '700');
    this.text(g, 'радиация ' + Math.round(Player.rad) + '% · травм: ' + Player.totalWounds(), rx + 24, py + ph - 40, 'rgba(200,190,160,0.6)', 12);

    this.drawHeld(g);
  },
  slotClick(i, x, y, s) {
    const over = Input.mx > x && Input.mx < x + s && Input.my > y && Input.my < y + s;
    // Shift + ПКМ по ячейке — выбросить всю пачку на землю
    if (over && Input.rclick && this.guard <= 0 && !this.held && Input.isDown('ShiftLeft')) {
      Player.dropSlot(i);
      return;
    }
    // ПКМ по ячейке — сразу принять: таблетки, еду, воду, бинт, цинк, противогаз
    if (over && Input.rclick && this.guard <= 0 && !this.held) {
      Player.consume(i);
      return;
    }
    if (!Input.mclick) return;
    if (!over) return;
    const slots = Player.inv.slots;
    if (this.held) {
      const cur = slots[i];
      if (cur && cur.id === this.held.id) {
        const max = ITEMS[cur.id].max, c = Math.min(max - cur.n, this.held.n);
        cur.n += c; this.held.n -= c;
        if (this.held.n <= 0) this.held = null;
      } else { slots[i] = this.held; this.held = cur; }
    } else if (slots[i]) {
      this.held = slots[i]; slots[i] = null;
    }
  },
  drawHeld(g) {
    if (!this.held) return;
    g.save(); g.translate(Input.mx - 22, Input.my - 22);
    g.globalAlpha = 0.92;
    ITEMS[this.held.id].icon(g, 44);
    if (this.held.n > 1) this.text(g, String(this.held.n), 42, 42, '#f0ead6', 12, '700', 'right');
    g.restore();
  },

  // ---- экран тела ----
  drawBody(g) {
    const W = this.W, H = this.H;
    g.fillStyle = 'rgba(0,0,0,0.62)'; g.fillRect(0, 0, W, H);
    const pw = 860, ph = 500, px = W / 2 - pw / 2, py = H / 2 - ph / 2;
    this.panel(g, px, py, pw, ph, 'Состояние тела');

    // схема тела спереди
    const cx = px + 200, cy = py + 110;
    const parts = {
      head: { x: 0, y: 0, w: 34, h: 38, r: 14 },
      torso: { x: 0, y: 52, w: 62, h: 90, r: 8 },
      armL: { x: -48, y: 56, w: 20, h: 88, r: 9 },
      armR: { x: 48, y: 56, w: 20, h: 88, r: 9 },
      legL: { x: -18, y: 152, w: 24, h: 108, r: 10 },
      legR: { x: 18, y: 152, w: 24, h: 108, r: 10 }
    };
    for (const id in parts) {
      const p = parts[id], b = Player.body[id];
      const x = cx + p.x - p.w / 2, y = cy + p.y;
      const over = Input.mx > x && Input.mx < x + p.w && Input.my > y && Input.my < y + p.h;
      g.fillStyle = b.w === 0 ? 'rgba(120,140,116,0.30)' : 'rgba(' + [190, 70, 55] + ',' + (0.18 + b.w * 0.17) + ')';
      g.beginPath(); g.roundRect(x, y, p.w, p.h, p.r); g.fill();
      g.strokeStyle = over ? '#e8dfc4' : WOUND_COLORS[b.w]; g.lineWidth = b.w ? 2 : 1;
      g.beginPath(); g.roundRect(x, y, p.w, p.h, p.r); g.stroke();
      if (b.w) this.text(g, 'C' + b.w, x + p.w / 2, y + p.h / 2 + 4, '#f2e2d0', 13, '800', 'center');
      if (b.bleed) {
        g.fillStyle = '#a8231f';
        g.beginPath(); g.arc(x + p.w - 4, y + 8, 3.5, 0, 7); g.fill();
      }
    }

    // список конечностей
    let ly = py + 70, lx = px + 420;
    this.text(g, 'Классификация ран: C1 ссадина · C2 лёгкая · C3 средняя · C4 смертельная', lx, ly, 'rgba(200,190,160,0.55)', 12);
    ly += 26;
    for (const l of LIMBS) {
      const b = Player.body[l.id];
      g.fillStyle = 'rgba(255,255,255,0.04)';
      g.beginPath(); g.roundRect(lx, ly, 400, 46, 7); g.fill();
      g.fillStyle = WOUND_COLORS[b.w];
      g.beginPath(); g.roundRect(lx, ly, 4, 46, 2); g.fill();
      this.text(g, l.name, lx + 14, ly + 20, '#d8d2bc', 13, '700');

      const eff = l.id.startsWith('leg') ? 'скорость' : l.id.startsWith('arm') ? 'копание и точность' : l.id === 'head' ? 'психика' : 'выносливость';
      this.text(g, b.w ? '−' + Math.round(b.w * (l.id === 'torso' ? 8 : 11)) + '% ' + eff : '', lx + 386, ly + 28, 'rgba(220,160,130,0.8)', 12, '600', 'right');

    }

    // лечение
    const meds = ['bandage', 'splint', 'medkit', 'antirad'];
    let mx2 = px + 40, my2 = py + ph - 84;
    this.text(g, 'Лечение', mx2, my2 - 10, '#a89e84', 12, '600');
    for (const id of meds) {
      const has = Player.inv.count(id);
      if (this.btn(g, mx2, my2, 116, 40, ITEMS[id].name.slice(0, 12) + ' (' + has + ')', false) && has > 0) {
        const slotIndex = Player.inv.slots.findIndex(s => s && s.id === id);
        const prevHot = Player.hotbar;
        // применяем напрямую
        const it = ITEMS[id];
        let used = false;
        if (it.rad) { Player.rad = clamp(Player.rad - it.rad, 0, 100); used = true; }
        if (it.heals && Player.heal(it)) used = true;
        if (used) {
          Player.hp = clamp(Player.hp + (it.hp || 0), 0, 100);
          Player.inv.remove(id, 1);
        } else Player.say('Нечего лечить');
        Player.hotbar = prevHot;
      }
      mx2 += 126;

  // ---- крафт ----
  drawCraft(g) {
    const W = this.W, H = this.H;
    g.fillStyle = 'rgba(0,0,0,0.62)'; g.fillRect(0, 0, W, H);
    const pw = 1200, ph = 560, px = W / 2 - pw / 2, py = H / 2 - ph / 2;
    const wb3 = Machines.near(Player.x, Player.y, 'workbench3');
    const wb2 = wb3 || Machines.near(Player.x, Player.y, 'workbench2');
    const nearBench = wb2 || Machines.near(Player.x, Player.y, 'workbench');
    const nearFurn = Machines.near(Player.x, Player.y, 'furnace');
    const nearFire = Machines.near(Player.x, Player.y, 'campfire');
    this.panel(g, px, py, pw, ph, 'Крафт' +
      (wb3 ? ' · верстак 3 ур.' : wb2 ? ' · верстак 2 ур.' : nearBench ? ' · верстак' : '') +
      (nearFurn ? ' · печь' : '') + (nearFire ? ' · костёр' : ''));

    const avail = st => !st || (st === 'workbench' && nearBench) || (st === 'workbench2' && wb2) ||
      (st === 'workbench3' && wb3) || (st === 'furnace' && nearFurn) || (st === 'campfire' && nearFire);
    const list = RECIPES.filter(r => avail(r.station));
    const hidden = RECIPES.length - list.length;
    if (hidden) this.text(g, 'скрыто рецептов: ' + hidden + ' — подойди к верстаку, печи или костру',
      px + pw - 24, py + 26, 'rgba(200,190,160,0.5)', 12, '500', 'right');

    let col = 0, row = 0;
    const cw = 275, chh = 74;
    for (let i = 0; i < list.length; i++) {
      const r = list[i];
      const x = px + 20 + col * (cw + 10), y = py + 52 + row * (chh + 8);
      const stationOk = true;
      const fuelOk = !r.fuel || (nearFurn && Machines.list.some(m => m.type === 'furnace' && m.fuel > 0));
      const matOk = Player.inv.has(r.in);
      const can = stationOk && matOk && fuelOk;
      const over = Input.mx > x && Input.mx < x + cw && Input.my > y && Input.my < y + chh;

      g.fillStyle = over && can ? 'rgba(190,170,110,0.18)' : 'rgba(255,255,255,0.04)';
      g.beginPath(); g.roundRect(x, y, cw, chh, 8); g.fill();
      g.strokeStyle = can ? 'rgba(200,190,140,0.4)' : 'rgba(150,140,120,0.15)';
      g.lineWidth = 1; g.beginPath(); g.roundRect(x + 0.5, y + 0.5, cw - 1, chh - 1, 8); g.stroke();

      g.save(); g.translate(x + 8, y + 12);
      if (!can) g.globalAlpha = 0.4;
      ITEMS[r.out[0]].icon(g, 48);
      g.restore();

      this.text(g, ITEMS[r.out[0]].name + (r.out[1] > 1 ? ' ×' + r.out[1] : ''), x + 64, y + 24, can ? '#e8e2ca' : 'rgba(200,190,160,0.45)', 13, '700');
      let ing = [];
      for (const k in r.in) ing.push(ITEMS[k].name + ' ' + Player.inv.count(k) + '/' + r.in[k]);
      this.text(g, ing.join(' · '), x + 64, y + 42, matOk ? 'rgba(180,200,160,0.75)' : 'rgba(210,150,130,0.75)', 11, '500');
      const need = [];
      if (r.station && !stationOk) need.push('нужен ' + (r.station === 'workbench' ? 'верстак' :
        r.station === 'workbench2' ? 'верстак 2 ур.' : r.station === 'workbench3' ? 'верстак 3 ур.' :
        r.station === 'furnace' ? 'печь' : 'костёр'));
      if (r.fuel && !fuelOk) need.push('печь должна быть затоплена');
      this.text(g, need.join(' · '), x + 64, y + 60, 'rgba(210,150,130,0.7)', 11, '500');

      if (over && Input.mclick && can) {
        for (const k in r.in) Player.inv.remove(k, r.in[k]);
        const left = Player.inv.add(r.out[0], r.out[1]);
        if (left > 0) Drops.add(Player.x, Player.y - 20, r.out[0], left);
        Player.say('Готово: ' + ITEMS[r.out[0]].name);
        Particles.burst(Player.x, Player.y - 24, [200, 180, 120], 6);
      }
      row++;
      if (py + 52 + row * (chh + 8) + chh > py + ph - 20) { row = 0; col++; }
    }
    this.text(g, 'Esc / C — закрыть', px + pw - 24, py + ph - 14, 'rgba(200,190,160,0.4)', 12, '500', 'right');
  },

  // ---- карта локаций (M) ----
  drawMap(g) {

    g.fillStyle = 'rgba(0,0,0,0.66)'; g.fillRect(0, 0, W, H);

    this.text(g, 'ты здесь: ' + here.name, px + pw - 24, py + 26, 'rgba(220,210,170,0.7)', 12, '600', 'right');

    // полоса мира
    const bx = px + 30, bw = pw - 60, byy = py + 56;
    g.fillStyle = 'rgba(255,255,255,0.05)'; g.beginPath(); g.roundRect(bx, byy, bw, 26, 5); g.fill();
    for (const z of ZONES) {
      const zx = bx + (z.x0 / WW) * bw, zw = ((z.x1 - z.x0) / WW) * bw;

      g.fillStyle = 'rgba(240,235,215,0.8)'; g.font = '600 9px system-ui'; g.textAlign = 'center';
      g.fillText(z.name, zx + zw / 2, byy + 17);
    }
    g.textAlign = 'left';
    const mx = bx + (Player.x / (WW * CELL)) * bw;
    g.fillStyle = '#f0e8c0'; g.beginPath(); g.moveTo(mx, byy - 5); g.lineTo(mx - 4, byy - 12); g.lineTo(mx + 4, byy - 12); g.fill();

    // карточки локаций
    const cw = (pw - 60 - 2 * 14) / 3, chh = 152;
    let i = 0;
    for (const z of ZONES) {
      const x = px + 30 + (i % 3) * (cw + 14), y = py + 104 + Math.floor(i / 3) * (chh + 14);
      const cur = z.id === here.id;
      const over = Input.mx > x && Input.mx < x + cw && Input.my > y && Input.my < y + chh;
      g.fillStyle = over && !cur ? 'rgba(200,185,120,0.16)' : 'rgba(255,255,255,0.05)';
      g.beginPath(); g.roundRect(x, y, cw, chh, 9); g.fill();
      g.strokeStyle = cur ? '#e8dfb0' : over ? 'rgba(220,210,170,0.5)' : 'rgba(190,180,150,0.2)';
      g.lineWidth = cur ? 2 : 1; g.beginPath(); g.roundRect(x, y, cw, chh, 9); g.stroke();
      g.fillStyle = z.color; g.beginPath(); g.roundRect(x + 12, y + 14, 26, 6, 3); g.fill();
      this.text(g, z.name, x + 12, y + 44, '#e8e2ca', 16, '700');
      this.text(g, 'угроза: ' + z.danger, x + 12, y + 62, z.zombies > 1.5 ? '#e08a6a' : z.zombies === 0 ? '#8ac0a0' : 'rgba(210,200,170,0.7)', 12, '600');
      // описание в две-три строки
      const words = z.desc.split(' ');
      let line = '', ly = y + 80;
      for (const w of words) {
        if ((line + ' ' + w).length > 34) { this.text(g, line, x + 12, ly, 'rgba(200,190,160,0.7)', 11); line = w; ly += 15; }
        else line = line ? line + ' ' + w : w;
      }
      this.text(g, line, x + 12, ly, 'rgba(200,190,160,0.7)', 11);
      if (cur) this.text(g, 'ты здесь', x + 12, y + chh - 18, '#e8dfb0', 12, '700');
      else if (this.btn(g, x + 12, y + chh - 40, cw - 24, 30, this.pickedZone === z.id ? '✓ выбрано' : 'Выбрать', this.pickedZone === z.id)) {
        this.pickedZone = z.id;
      }
      i++;
    }
    // переход только по отдельному подтверждению — случайный клик никуда не уносит
    const picked = ZONES.find(z => z.id === this.pickedZone && z.id !== here.id);
    if (picked) {
      const cxp = Math.floor((picked.x0 + picked.x1) / 2) * CELL;
      const km = (Math.abs(cxp - Player.x) / CELL / 100).toFixed(1);
      const dir = cxp > Player.x ? 'на восток (D)' : 'на запад (A)';
      this.text(g, picked.name + ' — ' + dir + ', идти ' + km + ' км',
        px + pw / 2, py + ph - 44, '#e8dfb0', 14, '700', 'center');
    } else {
      this.text(g, 'выбери локацию — покажу, куда и сколько идти', px + pw / 2, py + ph - 40, 'rgba(200,190,160,0.5)', 13, '600', 'center');
    }
    this.text(g, 'Телепортов нет: все переходы пешком. M — закрыть',
      px + pw / 2, py + ph - 14, 'rgba(200,190,160,0.45)', 12, '500', 'center');
  },

      else if (!can && lvl < SKILL_MAX) this.text(g, '', 0, 0);

  // ---- торговец ----
  shopTrader: null,

  shopTab: 'buy', shopScroll: 0,

  drawShop(g) {
    const W = this.W, H = this.H;
    const def = this.shopTrader;
    g.fillStyle = 'rgba(0,0,0,0.66)'; g.fillRect(0, 0, W, H);
    const pw = 920, ph = 600, px = W / 2 - pw / 2, py = H / 2 - ph / 2;
    const disc = 1 - 0.08 * Player.skills.trade;
    const who = def ? def.name : 'Торговец';
    this.panel(g, px, py, pw, ph, who + (Player.skills.trade ? ' · скидка ' + Math.round((1 - disc) * 100) + '%' : ''));
    if (def) this.text(g, def.greet, px + 20, py + 50, 'rgba(200,190,160,0.55)', 12, '500');
    this.text(g, Player.coins + ' монет', px + pw - 24, py + 26, '#e8cf72', 15, '800', 'right');

    // вкладки: купить у него / продать ему
    if (this.btn(g, px + pw - 250, py + 44, 110, 26, 'Купить', this.shopTab === 'buy')) { this.shopTab = 'buy'; this.shopScroll = 0; }
    if (this.btn(g, px + pw - 132, py + 44, 110, 26, 'Продать', this.shopTab === 'sell')) { this.shopTab = 'sell'; this.shopScroll = 0; }

    if (!def) { this.text(g, 'Esc — уйти', px + pw - 24, py + ph - 16, 'rgba(200,190,160,0.45)', 12, '500', 'right'); return; }
    Shop.ensure();

    const listTop = py + 82, listH = ph - 82 - 42;
    const cw = (pw - 40 - 2 * 12) / 3, chh = 66, rows = Math.floor(listH / (chh + 8));

    // ---- что показываем ----
    const entries = [];
    if (this.shopTab === 'buy') {
      for (const [id, n, price] of def.stock) {
        entries.push({ id, n, price: Math.max(1, Math.round(price * disc)), left: Shop.stockLeft(def, id) });
      }
    } else {
      // всё из рюкзака, что этот торговец берёт
      const seen = {};
      for (const slot of Player.inv.slots) {
        if (!slot) continue;
        const p = Shop.sellPrice(def, slot.id);
        if (!p) continue;
        if (seen[slot.id]) { seen[slot.id].have += slot.n; continue; }
        seen[slot.id] = { id: slot.id, n: 1, price: p, have: slot.n, sell: true };
        entries.push(seen[slot.id]);
      }
    }

    // прокрутка колесом
    const maxScroll = Math.max(0, Math.ceil(entries.length / 3) - rows);
    if (Input.wheel && maxScroll > 0) {
      this.shopScroll = clamp(this.shopScroll + Input.wheel, 0, maxScroll);
      Input.wheel = 0;
    }
    this.shopScroll = clamp(this.shopScroll, 0, maxScroll);

    if (!entries.length) {
      this.text(g, this.shopTab === 'buy' ? 'Всё раскупили. Приходи завтра.' : 'Он такого не берёт. Ищи другого торговца.',
        px + pw / 2, listTop + 60, 'rgba(200,190,160,0.5)', 14, '600', 'center');
    }

    const from = this.shopScroll * 3;
    for (let k = 0; k < rows * 3 && from + k < entries.length; k++) {
      const e = entries[from + k];
      const x = px + 20 + (k % 3) * (cw + 12), y = listTop + Math.floor(k / 3) * (chh + 8);
      const out = !e.sell && e.left <= 0;
      const can = e.sell ? true : (Player.coins >= e.price && !out);
      const over = this.guard <= 0 && Input.mx > x && Input.mx < x + cw && Input.my > y && Input.my < y + chh;
      g.fillStyle = over && can ? 'rgba(200,185,120,0.16)' : 'rgba(255,255,255,0.045)';
      g.beginPath(); g.roundRect(x, y, cw, chh, 8); g.fill();
      g.strokeStyle = can ? (e.sell ? 'rgba(140,190,150,0.4)' : 'rgba(200,190,140,0.35)') : 'rgba(150,140,120,0.15)';
      g.lineWidth = 1; g.beginPath(); g.roundRect(x, y, cw, chh, 8); g.stroke();
      g.save(); g.translate(x + 8, y + 14); if (!can) g.globalAlpha = 0.4; ITEMS[e.id].icon(g, 38); g.restore();
      this.text(g, ITEMS[e.id].name + (e.n > 1 ? ' ×' + e.n : ''), x + 54, y + 24,
        can ? '#e8e2ca' : 'rgba(200,190,160,0.5)', 13, '700');
      this.text(g, (e.sell ? '+' : '') + e.price + ' монет', x + 54, y + 42,
        e.sell ? '#8fc07a' : (can ? '#e8cf72' : 'rgba(210,180,110,0.45)'), 12, '600');
      this.text(g, e.sell ? 'у тебя ' + e.have + ' шт' : (out ? 'распродано до завтра' : 'осталось ' + e.left),
        x + 54, y + 58, out ? '#c0705a' : 'rgba(200,190,160,0.45)', 11, '500');

      if (over && Input.mclick && can) {
        if (e.sell) {
          Player.inv.remove(e.id, 1);
          Player.coins += e.price;
          Player.say('Продал: ' + ITEMS[e.id].name + ' за ' + e.price);
        } else {
          Player.coins -= e.price;
          Shop.takeOne(def, e.id);
          if (Player.inv.add(e.id, e.n) > 0) Drops.add(Player.x, Player.y - 20, e.id, e.n);
          Player.say('Куплено: ' + ITEMS[e.id].name);
        }
      }
    }

    if (maxScroll > 0) {
      this.text(g, 'колесо — листать (' + (this.shopScroll + 1) + '/' + (maxScroll + 1) + ')',
        px + 24, py + ph - 16, 'rgba(200,190,160,0.45)', 12, '500');
    }
    this.text(g, 'Esc — уйти', px + pw - 24, py + ph - 16, 'rgba(200,190,160,0.45)', 12, '500', 'right');
  },

  drawOptions(g) {
    const W = this.W, H = this.H;
    g.fillStyle = 'rgba(0,0,0,0.72)'; g.fillRect(0, 0, W, H);
    const pw = 520, ph = 560, px = W / 2 - (pw + 436) / 2, py = H / 2 - ph / 2;
    this.panel(g, px, py, pw, ph, 'Управление');
    const rows = [
      ['A / D', 'идти влево-вправо'],
      ['Shift', 'бежать (жжёт выносливость, еду и воду)'],
      ['Space / W', 'подпрыгнуть'],
      ['ЛКМ', 'копать породу · стрелять'],
      ['ПКМ', 'применить предмет: поставить, съесть, надеть'],
      ['E', 'подобрать, вскрыть ящик, использовать машину'],
      ['1–6', 'быстрый доступ'],
      ['колесо', 'смена предмета в руке'],
      ['M', 'карта локаций и переходы между ними'],
      ['F', 'навыки за монеты (2 монеты за зомби)'],

      ['C', 'крафт'],

    ];
    const hard = [
      'Выносливость: бег, прыжки, удары и кирка. Пустая — идёшь шагом.',
      'Тепло: ночь и дождь студят. Греют костёр, дом, ватник, чай и похлёбка.',
      'Заражение: приходит с укусом, само не проходит. Нужен антибиотик.',
      'Износ ствола: чем больше стрелял, тем чаще клин. Лечится маслом.',
      'Орда: каждую третью ночь. Днём приходит предупреждение.',
      'Погода: дождь студит, кислотный жжёт, буря поднимает мёртвых.',
      'Набитый рюкзак замедляет и быстрее выматывает.',
      'У каждого торговца свой товар, свой запас на день и своя скупка.'
    ];
    let y = py + 60;
    for (const [k, v] of rows) {
      g.fillStyle = 'rgba(255,255,255,0.05)'; g.beginPath(); g.roundRect(px + 20, y - 14, pw - 40, 26, 5); g.fill();
      this.text(g, k, px + 32, y + 4, '#e0d8bc', 12, '700');
      this.text(g, v, px + 130, y + 4, 'rgba(200,190,160,0.75)', 12, '500');
      y += 31;
    }
    // правая колонка: что изменилось в правилах выживания
    const hx2 = px + pw + 16;
    this.panel(g, hx2, py, 420, ph, 'Чем эта игра тебя убьёт');
    let hy2 = py + 62;
    for (const line of hard) {
      g.fillStyle = '#c0562f';
      g.beginPath(); g.arc(hx2 + 24, hy2 - 4, 2.6, 0, 7); g.fill();
      const words = line.split(' ');
      let cur = '';
      const lines = [];
      g.font = '500 12px system-ui, sans-serif';
      for (const w of words) {
        const test = cur ? cur + ' ' + w : w;
        if (g.measureText(test).width > 356) { lines.push(cur); cur = w; } else cur = test;
      }
      if (cur) lines.push(cur);
      for (const l of lines) { this.text(g, l, hx2 + 36, hy2, 'rgba(210,202,178,0.85)', 12, '500'); hy2 += 16; }
      hy2 += 10;
    }
    if (this.btn(g, px + 20, py + ph - 56, pw - 40, 40, this.fromMenu ? 'Назад в меню' : 'Продолжить')) {
      if (this.fromMenu) { this.screen = 'menu'; this.fromMenu = false; }
      else this.screen = null;
    }
  },

  drawDead(g) {
    const W = this.W, H = this.H;
    g.fillStyle = 'rgba(20,6,6,0.82)'; g.fillRect(0, 0, W, H);
    this.text(g, 'ТЫ УМЕР', W / 2, H / 2 - 60, '#c8483c', 62, '800', 'center');
    this.text(g, Player.deathCause, W / 2, H / 2 - 16, '#d8c8b8', 16, '500', 'center');
    this.text(g, 'день ' + Game.day + ' · травм: ' + Player.totalWounds() + ' · радиация ' + Math.round(Player.rad) + '%',
      W / 2, H / 2 + 10, 'rgba(200,180,170,0.6)', 13, '500', 'center');
    const hasBed = !!(Structures.bed() || Machines.bed());
    if (hasBed) {
      if (this.btn(g, W / 2 - 140, H / 2 + 50, 280, 46, 'Очнуться в своей кровати')) Game.respawnAtBed();
      this.text(g, 'вещи и мир остаются, тело подлечено', W / 2, H / 2 + 112, 'rgba(200,190,160,0.5)', 12, '500', 'center');
      if (this.btn(g, W / 2 - 140, H / 2 + 126, 280, 36, 'Начать новую жизнь с нуля')) Game.start();
    } else {
      this.text(g, 'кровати нет — возрождаться некуда', W / 2, H / 2 + 44, 'rgba(210,150,130,0.7)', 12, '600', 'center');
      if (this.btn(g, W / 2 - 120, H / 2 + 58, 240, 46, 'Проснуться заново')) Game.start();
    }
    if (this.btn(g, W / 2 - 120, H / 2 + (hasBed ? 174 : 116), 240, 36, 'В меню')) { this.screen = 'menu'; Player.dead = false; }
  },

  // ---- интро ----
  drawIntro(g) {
    const W = this.W, H = this.H;
    const t = Game.introT;
    g.fillStyle = 'rgba(0,0,0,' + clamp(1.4 - t * 0.5, 0, 1) + ')';
    g.fillRect(0, 0, W, H);
    const lines = [
      ['...сколько я спал?', 0.6],
      ['Стены нет. Крыши почти нет.', 3.0],
      ['Воздух жжёт горло. Надо чем-то дышать.', 5.6],
      ['Рядом на полу — противогаз. Подойди и нажми E.', 8.2]
    ];
    for (const [txt, at] of lines) {
      const a = clamp((t - at) * 0.8, 0, 1) * clamp(1 - (t - at - 6) * 0.5, 0, 1);
      if (a <= 0) continue;
      g.globalAlpha = a;
      this.text(g, txt, W / 2, 120 + lines.findIndex(l => l[0] === txt) * 26, '#e8dfc4', 17, '600', 'center');
      g.globalAlpha = 1;
    }
    if (t > 14) Game.introDone = true;
  }
};

</script>
<script>
// ---- js/game.js ----
// game.js — цикл, камера, фон, свет, взаимодействие
'use strict';

// ---- погода ----
// Пять состояний, каждое меняет и картинку, и правила выживания.
// Дождь студит и мешает видеть, кислотный дождь вдобавок жжёт радиацией,
// буря поднимает зомби даже днём. Погода сама сменяется каждые несколько минут
const WEATHERS = [
  { id: 'clear', name: 'Ясно',              w: 34, wet: 0,    dark: 0,    rad: 0,   zomb: 1,   col: '#c9c2ac' },
  { id: 'fog',   name: 'Туман',             w: 20, wet: 0.15, dark: 0.18, rad: 0,   zomb: 1.2, col: '#a8b0b8' },
  { id: 'rain',  name: 'Дождь',             w: 22, wet: 1,    dark: 0.3,  rad: 0,   zomb: 1.15,col: '#7aa0c0' },
  { id: 'acid',  name: 'Кислотный дождь',   w: 10, wet: 1,    dark: 0.42, rad: 1.6, zomb: 1.3, col: '#9ac04a' },
  { id: 'storm', name: 'Буря',              w: 8,  wet: 1.3,  dark: 0.55, rad: 0.5, zomb: 1.8, col: '#c05a4a' }
];

const Weather = {
  cur: WEATHERS[0], next: null, t: 120, fade: 1, drops: [], flash: 0,
  reset() { this.cur = WEATHERS[0]; this.t = 150; this.fade = 1; this.drops.length = 0; this.flash = 0; },
  roll() {
    // с каждым прожитым днём ясной погоды всё меньше — мир портится
    const bad = Math.min(2.6, 1 + (Game.day - 1) * 0.16);
    let total = 0;
    const ws = WEATHERS.map(w => {
      const weight = w.id === 'clear' ? w.w / bad : w.w * bad;
      total += weight; return { w, weight };
    });
    let r = Math.random() * total;
    for (const e of ws) { r -= e.weight; if (r <= 0) return e.w; }
    return WEATHERS[0];
  },
  wetness() { return this.cur.wet * this.fade; },
  darkness() { return this.cur.dark * this.fade; },
  update(dt) {
    this.t -= dt;
    if (this.t <= 0) {
      const w = this.roll();
      this.t = rnd(90, 260);
      if (w !== this.cur) {
        this.cur = w; this.fade = 0;
        Player.say('Погода: ' + w.name.toLowerCase());
      }
    }
    this.fade = Math.min(1, this.fade + dt * 0.25);
    if (this.cur.id === 'storm' && Math.random() < dt * 0.22) this.flash = 0.5;
    if (this.flash > 0) this.flash -= dt;
  },
  // капли рисуются в экранных координатах — дёшево и всегда попадают в кадр
  draw(g) {
    // туман: несколько мягких полос, ползущих поперёк кадра
    if (this.cur.id === 'fog' && this.fade > 0.02) {
      g.save();
      for (let i = 0; i < 4; i++) {
        const y = UI.H * (0.32 + i * 0.16) + Math.sin(Game.time * 0.2 + i) * 18;
        const off = (Game.cam.x * (0.05 + i * 0.03) + Game.time * (8 + i * 5)) % (UI.W + 600) - 300;
        const fg = g.createLinearGradient(0, y - 90, 0, y + 90);
        fg.addColorStop(0, 'rgba(190,198,205,0)');
        fg.addColorStop(0.5, 'rgba(190,198,205,' + (0.26 * this.fade) + ')');
        fg.addColorStop(1, 'rgba(190,198,205,0)');
        g.fillStyle = fg;
        g.beginPath(); g.ellipse(off + UI.W / 2, y, UI.W * 0.9, 90, 0, 0, 7); g.fill();
      }
      g.restore();
    }
    const wet = this.wetness();
    if (wet <= 0.02) return;
    const n = Math.round(wet * 260);
    const acid = this.cur.id === 'acid';
    g.save();
    g.strokeStyle = acid ? 'rgba(170,205,110,0.5)' : 'rgba(180,205,230,0.42)';
    g.lineWidth = 1.1;
    const t = Game.time * 60;
    for (let i = 0; i < n; i++) {
      const h = hash2(i * 3, 11), h2 = hash2(i * 7, 23);
      const sp = 420 + h2 * 520;
      const x = (h * UI.W + Game.cam.x * 0.6 + (this.cur.id === 'storm' ? t * 3 : t * 0.6)) % UI.W;
      const y = (h2 * UI.H + t * sp * 0.06) % UI.H;
      const len = 9 + h * 14;
      const skew = this.cur.id === 'storm' ? 7 : 2.5;
      g.beginPath(); g.moveTo(x, y); g.lineTo(x - skew, y + len); g.stroke();
    }
    g.restore();
    if (this.flash > 0.2) { g.fillStyle = 'rgba(220,230,255,' + (this.flash - 0.2) * 0.7 + ')'; g.fillRect(0, 0, UI.W, UI.H); }
  }
};

const Game = {
  canvas: null, ctx: null, lightCanvas: null, lctx: null,
  cam: { x: 0, y: 0 }, zoom: 2.1,
  time: DAY_LEN * 0.32, day: 1,
  shake: 0, hint: '',
  introT: 0, introDone: false,
  last: 0, acc: 0,

  init() {
    this.canvas = document.getElementById('game');
    this.canvas.width = UI.W; this.canvas.height = UI.H;
    this.ctx = this.canvas.getContext('2d');
    this.lightCanvas = document.createElement('canvas');
    // свет рисуем в половинном разрешении и растягиваем: вдвое меньше заливки
    this.lightCanvas.width = UI.W / 2; this.lightCanvas.height = UI.H / 2;
    this.lctx = this.lightCanvas.getContext('2d');
    bindInput(this.canvas);
    this.resize();
    addEventListener('resize', () => this.resize());
    requestAnimationFrame(t => this.frame(t));
  },

  resize() {
    const s = Math.min(innerWidth / UI.W, innerHeight / UI.H);
    this.canvas.style.width = (UI.W * s) + 'px';
    this.canvas.style.height = (UI.H * s) + 'px';
  },

  start() {
    World.generate(Math.floor(Math.random() * 1e9));
    Particles.list.length = 0; Floaters.list.length = 0; Bullets.list.length = 0;
    Zombies.list.length = 0; Zombies.nests.length = 0; Drops.list.length = 0;
    Machines.list.length = 0; Machines.torches.length = 0;
    Player.dead = false;
    Player.hp = 100; Player.food = FOOD_MAX; Player.water = WATER_MAX; Player.rad = 6;
    Player.stam = STAM_MAX; Player.warm = WARM_MAX; Player.infection = 0;
    Player.mask = false; Player.filterWear = 100;
    Player.init();
    this.time = DAY_LEN * 0.34; this.day = 1;
    this.introT = 0; this.introDone = false;
    UI.screen = null;
    UI.held = null;

    City.build();
    Home.flag = null;
    Doors.list.length = 0;
    Structures.reset();
    Nodes.seed();
    Throwables.list.length = 0;
    Explosions.list.length = 0;
    Weather.reset();

    // стартовый набор строителя: план, молоток и материал на первый дом
    Player.inv.add('plan', 1);
    Player.inv.add('hammer', 1);
    // Хардкор: стартового добра ощутимо меньше. Дробовик, аптечку и большую
    // часть материала теперь надо добывать самому
    Player.inv.add('wood', 120);
    Player.inv.add('stone', 24);
    Player.inv.add('ladder', 6);
    Player.inv.add('home_flag', 1);
    Player.inv.add('sawnoff', 1);
    Player.inv.add('buckshot', 8);
    Player.inv.add('bandage', 2);
    for (const m of Missions.list) { m.state = 0; m.from = 0; }

    // стартовый лут в пустоши: противогаз рядом и два ящика без повторов
    const sx = World.spawnX, sy = World.surface[sx];
    Drops.add((sx + 3) * CELL, (sy - 6) * CELL, 'gasmask', 1);
    Drops.addCrate(sx - 7, sy, [['axe', 1], ['pick', 1], ['bandage', 3]], false);
    Drops.addCrate(sx + 9, sy, [['pistol', 1], ['ammo9', 10], ['filter', 2], ['canteen', 1], ['can', 1]], false);

    // мёртвая зона: военные ящики со стволами и картой пещер
    const dz = ZONES.find(z => z.id === 'dead');
    const armyLoot = [
      [['shotgun', 1], ['buckshot', 24]],
      [['sawnoff', 1], ['buckshot', 16], ['bandage', 2]],
      [['smg', 1], ['zinc9', 1]],
      [['medkit', 2], ['splint', 2], ['antirad', 3]],
      [['filter', 4], ['scrap', 14], ['iron', 10]],
      [['map_caves', 1], ['zinc9', 1], ['medkit', 1]],
      [['ammo545', 90], ['ammo762', 60], ['bandage', 4]]
    ];
    for (let i = 0; i < armyLoot.length; i++) {
      const ax = dz.x0 + 60 + i * 74;
      Drops.addCrate(ax, World.surface[ax], armyLoot[i], true);
    }
    // руины небоскрёбов: оружие по этажам, на самом верху — пулемёт с цинком
    const towerLoot = [
      [['rifle', 1], ['ammo545', 60]],
      [['sniper', 1], ['ammo762', 24]],
      [['revolver', 1], ['ammo9', 30]],
      [['pistol', 1], ['ammo9', 40], ['bandage', 2]],
      [['ammo545', 90], ['scrap', 12]],
      [['club', 1], ['ammo762', 40], ['medkit', 1]],
      [['zinc9', 1], ['filter', 2]],
      [['ammo762', 80], ['splint', 1]]
    ];
    let ti = 0;
    for (const s of World.lootSpots) {
      if (s.kind === 'tower_top') {
        Drops.addCrate(s.x, s.y + 1, [['mg', 1], ['zinc762', 1], ['ammo762', 100]], true);
        // хозяин высотки — последний, двадцатый вид, с пулемётом
        if (s.floors >= 20) Zombies.addNest(s.x * CELL, s.y * CELL, ZTYPES.length - 1);
      } else if (s.kind === 'tower') {
        Drops.addCrate(s.x, s.y + 1, towerLoot[ti++ % towerLoot.length], true);
      } else if (s.kind === 'tower_mob') {
        // тип врага растёт с этажом: внизу бродяги, наверху офицеры
        const frac = s.floor / Math.max(1, s.floors - 1);
        const tier = Math.round(frac * (ZTYPES.length - 2));
        Zombies.addNest(s.x * CELL, s.y * CELL, tier);
      }
    }

    // шахта: ящик горняка
    const mz = ZONES.find(z => z.id === 'mine');
    const mx = mz.x0 + 40;
    Drops.addCrate(mx, World.surface[mx], [['drill', 1], ['coal', 20], ['torch', 8]], false);

    this.cam.x = Player.x - UI.W / (2 * this.zoom);
    this.cam.y = Player.y - UI.H / (2 * this.zoom);
  },

  // Телепортов в игре нет вовсе — до любой локации доходишь ногами.
  // Функция перехода удалена целиком, чтобы её нельзя было вызвать случайно

  sleep() {
    // Спать в ночь орды нельзя: они уже под дверью
    if (Zombies.hordeActive()) { Player.say('Не до сна — орда уже здесь'); return; }
    this.time = DAY_LEN * 0.3; this.day++;
    Player.hp = clamp(Player.hp + 10, 0, 100);
    Player.food = clamp(Player.food - 70, 1, FOOD_MAX);
    Player.water = clamp(Player.water - 80, 1, WATER_MAX);
    Player.stam = STAM_MAX;
    Player.warm = clamp(Player.warm + 40, 0, WARM_MAX);
    // заражение за ночь только крепнет
    if (Player.infection > 0) Player.infection = clamp(Player.infection + 12, 0, 100);
    Zombies.list.length = 0;
    Player.say('Утро. Ты спал в своей кровати' + (Zombies.hordeNight() ? '. Сегодня ночью придёт орда' : ''));
  },

  // возрождение на своей кровати: мир и вещи остаются, тело подлечено
  respawnAtBed() {
    const bed = Structures.bed() || Machines.bed();
    if (!bed) return false;
    Player.dead = false;
    const bx = bed.gx !== undefined ? bed.gx : bed.x;
    const by = bed.gy !== undefined ? bed.gy + bed.h : bed.y;
    Player.x = (bx + bed.w / 2) * CELL;
    Player.y = (by - 1) * CELL;
    Player.vx = 0; Player.vy = 0; Player.fallStart = null;
    Player.hp = 40; Player.food = Math.max(Player.food, 90); Player.water = Math.max(Player.water, 90);
    Player.rad = 0; Player.stam = STAM_MAX * 0.5; Player.warm = WARM_MAX * 0.7;
    // заражение возрождение не лечит — с ним придётся разбираться отдельно
    for (const l of LIMBS) { const b = Player.body[l.id]; b.w = Math.min(b.w, 1); b.bleed = false; }
    Zombies.list.length = 0;
    this.time = DAY_LEN * 0.3; this.day++;
    this.cam.x = Player.x - UI.W / (2 * this.zoom);
    this.cam.y = Player.y - UI.H / (2 * this.zoom);
    UI.screen = null;
    Player.say('Ты очнулся в своей кровати');
    return true;
  },

  nightAmount() {
    const t = this.time / DAY_LEN;               // 0 — полночь, 0.5 — полдень
    const d = Math.cos((t - 0.5) * Math.PI * 2); // 1 в полдень, −1 в полночь
    return clamp((0.3 - d) / 1.05, 0, 1);        // 1 — глубокая ночь
  },

  toScreen(wx, wy) {
    return { x: (wx - this.cam.x) * this.zoom, y: (wy - this.cam.y) * this.zoom };
  },

  fps: 60, frameAcc: 0, frameN: 0, quality: 'high', autoQuality: true, qCooldown: 3,

  // если кадры стали дорогими — сами снижаем качество текстур, чтобы не жгло машину
  trackPerf(dt) {
    this.frameAcc += dt; this.frameN++;
    if (this.frameAcc >= 0.5) {
      this.fps = this.frameN / this.frameAcc;
      this.frameAcc = 0; this.frameN = 0;
      if (this.qCooldown > 0) { this.qCooldown -= 0.5; return; }
      if (!this.autoQuality) return;
      if (this.fps < 42 && this.quality !== 'low') {
        this.quality = this.quality === 'high' ? 'mid' : 'low';
        World.setQuality(this.quality);
        this.qCooldown = 4;
        Player.say('Качество текстур снижено — так плавнее');
      } else if (this.fps > 57 && this.quality === 'mid') {
        this.quality = 'high'; World.setQuality('high'); this.qCooldown = 8;
      }
    }
  },

  // Физика идёт фиксированным шагом 1/60 секунды, и это важно.
  // Скорости в игре заданы «за кадр»: шаг 1,65 пикселя, прыжок −5,4, тяга 0,42.
  // Пока цикл был привязан к кадрам экрана, на 120-герцевом мониторе всё это
  // применялось вдвое чаще — персонаж бегал вдвое быстрее, прыгал выше и падал
  // резче, а на 60 Гц вёл себя нормально. Теперь скорость одинаковая на любом
  // экране, а отрисовка остаётся такой частой, какую экран умеет.
  STEP: 1 / 60,

  frame(t) {
    const raw = Math.min(0.25, (t - this.last) / 1000 || 0.016);
    this.last = t;
    this.trackPerf(raw);

    this.acc = (this.acc || 0) + raw;
    let steps = 0;
    while (this.acc >= this.STEP && steps < 5) {
      this.update(this.STEP);
      this.acc -= this.STEP;
      steps++;
    }
    // если провалились совсем (вкладка была свёрнута) — не отрабатываем долг,
    // иначе игра рывком проматывает пропущенное время
    if (steps >= 5) this.acc = 0;

    this.draw();
    // Ввод сбрасываем только когда шаг физики действительно был. На 120 Гц
    // каждый второй кадр шага нет, и без этой проверки нажатия терялись бы.
    if (steps > 0) Input.endFrame();
    requestAnimationFrame(tt => this.frame(tt));
  },

  update(dt) {
    // смена экрана даёт короткую защиту от клика, прилетевшего вместе с открытием
    if (UI.screen !== this.lastScreen) { UI.guard = 0.2; this.lastScreen = UI.screen; }
    if (UI.guard > 0) UI.guard -= dt;

    // экраны
    if (UI.screen === 'menu' || UI.screen === 'custom') return;
    if (Input.once('Escape')) {
      if (UI.screen) { UI.screen = null; UI.fromMenu = false; }
      else UI.screen = 'options';
    }
    if (Input.once('KeyI') || Input.once('Tab')) UI.screen = UI.screen === 'inv' ? null : 'inv';
    if (Input.once('KeyB')) UI.screen = UI.screen === 'body' ? null : 'body';
    if (Input.once('KeyC')) UI.screen = UI.screen === 'craft' ? null : 'craft';
    if (Input.once('KeyM')) UI.screen = UI.screen === 'map' ? null : 'map';
    if (Input.once('KeyF')) UI.screen = UI.screen === 'skills' ? null : 'skills';
    // Ю (она же точка на английской раскладке) — выбросить всё из руки
    if (!Player.dead && (Input.once('Period') || Input.once('KeyG'))) Player.dropHand();
    for (let i = 0; i < 6; i++) if (Input.once('Digit' + (i + 1))) Player.hotbar = i;
    // приближение и отдаление: колесо мыши или щипок на трекпаде
    if (Input.zoomDelta && UI.screen === null) {
      this.zoomTarget = clamp((this.zoomTarget || this.zoom) * (1 + Input.zoomDelta), 0.55, 4.2);
      this.zoomHint = 1.6;
    }
    if (this.zoomTarget === undefined) this.zoomTarget = this.zoom;
    this.zoom += (this.zoomTarget - this.zoom) * Math.min(1, dt * 10);
    if (this.zoomHint > 0) this.zoomHint -= dt;

    if (Player.dead) { UI.screen = 'dead'; }
    const paused = UI.screen !== null;

    // мировые координаты мыши
    Input.wx = this.cam.x + Input.mx / this.zoom;
    Input.wy = this.cam.y + Input.my / this.zoom;

    if (!paused) {
      this.time += dt;
      if (this.time > DAY_LEN) { this.time -= DAY_LEN; this.day++; }
      if (!this.introDone) this.introT += dt;

      Weather.update(dt);
      // объявление орды один раз за сутки, на закате
      if (Zombies.hordeNight() && this.nightAmount() > 0.3 && this.hordeWarned !== this.day) {
        this.hordeWarned = this.day;
        Player.say('Слышишь? Их много. Сегодня орда — запирайся');
        Floaters.push(Player.x, Player.y - 76, 'ОРДА', '#e0603c');
      }
      Player.update(dt);
      Zombies.update(dt);
      Bullets.update(dt);
      Machines.update(dt);
      Drops.update(dt);
      City.update(dt);
      Home.update(dt);
      Doors.update(dt);
      Structures.update(dt);
      Throwables.update(dt);
      Explosions.update(dt);
      Nodes.update(dt);

      // взаимодействие
      this.hint = '';
      const d = Drops.nearest(Player.x, Player.y - 20, 92);
      const m = Machines.nearest(Player.x, Player.y - 20, 70);
      const c = City.nearest(Player.x, Player.y - 20, 60);
      const sdoor = Structures.list.find(st => st.part.hole === 'door' &&
        dist(Player.x, Player.y - 20, (st.gx + st.w / 2) * CELL, (st.gy + st.h / 2) * CELL) < 46);
      const door = Doors.nearest(Player.x, Player.y - 20, 46);
      if (sdoor) {
        this.hint = sdoor.open ? 'E — закрыть дверь' : 'E — открыть дверь';
        if (Input.once('KeyE')) Structures.toggleDoor(sdoor);
      } else if (door) {
        this.hint = door.open ? 'E — закрыть дверь' : 'E — открыть дверь';
        if (Input.once('KeyE')) Doors.toggle(door);
      } else if (c) {
        this.hint = c.kind === 'trader' ? 'E — торговать: ' + c.trader.def.name : 'E — доска заданий';
        if (Input.once('KeyE')) {
          if (c.kind === 'trader') {
            UI.shopTrader = c.trader.def; UI.shopTab = 'buy'; UI.shopScroll = 0;
            Player.say(c.trader.def.greet); UI.screen = 'shop';
          }
          else UI.screen = 'board';
        }
      } else if (d) {
        this.hint = d.crate ? 'E — вскрыть ' + (d.military ? 'военный ящик' : 'ящик') : 'E — взять ' + ITEMS[d.id].name + (d.n > 1 ? ' ×' + d.n : '');
        if (Input.once('KeyE')) {
          Drops.take(d);
          if (!d.crate && d.id === 'gasmask' && !Player.mask) Player.wearMask();
        }
      } else if (m) {
        const names = { workbench: 'верстак (крафт)', workbench2: 'верстак 2 ур. (крафт)', workbench3: 'верстак 3 ур. (крафт)',
          furnace: 'печь (затопить)', campfire: 'костёр (готовка)', drill: 'автобур', farm: 'грядка', bed: 'кровать (спать)' };
        this.hint = 'E — ' + (names[m.type] || m.type);
        if (Input.once('KeyE')) Machines.interact(m);
      } else if (Structures.bed() && dist(Player.x, Player.y - 20,
          (Structures.bed().gx + Structures.bed().w / 2) * CELL, (Structures.bed().gy + 1) * CELL) < 52) {
        this.hint = 'E — спать до утра';
        if (Input.once('KeyE')) this.sleep();
      } else if (Home.nearFlag(Player.x, Player.y - 20, 44)) {
        // снятие дома — только с Shift, чтобы не сорвать флажок случайно
        this.hint = 'Shift + E — снять флажок дома';
        if (Input.isDown('ShiftLeft') && Input.once('KeyE')) Home.take();
      } else {
        // рядом трогать нечего — тогда E просто применяет то, что в руке
        const hi = Player.handItem();
        if (hi && ['food', 'drink', 'med', 'mask', 'filter', 'zinc'].includes(hi.type)) {
          this.hint = 'E — ' + (hi.type === 'drink' ? 'выпить' : hi.type === 'food' ? 'съесть' : 'применить') + ': ' + hi.name;
          if (Input.once('KeyE')) Player.useRight(hi);
        }
      }
    }

    Particles.update(dt);
    Floaters.update(dt);
    if (this.shake > 0) this.shake = Math.max(0, this.shake - dt * 14);

    // камера с плавным следованием и лёгким опережением от курсора
    const tx = Player.x + (Input.wx - Player.x) * 0.12 - UI.W / (2 * this.zoom);
    const ty = (Player.y - 26) + (Input.wy - Player.y) * 0.1 - UI.H / (2 * this.zoom);
    this.cam.x += (tx - this.cam.x) * Math.min(1, dt * 7);
    this.cam.y += (ty - this.cam.y) * Math.min(1, dt * 7);
    this.cam.x = clamp(this.cam.x, 0, WW * CELL - UI.W / this.zoom);
    this.cam.y = clamp(this.cam.y, -200, WH * CELL - UI.H / this.zoom);
  },

  // ---- фон: небо, солнце, пыль, силуэты города ----
  drawBackground(g) {
    const night = this.nightAmount();
    const top = [lerp(96, 12, night), lerp(120, 14, night), lerp(140, 22, night)];
    const bot = [lerp(196, 26, night), lerp(160, 24, night), lerp(112, 30, night)];
    const mid = [lerp(206, 20, night), lerp(168, 20, night), lerp(120, 28, night)];
    const gr = g.createLinearGradient(0, 0, 0, UI.H);
    gr.addColorStop(0, rgb(top[0], top[1], top[2]));
    gr.addColorStop(0.46, rgb(lerp(top[0], mid[0], 0.7), lerp(top[1], mid[1], 0.7), lerp(top[2], mid[2], 0.7)));
    gr.addColorStop(0.72, rgb(mid[0], mid[1], mid[2]));          // золотая полоса у горизонта
    gr.addColorStop(1, rgb(bot[0], bot[1], bot[2]));
    g.fillStyle = gr; g.fillRect(0, 0, UI.W, UI.H);

    // светило: восход слева в 6:00, зенит в полдень, закат справа в 18:00
    const tt = this.time / DAY_LEN;
    const sunA = (tt - 0.25) * Math.PI * 2;
    const sx = UI.W * (0.5 - 0.58 * Math.cos(sunA));
    const sy = UI.H * 0.78 - UI.H * 0.72 * Math.sin(sunA);
    const sr = 110;
    const sg = g.createRadialGradient(sx, sy, 0, sx, sy, sr);
    if (night < 0.6) { sg.addColorStop(0, 'rgba(255,232,180,0.55)'); sg.addColorStop(1, 'rgba(255,200,120,0)'); }
    else { sg.addColorStop(0, 'rgba(200,220,255,0.35)'); sg.addColorStop(1, 'rgba(150,180,255,0)'); }
    g.fillStyle = sg; g.beginPath(); g.arc(sx, sy, sr, 0, 7); g.fill();
    // диск и объёмные лучи — то самое «солнце сквозь пыль»
    if (night < 0.55) {
      const daylight = 1 - night / 0.55;
      g.fillStyle = 'rgba(255,244,214,' + (0.5 * daylight) + ')';
      g.beginPath(); g.arc(sx, sy, 26, 0, 7); g.fill();
      g.save();
      g.globalCompositeOperation = 'lighter';
      g.translate(sx, sy);
      const rot = this.time * 0.02;
      for (let i = 0; i < 9; i++) {
        const a = rot + i * (Math.PI * 2 / 9);
        const wdt = 0.05 + hash2(i, 3) * 0.09;
        const len = 620 + hash2(i, 9) * 420;
        const rg = g.createLinearGradient(0, 0, Math.cos(a) * len, Math.sin(a) * len);
        rg.addColorStop(0, 'rgba(255,226,164,' + (0.16 * daylight) + ')');
        rg.addColorStop(1, 'rgba(255,200,120,0)');
        g.fillStyle = rg;
        g.beginPath();
        g.moveTo(0, 0);
        g.lineTo(Math.cos(a - wdt) * len, Math.sin(a - wdt) * len);
        g.lineTo(Math.cos(a + wdt) * len, Math.sin(a + wdt) * len);
        g.fill();
      }
      g.restore();
    }

    // звёзды
    if (night > 0.35) {
      g.globalAlpha = (night - 0.35) * 1.2;
      for (let i = 0; i < 90; i++) {
        const h = hash2(i * 13, 7), h2 = hash2(i * 7, 31);
        g.fillStyle = 'rgba(220,230,255,' + (0.3 + h * 0.7) + ')';
        g.fillRect((h * UI.W + this.cam.x * 0.02) % UI.W, h2 * UI.H * 0.55, 1.6, 1.6);
      }
      g.globalAlpha = 1;
    }

    // облака радиоактивной хмари
    g.globalAlpha = 0.2;
    for (let l = 0; l < 3; l++) {
      const off = (this.cam.x * (0.03 + l * 0.02)) % (UI.W + 400);
      for (let i = 0; i < 5; i++) {
        const h = hash2(l * 31 + i, 5);
        const cx = (i * 320 + h * 200 - off + UI.W + 400) % (UI.W + 400) - 200;
        const cy = 40 + l * 60 + h * 40;
        const cg = g.createRadialGradient(cx, cy, 0, cx, cy, 160);
        cg.addColorStop(0, 'rgba(' + (night > 0.5 ? '40,44,52' : '180,170,140') + ',0.5)');
        cg.addColorStop(1, 'rgba(0,0,0,0)');
        g.fillStyle = cg;
        g.beginPath(); g.ellipse(cx, cy, 170, 44, 0, 0, 7); g.fill();
      }
    }
    g.globalAlpha = 1;

    // дальние силуэты города (параллакс)
    const horizon = UI.H * 0.72;
    for (let layer = 0; layer < 2; layer++) {
      const par = 0.08 + layer * 0.12;
      const off = (this.cam.x * par) % 600;
      g.fillStyle = layer === 0
        ? 'rgba(' + (night > 0.5 ? '18,20,26' : '86,84,80') + ',0.55)'
        : 'rgba(' + (night > 0.5 ? '10,11,14' : '58,54,50') + ',0.75)';
      for (let seg = -1; seg < Math.ceil(UI.W / 600) + 1; seg++) {
        const bx = seg * 600 - off;
        const rand = mulberry32(1000 + layer * 77 + seg * 13);
        let x = bx;
        while (x < bx + 600) {
          const w = 22 + rand() * 60, h = 40 + rand() * (layer ? 150 : 90);
          const y = horizon - h + layer * 30;
          g.fillRect(x, y, w, h + 200);
          if (rand() < 0.3) g.fillRect(x + w * 0.4, y - 26, 4, 26);
          x += w + 6 + rand() * 24;
        }
      }
    }
    // пыльная дымка у горизонта
    const hz = g.createLinearGradient(0, horizon - 120, 0, horizon + 80);
    hz.addColorStop(0, 'rgba(0,0,0,0)');
    hz.addColorStop(1, night > 0.5 ? 'rgba(18,20,26,0.6)' : 'rgba(168,142,104,0.28)');
    g.fillStyle = hz; g.fillRect(0, horizon - 120, UI.W, 200);
  },

  // ---- свет: ночь + подземная тьма + источники ----
  // Дымка воздушной перспективы: дальнее светлее и мутнее — отсюда глубина
  drawHaze(g) {
    const night = this.nightAmount();
    const warm = 1 - night;
    const horizon = UI.H * 0.72;
    const hz = g.createLinearGradient(0, horizon - 240, 0, horizon + 100);
    hz.addColorStop(0, 'rgba(0,0,0,0)');
    hz.addColorStop(0.55, 'rgba(' + (warm > 0.5 ? '226,196,150' : '60,66,86') + ',' + (0.14 + warm * 0.2) + ')');
    hz.addColorStop(1, 'rgba(' + (warm > 0.5 ? '210,180,140' : '40,44,60') + ',0)');
    g.fillStyle = hz;
    g.fillRect(0, horizon - 240, UI.W, 340);
    // пылинки в лучах
    if (warm > 0.35) {
      g.save();
      g.globalCompositeOperation = 'lighter';
      for (let i = 0; i < 42; i++) {
        const h = hash2(i * 17, 3), h2 = hash2(i * 5, 29);
        const px = (h * UI.W + this.cam.x * 0.25 + this.time * 6 * (0.4 + h2)) % UI.W;
        const py = (h2 * UI.H * 0.8 + Math.sin(this.time * 0.6 + i) * 14 + UI.H) % UI.H;
        g.fillStyle = 'rgba(255,232,190,' + ((0.05 + h * 0.1) * warm) + ')';
        g.beginPath(); g.arc(px, py, 1 + h2 * 2.2, 0, 7); g.fill();
      }
      g.restore();
    }
  },

  // Цветокоррекция кадра: тёплый свет, холодная тень. Один проход заливкой
  drawGrade(g) {
    const night = this.nightAmount();
    g.save();
    g.globalCompositeOperation = 'soft-light';
    g.fillStyle = night > 0.5 ? 'rgba(60,80,140,0.34)' : 'rgba(255,186,110,0.30)';
    g.fillRect(0, 0, UI.W, UI.H);
    g.globalCompositeOperation = 'overlay';
    g.fillStyle = 'rgba(40,36,30,0.10)';
    g.fillRect(0, 0, UI.W, UI.H);
    g.restore();
  },

  drawLight(g) {
    const l = this.lctx;
    const night = this.nightAmount();
    // холст света вдвое меньше экрана — рисуем в тех же координатах через масштаб
    l.setTransform(0.5, 0, 0, 0.5, 0, 0);
    l.clearRect(0, 0, UI.W, UI.H);
    l.globalCompositeOperation = 'source-over';

    // базовая тьма ночи
    const nAlpha = clamp(night * 0.66 + Weather.darkness() * 0.5, 0, 0.9);   // погода темнит дополнительно
    if (nAlpha > 0.01) { l.fillStyle = 'rgba(8,11,22,' + nAlpha + ')'; l.fillRect(0, 0, UI.W, UI.H); }

    // подземная тьма: три слоя, повторяющие рельеф — без вертикальных швов
    const step = 6;
    for (const [off, alpha] of [[10, 0.34], [70, 0.34], [150, 0.42]]) {
      l.fillStyle = 'rgba(4,4,7,' + alpha + ')';
      l.beginPath();
      let started = false;
      for (let sxp = 0; sxp <= UI.W + step; sxp += step) {
        const wx = this.cam.x + sxp / this.zoom;
        const cx = clamp(Math.floor(wx / CELL), 0, WW - 1);
        const sy = ((World.surface[cx] + 3) * CELL - this.cam.y) * this.zoom + off;
        if (!started) { l.moveTo(0, sy); started = true; }
        else l.lineTo(sxp, sy);
      }
      l.lineTo(UI.W, UI.H); l.lineTo(0, UI.H); l.closePath();
      l.fill();
    }

    // источники света вырезают тьму
    l.globalCompositeOperation = 'destination-out';
    const lights = Machines.lights().concat(City.lights()).concat(Explosions.lights()).concat(Throwables.lights());
    lights.push({ x: Player.x, y: Player.y - 26, r: 165, i: 0.85 });  // фонарь на поясе
    for (const s of lights) {
      const p = this.toScreen(s.x, s.y);
      const r = s.r * this.zoom * 0.5;
      if (p.x < -r || p.x > UI.W + r || p.y < -r || p.y > UI.H + r) continue;
      const gr = l.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      gr.addColorStop(0, 'rgba(0,0,0,' + s.i + ')');
      gr.addColorStop(0.55, 'rgba(0,0,0,' + s.i * 0.45 + ')');
      gr.addColorStop(1, 'rgba(0,0,0,0)');
      l.fillStyle = gr;
      l.beginPath(); l.arc(p.x, p.y, r, 0, 7); l.fill();
    }
    l.globalCompositeOperation = 'source-over';

    // тёплая подсветка от огня
    for (const s of lights) {
      if (s.r < 100) continue;
      const p = this.toScreen(s.x, s.y);
      const r = s.r * this.zoom * 0.55;
      const gr = l.createRadialGradient(p.x, p.y, 0, p.x, p.y, r);
      gr.addColorStop(0, 'rgba(255,178,80,0.20)');
      gr.addColorStop(1, 'rgba(255,150,60,0)');
      l.fillStyle = gr; l.beginPath(); l.arc(p.x, p.y, r, 0, 7); l.fill();
    }

    g.drawImage(this.lightCanvas, 0, 0, UI.W / 2, UI.H / 2, 0, 0, UI.W, UI.H);
  },

  draw() {
    const g = this.ctx;
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.imageSmoothingEnabled = true;

    if (UI.screen === 'menu') { UI.drawMenu(g); return; }
    if (UI.screen === 'custom') { UI.drawCustom(g); return; }

    this.drawBackground(g);
    this.drawHaze(g);

    // мир
    const shx = this.shake ? rnd(-this.shake, this.shake) : 0;
    const shy = this.shake ? rnd(-this.shake, this.shake) : 0;
    g.save();
    g.translate(shx, shy);
    g.scale(this.zoom, this.zoom);
    g.translate(-this.cam.x, -this.cam.y);
    const view = { x: this.cam.x, y: this.cam.y, w: UI.W / this.zoom, h: UI.H / this.zoom };
    // тот же прямоугольник доступен всем системам: по нему они отсекают то,
    // что за экраном, и не тратят кадр на невидимое
    this.view = view;

    World.draw(g, view);
    City.draw(g);
    Home.draw(g);
    Machines.draw(g);
    Nodes.draw(g);
    Structures.draw(g);
    Doors.draw(g);
    // призрак детали под курсором, когда в руке план
    const handIt = Player.handItem();
    if (handIt && handIt.type === 'plan' && !Player.dead) {
      this.ghost = Structures.drawGhost(g, PARTS[Player.planPart].id, Player.planTier);
    } else this.ghost = null;
    Drops.draw(g);
    Zombies.draw(g);

    // игрок
    if (!Player.dead) {
      const it = Player.handItem();
      g.fillStyle = 'rgba(0,0,0,0.3)';
      g.beginPath(); g.ellipse(Player.x, Player.y, 9, 2.4, 0, 0, 7); g.fill();
      drawHuman(g, Player.x, Player.y, Player.look, {
        face: Player.face, phase: Player.phase, moving: Math.abs(Player.vx) > 0.1,
        air: !Player.onGround, mask: Player.mask,
        coat: Player.worn.coat, hood: Player.worn.hood,
        dig: Player.digAnim,
        item: it ? (it.type === 'tool' ? (it.wood ? 'axe' : 'pick') : it.type === 'melee' ? 'club' : null) : null,
        aim: it && it.type === 'gun' ? it.kind : null,
        aimAng: Player.aimAng, recoil: Player.recoil
      });
    }

    Bullets.draw(g);
    Throwables.draw(g);
    Explosions.draw(g);
    Particles.draw(g);
    Floaters.draw(g);

    // рамка цели копания
    const it2 = Player.handItem();
    if (!Player.dead && (!it2 || it2.type !== 'gun')) {
      const cx = Math.floor(Input.wx / CELL), cy = Math.floor(Input.wy / CELL);
      if (dist(Player.x, Player.y - 28, Input.wx, Input.wy) < Player.reach()) {
        g.strokeStyle = 'rgba(240,232,200,0.55)'; g.lineWidth = 0.6;
        g.strokeRect(cx * CELL - CELL, cy * CELL - CELL, CELL * 3, CELL * 3);
      }
    }
    g.restore();

    this.drawLight(g);
    Weather.draw(g);
    this.drawGrade(g);
    // холод: иней по краям кадра и лёгкое посинение
    if (Player.warm < 40 && !Player.dead) {
      const c = (40 - Player.warm) / 40;
      const fg = g.createRadialGradient(UI.W / 2, UI.H / 2, UI.H * 0.3, UI.W / 2, UI.H / 2, UI.H * 0.95);
      fg.addColorStop(0, 'rgba(120,170,220,0)');
      fg.addColorStop(1, 'rgba(150,195,235,' + (c * 0.3) + ')');
      g.fillStyle = fg; g.fillRect(0, 0, UI.W, UI.H);
    }
    // заражение: мутный зелёный пульс по краям
    if (Player.infection > 25 && !Player.dead) {
      const c = clamp((Player.infection - 25) / 75, 0, 1);
      const ig = g.createRadialGradient(UI.W / 2, UI.H / 2, UI.H * 0.35, UI.W / 2, UI.H / 2, UI.H);
      ig.addColorStop(0, 'rgba(70,110,60,0)');
      ig.addColorStop(1, 'rgba(84,124,64,' + (c * (0.26 + Math.sin(performance.now() / 700) * 0.06)) + ')');
      g.fillStyle = ig; g.fillRect(0, 0, UI.W, UI.H);
    }

    // прицел
    if (!Player.dead && UI.screen === null) {
      const it = Player.handItem();
      if (it && it.type === 'gun') {
        g.strokeStyle = 'rgba(255,230,180,0.8)'; g.lineWidth = 1.4;
        const sp = 6 + Player.recoil * 5;
        g.beginPath();
        g.moveTo(Input.mx - sp - 5, Input.my); g.lineTo(Input.mx - sp, Input.my);
        g.moveTo(Input.mx + sp, Input.my); g.lineTo(Input.mx + sp + 5, Input.my);
        g.moveTo(Input.mx, Input.my - sp - 5); g.lineTo(Input.mx, Input.my - sp);
        g.moveTo(Input.mx, Input.my + sp); g.lineTo(Input.mx, Input.my + sp + 5);
        g.stroke();
      }
    }

    // виньетка и «стекло противогаза»
    const vg = g.createRadialGradient(UI.W / 2, UI.H / 2, UI.H * 0.45, UI.W / 2, UI.H / 2, UI.H * 1.0);
    vg.addColorStop(0, 'rgba(0,0,0,0)');
    vg.addColorStop(1, 'rgba(0,0,0,0.34)');
    g.fillStyle = vg; g.fillRect(0, 0, UI.W, UI.H);
    if (Player.mask) {
      g.strokeStyle = 'rgba(18,22,18,0.30)'; g.lineWidth = 26;
      g.beginPath(); g.ellipse(UI.W / 2, UI.H / 2, UI.W * 0.505, UI.H * 0.55, 0, 0, 7); g.stroke();
      g.fillStyle = 'rgba(130,160,140,0.028)'; g.fillRect(0, 0, UI.W, UI.H);
    }
    // плёночное зерно: чуть-чуть, только чтобы убрать пластиковую гладкость
    g.save();
    g.globalAlpha = 0.045;
    for (let i = 0; i < 130; i++) {
      g.fillStyle = Math.random() < 0.5 ? '#fff' : '#000';
      g.fillRect(Math.random() * UI.W, Math.random() * UI.H, 1.6, 1.6);
    }
    g.restore();

    // красный пульс при низком здоровье
    if (Player.hp < 35 && !Player.dead) {
      g.fillStyle = 'rgba(140,20,16,' + (0.10 + Math.sin(performance.now() / 220) * 0.05) * (1 - Player.hp / 35) + ')';
      g.fillRect(0, 0, UI.W, UI.H);
    }
    // радиационные помехи
    if (Player.rad > 40) {
      g.globalAlpha = (Player.rad - 40) / 200;
      for (let i = 0; i < 40; i++) {
        g.fillStyle = Math.random() < 0.5 ? '#b8d84a' : '#000';
        g.fillRect(Math.random() * UI.W, Math.random() * UI.H, rnd(2, 40), 1);
      }
      g.globalAlpha = 1;
    }

    if (!Player.dead) UI.drawHUD(g);
    if (!this.introDone && UI.screen === null) UI.drawIntro(g);

    if (UI.screen === 'map') UI.drawMap(g);
    else if (UI.screen === 'skills') UI.drawSkills(g);
    else if (UI.screen === 'shop') UI.drawShop(g);
    else if (UI.screen === 'board') UI.drawBoard(g);
    else if (UI.screen === 'inv') UI.drawInv(g);
    else if (UI.screen === 'body') UI.drawBody(g);
    else if (UI.screen === 'craft') UI.drawCraft(g);
    else if (UI.screen === 'options') UI.drawOptions(g);
    else if (UI.screen === 'dead') UI.drawDead(g);
  }
};

// Запуск. Просто слушать 'load' нельзя: если браузер восстановил страницу из
// кэша или предзагрузил её, событие успевает пройти до того, как этот файл
// подключился, — и игра не стартует, оставляя чёрный экран. Поэтому сначала
// проверяем, не загружено ли всё уже.
if (document.readyState === 'complete') Game.init();
else addEventListener('load', () => Game.init(), { once: true });

</script>
</body>
